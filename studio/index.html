<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varietypack Studio</title>
  <style>/* The studio's own styles. Not a puzzle theme: system fonts, neutral colors,
   1px borders. */
[hidden] { display: none !important; }

:root {
  --paper: #eef1f5;
  --surface: #ffffff;
  --sunk: #e4e9ef;
  --ink: #17202c;
  --muted: #586476;
  --line: #ccd4de;
  --block: #1d2733;
  --cut1: #2251c0;
  --cut2: #b0560c;
  --bad: #b4231a;
  --good: #2c7a4b;
  --warn: #7a5bb5;
  --focus: #17202c;
  --scrim: rgba(23, 32, 44, .42);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1318; --surface: #171d25; --sunk: #1f2631; --ink: #e2e7ee; --muted: #97a2b2;
    --line: #2c3542; --block: #04070b; --cut1: #84a9ff; --cut2: #f3a65a; --bad: #ff8a7a;
    --good: #72d39a; --warn: #c3a6ff; --focus: #e2e7ee; --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
#app { height: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { padding: 1px 4px; border-radius: 4px; background: var(--sunk); font-family: var(--font-mono); font-size: .9em; }

/* ── shared controls ─────────────────────────────────────────────────────── */
.btn { padding: 6px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 13.5px; font-weight: 500; line-height: 1.3; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); }
.btn.primary { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.seg { display: inline-flex; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg-btn { padding: 6px 12px; border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.check input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }
.check.off { opacity: .6; cursor: default; }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld > span { color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.fld select, .check select, .pv-bar select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }
.note { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--sunk); color: var(--muted); font-size: 13px; }

/* ── the page: top bar, message, one screen ──────────────────────────────── */
#studio { display: flex; flex-direction: column; height: 100%; }
#toolbar { position: relative; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 56px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { font-size: 17px; font-weight: 600; }
.home { padding: 6px 9px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
.home:hover { background: var(--sunk); color: var(--ink); }
.doc { display: grid; gap: 1px; min-width: 0; }
#doc-title { font-size: 16px; font-weight: 600; line-height: 1.2; }
#doc-meta { color: var(--muted); font-size: 12px; }
#save-status { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
#save-status::before { content: "●"; margin-right: 5px; color: var(--good); font-size: 9px; vertical-align: 2px; }
#save-status.failed::before { color: var(--bad); }
.top-mid { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-inline: auto; }
.top-end { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
.top-mid + .top-end { margin-left: 0; }
.anchor { position: relative; }
#problems-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid transparent; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: var(--sunk); color: var(--muted); }
#problems-chip.ok { background: color-mix(in srgb, var(--good) 13%, var(--surface)); color: var(--good); }
#problems-chip.bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); }
.pop { position: absolute; top: calc(100% + 6px); z-index: 5; display: grid; gap: 6px; min-width: 260px; max-width: min(420px, calc(100vw - 48px)); padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 10px 24px color-mix(in srgb, var(--ink) 18%, transparent); }
.pop.right { right: 0; }
.pop.mid { left: 50%; transform: translateX(-50%); }
.menu-item { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: 14px; cursor: pointer; }
.menu-item:hover { background: var(--sunk); }
.menu-item small { display: block; color: var(--muted); font-size: 12px; }
#diagnostics ul { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
#diagnostics li { display: flex; gap: 8px; padding: 4px 6px; font-size: 13.5px; }
#diagnostics .lvl { flex: none; width: 58px; font-size: 11px; font-weight: 600; letter-spacing: .06em; line-height: 1.7; text-transform: uppercase; }
.diag-parse .lvl, .diag-error .lvl { color: var(--bad); }
.diag-warning .lvl { color: var(--warn); }
.diag-note .lvl { color: var(--muted); }
.diag-ok { color: var(--good); }

#message { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); font-size: 13.5px; }
#message span { flex: 1; }

.body { display: grid; grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
.body > section { min-width: 0; min-height: 0; }
.pane-scroll { overflow: auto; }
.body.muddled { grid-template-columns: 340px minmax(0, 1fr); }

/* ── start screen ────────────────────────────────────────────────────────── */
#welcome { display: grid; gap: 22px; align-content: start; max-width: 1180px; width: 100%; margin-inline: auto; padding: 26px 22px 34px; }
#welcome h2 { margin: 0; font-size: 26px; line-height: 1.15; }
#welcome .lede { margin: 6px 0 0; color: var(--muted); }
.start-cols { display: grid; gap: 22px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
.sec-title { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.kinds { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); }
.kind-card { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.kind-card svg { grid-row: span 2; width: 44px; height: 44px; }
.kind-card svg .k1 { fill: none; stroke: var(--cut1); stroke-width: 2.2; stroke-linecap: round; }
.kind-card svg .k2 { fill: none; stroke: var(--cut2); stroke-width: 2.2; }
.kind-card svg .kc { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }
.kind-card svg .kb { fill: var(--block); }
.kind-card h3 { margin: 0; font-size: 16px; line-height: 1.2; }
.kind-card p { margin: 0; color: var(--muted); font-size: 13px; }
.kind-card .acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.drafts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.draft-item { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.draft-text { flex: 1 1 160px; min-width: 0; }
.draft-title { display: block; font-weight: 600; overflow-wrap: anywhere; }
.draft-meta { color: var(--muted); font-size: 12.5px; }
.draft-confirm { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--bad); font-size: 13px; }
.empty { margin: 0; color: var(--muted); font-style: italic; }

/* ── editor ──────────────────────────────────────────────────────────────── */
.ed { display: grid; gap: 14px; padding: 14px 18px 18px; }
#edit-view .ed:not(.structured) { height: 100%; grid-template-rows: auto minmax(0, 1fr); }
.ed-hint { margin: 0; color: var(--muted); font-size: 13px; }
#yaml-editor { width: 100%; height: 100%; min-height: 240px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font: 13px/1.55 var(--font-mono); resize: none; tab-size: 2; }

/* ── muddled panel ───────────────────────────────────────────────────────── */
#muddled-panel { display: grid; gap: 14px; align-content: start; padding: 18px; border-right: 1px solid var(--line); background: var(--surface); overflow: auto; }
#muddled-panel h2 { margin: 0; font-size: 22px; line-height: 1.2; }
#muddled-panel .by { margin: 2px 0 0; color: var(--muted); }
.lock { display: grid; gap: 4px; padding: 10px 12px; border-radius: 10px; background: var(--sunk); font-size: 13.5px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }

/* ── preview ─────────────────────────────────────────────────────────────── */
.pane-preview { display: flex; flex-direction: column; min-height: 0; background: var(--sunk); }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.pv-bar .lbl { color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.badge { padding: 3px 9px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; }
.badge.stale { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); }
.badge.solved { background: var(--ink); color: var(--paper); font-weight: 600; }
.pv-end { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.pv-stage { position: relative; flex: 1; display: flex; justify-content: center; min-height: 0; }
.pv-stage iframe { flex: 1 1 auto; width: 100%; max-width: 100%; height: 100%; border: 0; background: #fff; }
.pv-stage iframe.phone { flex: 0 0 390px; width: 390px; margin-block: 14px; height: calc(100% - 28px); border: 1px solid var(--line); box-shadow: 0 6px 18px color-mix(in srgb, var(--ink) 16%, transparent); }
.pv-empty { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 20px; background: var(--sunk); color: var(--muted); text-align: center; }

/* ── export panel ────────────────────────────────────────────────────────── */
#export-panel { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 18px; border: 0; border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 40px rgba(0, 0, 0, .25); }
#export-panel::backdrop { background: var(--scrim); }
#export-panel[open] { display: grid; gap: 14px; overflow: auto; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 21px; line-height: 1.2; }
.sheet-head p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.sheet-head .btn { margin-left: auto; }
#export-blocked { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 9%, var(--surface)); color: var(--bad); font-size: 13.5px; }
.files { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.export-file { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.export-file.best { border-color: var(--ink); }
.export-file h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin: 0; font-size: 15px; }
.best-tag { padding: 1px 7px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 10.5px; font-weight: 600; letter-spacing: .06em; line-height: 1.6; text-transform: uppercase; }
.export-file p { grid-column: 1; margin: 0; color: var(--muted); font-size: 13.5px; }
.export-file .btn { grid-column: 2; grid-row: 1 / span 2; }
.size { color: var(--muted); font: 500 12px var(--font-mono); }
#export-font { display: grid; gap: 8px; padding: 12px; border: 0; border-radius: 10px; background: var(--sunk); font-size: 13.5px; }
#export-font legend { padding: 0; font-size: 14px; font-weight: 600; }
#export-font label { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
#export-font p { margin: 0; color: var(--muted); }

/* ── narrow screens ──────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .body.muddled { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; overflow: auto; }
  .body.muddled .pane-preview { min-height: 640px; border-top: 1px solid var(--line); }
  #muddled-panel { border-right: 0; }
  .start-cols { grid-template-columns: minmax(0, 1fr); }
  .top-mid { margin-inline: 0; }
}
@media (max-width: 600px) {
  input, textarea, select { font-size: 16px; }
  .ed { padding: 12px; }
  .export-file { grid-template-columns: minmax(0, 1fr); }
  .export-file .btn { grid-column: 1; grid-row: auto; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── structured editors ─────────────────────────────────────────────────── */
:root { --inward: var(--cut1); --outward: var(--cut2); --on-dir: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --on-dir: #0f1318; } }

.ed.structured { align-content: start; }
.ed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.seg.small .seg-btn { padding: 4px 10px; font-size: 12.5px; }
.seg-btn.in[aria-pressed="true"] { background: var(--inward); color: var(--on-dir); }
.seg-btn.out[aria-pressed="true"] { background: var(--outward); color: var(--on-dir); }
.err { margin: 0; color: var(--bad); font-size: 13px; }
.hint { margin: 0; color: var(--muted); font-size: 12.5px; }
.warn { color: var(--bad); }
.diag-jump { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; text-decoration: underline; text-decoration-color: var(--line); cursor: pointer; }
.diag-jump:hover { text-decoration-color: currentColor; }

.editor { display: grid; gap: 14px; min-width: 0; }
.seq { display: grid; gap: 6px; }
.seq label { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.seq-row { display: flex; gap: 6px; }
#sequence-field, #line-field { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font: 500 14px var(--font-mono); letter-spacing: .05em; }

.board-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.tools, .meters { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.btn.on { background: var(--sunk); border-color: var(--ink); }
.btn.icon { padding: 2px 9px; }
.meter { padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.meter b { color: var(--ink); font: 600 13px var(--font-mono); }
.meter.bad b { color: var(--bad); }

.board { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); transition: box-shadow .15s; --dirc: var(--focus); }
.board.in { --dirc: var(--inward); }
.board.out { --dirc: var(--outward); }
.board:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--dirc) 30%, transparent); }
.board svg { display: block; width: 100%; max-width: 640px; height: auto; margin-inline: auto; touch-action: manipulation; }
/* Off-screen but focusable, like the engines' hidden input; fixed so focusing it never
   scrolls. */
.board-input { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
.sp-curl { fill: none; stroke: var(--line); stroke-width: 1.5; }
.sp-cell { fill: var(--surface); stroke: var(--line); stroke-width: 1; cursor: pointer; }
.sp-cell.shade-0 { fill: color-mix(in srgb, var(--dirc) 7%, var(--surface)); }
.sp-cell.shade-1 { fill: color-mix(in srgb, var(--dirc) 20%, var(--surface)); }
.sp-cell.active { fill: color-mix(in srgb, var(--dirc) 34%, var(--surface)); }
.sp-circle { fill: none; stroke: var(--muted); stroke-width: 1.4; pointer-events: none; }
.sp-break { stroke-linecap: round; pointer-events: none; }
.sp-break.in { stroke: var(--inward); }
.sp-break.out { stroke: var(--outward); }
.sp-break.weak { stroke-opacity: .32; }
.sp-num { fill: var(--muted); font-family: var(--font-mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.sp-ltr { fill: var(--ink); font-family: var(--font-mono); font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.sp-caret { fill: none; stroke: var(--focus); stroke-width: 2.6; pointer-events: none; stroke-opacity: .4; }
.board:focus-within .sp-caret { stroke-opacity: 1; }
.sp-caret.composing { stroke-dasharray: 5 4; }
.sp-gap { stroke: var(--ink); stroke-opacity: 0; pointer-events: stroke; cursor: pointer; }
.sp-gap:hover { stroke-opacity: .16; }
.keys { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 2; }
kbd { margin-right: 2px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--ink); font: 500 11px var(--font-mono); }

.clues { display: grid; gap: 12px; min-width: 0; }
.clues-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.clues-head h3 { margin: 0; font-size: 18px; line-height: 1.2; }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); align-items: start; }
.card { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.card.inward, .list.inward { --dc: var(--inward); }
.card.outward, .list.outward { --dc: var(--outward); }
.card.main { border-color: var(--dc); box-shadow: 0 0 0 1px var(--dc); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.card-nav { display: flex; gap: 4px; margin-left: auto; }
.chip { display: inline-block; padding: 4px 7px; border-radius: 4px; background: var(--dc, var(--ink)); color: var(--on-dir); font-size: 11px; font-weight: 600; letter-spacing: .08em; line-height: 1; text-transform: uppercase; }
.entry-range { color: var(--muted); font: 500 12px var(--font-mono); }
.tag { margin-left: auto; color: var(--muted); font-size: 12px; }
.tiles { display: flex; flex-wrap: wrap; gap: 4px; }
.entry-tile { position: relative; display: grid; place-items: center; min-width: 34px; height: 40px; padding: 8px 4px 0; border: 1px solid var(--line); border-radius: 5px; background: color-mix(in srgb, var(--dc) 10%, var(--surface)); font: 600 15px/1 var(--font-mono); cursor: pointer; }
.entry-tile small { position: absolute; top: 3px; left: 4px; color: var(--muted); font: 500 8.5px/1 var(--font-mono); }
.entry-tile.multi { font-size: 12px; }
.entry-tile.here { outline: 2px solid var(--focus); outline-offset: 1px; }
.entry-tile.circled::after { content: ""; position: absolute; left: 50%; top: 56%; width: 26px; height: 26px; transform: translate(-50%, -50%); border: 1.5px solid var(--muted); border-radius: 50%; pointer-events: none; }
.fld textarea, .fld input { width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 14.5px; resize: vertical; }
.fld small { color: var(--muted); font-size: 12px; }

.clue-cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
.list h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; color: var(--muted); font-size: 12.5px; font-weight: 500; }
.list ol { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.clue-row { display: grid; gap: 5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.clue-row.on { border-color: var(--dc); background: color-mix(in srgb, var(--dc) 9%, var(--surface)); }
.pick { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.clue-label, .clue-answer { padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
.clue-label { flex: none; min-width: 46px; color: var(--muted); font: 500 12px var(--font-mono); }
.clue-answer { min-width: 0; overflow-wrap: anywhere; font: 600 14px var(--font-mono); letter-spacing: .05em; }
.clue-input { display: block; width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: var(--sunk); font-size: 14px; line-height: 1.45; resize: none; overflow: hidden; }
.clue-input:focus { border-color: var(--dc); background: var(--surface); outline: none; }

.orphans { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); }
.orphans h3 { margin: 0; font-size: 14px; }
.orphans small { color: var(--muted); font-weight: 400; }
.orphan { display: grid; gap: 6px; }
.orphan p { margin: 0; }
.orphan-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.orphan-actions select { padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }

.settings { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.settings h3 { margin: 0; font-size: 18px; line-height: 1.2; }
.set-grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); }

.size-form { display: grid; gap: 10px; margin-bottom: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); }
.size-form p { margin: 0; }
.size-fields { display: flex; flex-wrap: wrap; gap: 10px; }
.size-fields input { width: 110px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-family: var(--font-mono); }
.size-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* ── the ring (Snake Charmer) ───────────────────────────────────────────── */
.board-note { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.shape { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.shape select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 13px; letter-spacing: 0; text-transform: none; }
.rc { fill: var(--surface); stroke: var(--line); stroke-width: 1; cursor: pointer; }
.rc.shade-0 { fill: color-mix(in srgb, var(--dirc) 7%, var(--surface)); }
.rc.shade-1 { fill: color-mix(in srgb, var(--dirc) 20%, var(--surface)); }
.rc.active { fill: color-mix(in srgb, var(--dirc) 34%, var(--surface)); }
.rl { fill: var(--ink); font-family: var(--font-mono); font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.rcirc { fill: none; stroke: var(--muted); stroke-width: 1.4; pointer-events: none; }
.rnum { font: 600 9px var(--font-mono); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.rnum.l1 { fill: var(--inward); }
.rnum.l2 { fill: var(--outward); }
.rnum.clash { fill: var(--bad); }
.rsplit { stroke-width: 3.2; stroke-linecap: round; pointer-events: none; }
.rsplit.c1 { stroke: var(--inward); }
.rsplit.c2 { stroke: var(--outward); }
.rsplit.weak { stroke-opacity: .32; }
.rcaret { fill: none; stroke: var(--focus); stroke-width: 2.6; pointer-events: none; stroke-opacity: .4; }
.board:focus-within .rcaret { stroke-opacity: 1; }
.rcaret.composing { stroke-dasharray: 5 4; }
.rgap { stroke: var(--ink); stroke-opacity: 0; stroke-width: 11; pointer-events: stroke; cursor: pointer; }
.rgap:hover { stroke-opacity: .16; }
.clue-label.clash { color: var(--bad); font-weight: 700; }
.thumb { display: block; width: 100%; max-width: 360px; height: auto; margin: 4px 0; }
.t-cell { fill: var(--surface); stroke: var(--line); stroke-width: 1; }

/* ── the grid (Marching Bands) ──────────────────────────────────────────── */
.card.rows, .list.rows { --dc: var(--inward); }
.card.bands, .list.bands { --dc: var(--outward); }
.list .groups { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.clue-group h4 { margin: 0 0 4px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.clue-group ol { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.grid-cell { fill: var(--surface); stroke: var(--line); stroke-width: 1; cursor: pointer; }
.grid-cell.shade-0 { fill: color-mix(in srgb, var(--dirc) 7%, var(--surface)); }
.grid-cell.shade-1 { fill: color-mix(in srgb, var(--dirc) 20%, var(--surface)); }
.grid-cell.active { fill: color-mix(in srgb, var(--dirc) 34%, var(--surface)); }
.grid-block { fill: var(--block); stroke: var(--line); stroke-width: 1; pointer-events: none; }
.grid-circle { fill: none; stroke: var(--muted); stroke-width: 1.4; pointer-events: none; }
.grid-letter { fill: var(--ink); font-family: var(--font-mono); font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.grid-num { fill: var(--ink); font: 500 9.5px var(--font-mono); pointer-events: none; }
.grid-rownum { fill: var(--muted); font: 500 12px var(--font-mono); text-anchor: end; dominant-baseline: central; pointer-events: none; }
.grid-caret { fill: none; stroke: var(--focus); stroke-width: 2.6; pointer-events: none; stroke-opacity: .4; }
.board:focus-within .grid-caret { stroke-opacity: 1; }
.grid-caret.composing { stroke-dasharray: 5 4; }
.loop { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke: color-mix(in srgb, var(--dirc) 14%, var(--surface)); pointer-events: none; }
.loop.shade-1 { stroke: color-mix(in srgb, var(--dirc) 28%, var(--surface)); }
.loop.active { stroke: color-mix(in srgb, var(--dirc) 50%, var(--surface)); }
.split { stroke-width: 3; stroke-linecap: round; pointer-events: none; }
.split.c1 { stroke: var(--inward); }
.split.c2 { stroke: var(--outward); }
.split.weak { stroke-width: 1.4; stroke-opacity: .5; }
.entry-label { fill: var(--ink); font: 600 9.5px var(--font-mono); pointer-events: none; }
.split-hit { stroke: var(--ink); stroke-opacity: 0; stroke-width: 11; pointer-events: stroke; cursor: pointer; }
.split-hit:hover { stroke-opacity: .16; }
.t-b0 { fill: var(--surface); stroke: var(--line); stroke-width: .6; }
.t-b1 { fill: color-mix(in srgb, var(--cut2) 22%, var(--surface)); stroke: var(--line); stroke-width: .6; }
.t-blk { fill: var(--block); }
.set-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.set-row > span { color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.set-row b { font: 600 14px var(--font-mono); }

/* ── the Crushword editor ───────────────────────────────────────────────── */
.card.across, .list.across { --dc: var(--inward); }
.card.down, .list.down { --dc: var(--outward); }
.grid-block.pick { pointer-events: all; cursor: pointer; }
.grid-caret.on-block { stroke: #ffffff; stroke-opacity: 1; }
.grid-letter.over { fill: var(--bad); }
.text-caret { stroke: var(--focus); stroke-width: 1.6; pointer-events: none; animation: blink 1.1s steps(1) infinite; }
.board:not(:focus-within) .text-caret { animation: none; stroke-opacity: 0; }
@keyframes blink { 50% { stroke-opacity: 0; } }
.hatch-line { stroke: var(--bad); stroke-width: 2; stroke-opacity: .55; }
.check-noentry { fill: url(#check-hatch); pointer-events: none; }
.check-uncrossed { fill: var(--warn); pointer-events: none; }
.checks { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
.checks h3 { margin: 0; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .07em; line-height: 1; text-transform: uppercase; }
.checks .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.checks .check { margin-left: auto; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }
.check-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); font-size: 12.5px; }
.check-chip.ok::before { content: "✓"; color: var(--good); font-weight: 700; }
.check-chip.bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); }
.check-chip.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--warn); }
.t-new { fill: color-mix(in srgb, var(--cut1) 24%, var(--surface)); stroke: var(--line); stroke-width: 1; }


/* ── theme overrides (header form) ──────────────────────────────────────── */
.theme-tokens { display: grid; gap: 8px; margin: 12px 0; }
.theme-tokens .fld-label { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.theme-tokens .fld-label small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.token-row { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; align-items: center; }
#btn-add-token { justify-self: start; }
</style>

/* An ID or class rule that sets \`display\` on a [hidden] element (e.g. #menu-panel's
   \`display: flex\` below) otherwise outranks the UA [hidden] default by specificity,
   leaving the element stuck visible. */
[hidden] { display: none !important; }

/* iOS Safari enlarges text when a phone turns to landscape unless told not to, and the
   landscape phone layout (phone.css) counts on its line heights. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body { line-height: 1.4; }

/* Measurements other rules are computed from, here and in theme-components.css. Change
   one here and every position derived from it follows.
   --corner-*: the round buttons fixed in the page's corners (#keys-btn, #menu-btn,
   #help-btn): their size, their inset from the edges, and the gap between two of them
   and between a button and the panel it opens.
   --tap-min: the smallest side of anything tapped in the phone layout. */
:root {
  --corner-btn: 32px;
  --corner-inset: 20px;
  --corner-gap: 8px;
  --corner-btn-2: calc(var(--corner-inset) + var(--corner-btn) + var(--corner-gap));
  --tap-min: 44px;
}

/* Tools with a fixed active-clue bar reserve its height as body padding, and expose it
   as --active-clue-bar-space for anything positioned against the bar (#menu-btn and
   #menu-panel in theme-components.css, Crushword's sticky grid). The bar's min-height
   fills that space, and its clue text can never wrap (nowrap + ellipsis), so this is an
   exact height, not a floor \u2014 which is what makes calc()-only positioning against it
   exact. */
body.has-clue-bar {
  --active-clue-bar-space: 56px;
  padding-top: var(--active-clue-bar-space);
}

#active-clue-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  min-height: var(--active-clue-bar-space);
  padding: 5px 16px 4px;
}

.active-clue-row {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-size: 0.875rem;
  line-height: 1.4;
}

#active-clue-secondary {
  font-size: 0.8rem;
  opacity: 0.6;
}

.active-clue-num {
  font-weight: bold;
  flex-shrink: 0;
}

.active-clue-text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* By class, not id: the phone layout shows copies of #instructions (setupPhoneLayout),
   which carry the class but can't carry the id. */
.instructions {
  max-width: 600px;
  margin: 0 auto;
}

/* The page column and the clue lists look the same in every tool, so their sizes live
   here and not in a tool's base.css (docs/ARCHITECTURE.md \u2192 "Tool stylesheets"). */
.puzzle-main { max-width: 1300px; margin: 0 auto; padding: 20px 16px; }

.clue-section h2 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.clue-section :is(ul, ol) { list-style: none; }

.clue-item {
  display: flex;
  align-items: baseline;
  cursor: pointer;
  margin-bottom: 4px;
  padding: 2px 6px 2px 2px;
  font-size: 0.875rem;
  line-height: 1.4;
}

/* The number, label or cell range ahead of a clue's text. */
.clue-num {
  flex-shrink: 0;
  min-width: 1.6em;
  margin-right: 4px;
  font-size: 0.7rem;
  font-weight: bold;
  text-align: right;
}

.cell        { cursor: pointer; }
.cell-letter { pointer-events: none; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
.cell-num    { pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
.style-circle { pointer-events: none; }
/* The active cell's direction chevron (Spiral, Marching Bands). */
#direction-chevron { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

#controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

/* font-family is theme-components.css's: a button inherits no font from the page. */
button {
  cursor: pointer;
  border: 1px solid;
  padding: 6px 14px;
  font-size: 0.875rem;
}

/* Suppress double-tap-to-zoom and its tap delay on the in-solve controls, which are
   tapped repeatedly (#rebus-btn especially) so the delay is felt. Scoped to #controls

  html.phone.kb-left #clue-full { left: 0; right: auto; }
  /* A plain list (Marching Bands) hides the keyboard on the Clues screen, so the list
     takes the whole width. */
  html.phone #solve-view:has(> #drawn-kb[hidden]) #solve-stage { grid-column: 1 / -1; }
}

}

   puzzle regardless of solve state or theme. This file and the tool's print.css after
   it are the \`print\` cascade layer, the last one (composeThemeCss), so every rule here
   wins over any screen rule whatever its selector, with no !important: a theme that
   adds a more specific highlight rule can't defeat the print reset. Between this file
   and a tool's print.css the usual rules hold (specificity, then order).

   A screen rule still applies in print unless a print rule overrides it, so a print
   rule that relies on a container being flex or grid must declare that display itself:
   a narrow-screen breakpoint may have set display: block on it. */
@media print {
  /* Hide interaction chrome */
  #active-clue-bar,
  #controls,
  #congrats-dialog,
  #keys-overlay,
  #keys-btn,
  #menu-btn,
  #menu-panel,
  #help-btn,
  #help-panel,
  #done-wrong,
  #direction-chevron,
  .solve-top,
  #solve-bar,
  .edge-shadows,
  #drawn-kb { display: none; }

  body { padding-top: 0; }
  h1.title { font-size: 1.4rem; }

  /* A tighter page than on screen, the same in every tool */
  .puzzle-main     { padding: 8px 16px; }
  .puzzle-header   { margin-bottom: 8px; }
  .byline          { font-size: 0.8rem; }
  #instructions    { font-size: 0.8rem; margin-bottom: 8px; }
  .clue-section h2 { margin-bottom: 4px; }
  .clue-item       { margin-bottom: 0; padding: 1px 4px; break-inside: avoid; }
  .cell-num        { fill: #555; }

  /* Cell state \u2192 plain ink on white */
  .cell,
  .cell.active-entry,
  .cell.active-cell,
  .cell.secondary-entry { fill: #fff; stroke: #999; stroke-width: 1; stroke-dasharray: none; }

  /* Entered letters and their marks \u2192 blank: a printout is always the unsolved puzzle */
  .cell-letter,
  .mark-layer { display: none; }
  /* ...and the phone list view's cell rows (setupFillList), which repeat them */
  .list-cells { display: none; }

  /* Clue highlight / filled-dimming reset */
  .clue-item.active-clue,
  .clue-item.secondary-entry { background: transparent; }
  .clue-item.filled .clue-text { opacity: 1; text-decoration: none; }

  /* A link prints in the color of the text around it: a theme's link color is chosen
     against its screen background, which paper doesn't have. */
  a { color: inherit; }

  /* The phone layout prints its own arrangement: the page's gutter is on the header and
     instructions (phone.css), and .puzzle-body is empty there. The html.phone prefix is
     what outranks the .puzzle-main rule above and each tool's print.css, which shares
     this layer and sets .puzzle-body. */
  html.phone .puzzle-main { padding: 0; }
  html.phone .puzzle-body { display: none; }
}
`,"/varietypack/shared/themes/skeleton-tokens.css":`/* Skeleton theme \u2014 dark purple, strong personality. Overrides theme-base. */
:root {
  --theme-font-body:    'Outfit', system-ui, sans-serif;
  --theme-font-display: 'Outfit', system-ui, sans-serif;
  --theme-font-button:  'Outfit', system-ui, sans-serif;
  --theme-font-cell:    'Outfit', system-ui, sans-serif;

  --theme-color-header-rule: #7c3aed;
  --theme-title-tracking:    0.06em;
  --theme-title-transform:   uppercase;
  --theme-color-title:       #f0e6ff;
  --theme-byline-style:      normal;
  --theme-byline-size:       0.9rem;

  --theme-color-bg:    #1a1520;
  --theme-color-text:  #ede9fe;
  --theme-color-muted: #a78bfa;
  --theme-color-link:  #c4b5fd;

  --theme-color-bar-border:  #7c3aed;
  --theme-color-soft-border: #4c3a6e;

  --theme-color-btn-bg:       #7c3aed;
  --theme-button-tracking:    0.08em;

  --theme-color-btn2-bg:     #1e1728;
  --theme-color-btn2-border: #7c3aed;
  --theme-color-btn2-hover:  #2d1f5e;

  --theme-color-clear-fg:       #7c5aad;
  --theme-color-clear-hover-fg: #a78bfa;

  --theme-color-cell-bg:     #1e1728;
  --theme-color-cell-stroke: #4c3a6e;
  --theme-color-cell-text:   #ffffff;

  --theme-color-highlight:       #2d1f5e;
  --theme-color-band-even:       #221b2e;
  /* skeleton keeps no distinct even-band active shade: leave
     --theme-color-highlight-band-even at its default (= --theme-color-highlight). */
  --theme-color-active:          #3b1f6e;
  --theme-color-active-stroke:   #9333ea;
  --theme-color-clue-hover:      #2d1f5e;
  --theme-color-secondary-entry: #261840;

  --theme-color-secondary-active:        #2a1060;
  --theme-color-secondary-active-stroke: #7c3aed;

  --theme-color-checked-text:  #4ade80;
  --theme-color-revealed-flag: #4ade80;
  --theme-color-wrong-slash:   var(--theme-color-danger);

  --theme-color-circle:      #6d28d9;
  --theme-color-curl:        #6d28d9;
  --theme-color-cell-center: #0d0b12;

  --theme-color-instructions: var(--theme-color-text);

  --theme-color-overlay:         transparent;
  --theme-color-congrats-bg:     #14532d;
  --theme-color-congrats-border: #16a34a;
  --theme-color-congrats-text:   #4ade80;

  /* A dark shadow vanishes on this dark ground: the edge glows in the accent instead. */
  --theme-color-edge-shadow: rgba(139, 92, 246, 0.45);

  --theme-color-wrong-bg:     #3d1515;
  --theme-color-wrong-border: #dc2626;
  --theme-color-wrong-text:   #fca5a5;

  --theme-color-danger: #ef4444;
}
`,"/varietypack/shared/themes/swiss-tokens.css":`/* Swiss theme \u2014 International Typographic Style: a system grotesque, black on white,
   and one accent (orange) used flat. Everything that is not the accent is black, white
   or a neutral gray, except two spot colors kept to cell marks: a blue for a checked
   letter and a red for the wrong slash. Overrides theme-base. */
:root {
  --theme-font-body:    'Helvetica Neue', Helvetica, Arial, sans-serif;
  --theme-font-display: var(--theme-font-body);
  --theme-font-button:  var(--theme-font-body);
  --theme-font-cell:    var(--theme-font-body);

  --theme-color-header-rule: #111111;
  --theme-header-align:      left;
  --theme-title-size:        3.2rem;
  --theme-title-tracking:    -0.02em;
  --theme-title-transform:   lowercase;

  --theme-color-muted: #444444;
  /* Text-colored, told apart by its underline: a blue link would be a second hue. */
  --theme-color-link:  #111111;

  --theme-color-bar-border:  #111111;
  --theme-color-soft-border: #111111;

  --theme-control-radius:     0;
  --theme-icon-button-radius: 0;

  --theme-color-btn-bg:    #111111;
  --theme-button-tracking: 0;

  --theme-color-btn2-bg:     #ffffff;
  --theme-color-btn2-border: #111111;
  --theme-color-btn2-hover:  #eeeeee;

  --theme-color-clear-fg:       #777777;
  --theme-color-clear-hover-fg: #111111;

  --theme-color-cell-stroke: #111111;

  /* The accent: the active entry, and a deeper shade for the active cell and clue. */
  --theme-color-highlight:     #f9c55f;
  --theme-color-active:        #ee8a00;
  --theme-color-active-stroke: #111111;
  /* The active clue, row or block, takes the lighter shade; the deeper is too heavy. */
  --theme-color-active-clue: var(--theme-color-highlight);

  --theme-color-band-even:       #ececec;
  --theme-color-clue-hover:      #eeeeee;
  --theme-color-secondary-entry: #e2e2e2;
  --theme-clue-radius:           0;

  --theme-color-secondary-active:        #bdbdbd;
  --theme-color-secondary-active-stroke: #111111;

  /* Cell marks: the two spot colors, and a black flag. The slash is a deeper shade of
     --theme-color-danger, which is too light against the orange cursor. */
  --theme-color-checked-text:  #1f45b8;
  --theme-color-revealed-flag: #111111;
  --theme-color-wrong-slash:   #9e0c24;

  --theme-clue-filled-opacity: 0.4;

  --theme-color-circle:      #8a8a8a;
  --theme-color-curl:        #111111;
  --theme-color-cell-center: #111111;

  --theme-color-overlay:         rgba(255, 255, 255, 0.75);
  --theme-color-congrats-bg:     #111111;
  --theme-color-congrats-border: #111111;
  --theme-card-radius:           0;

  /* Black on white, so the box does not read as the accent. */
  --theme-color-wrong-bg:     #ffffff;
  --theme-color-wrong-border: #111111;

  --theme-color-danger: #c8102e;
}
`,"/varietypack/shared/themes/theme-base.css":`/* theme-base: neutral defaults \u2014 every --theme-* var a theme can override.
   A theme's <name>-tokens.css need only override what differs from these. */
:root {
  /* Fonts */
  --theme-font-body:    system-ui, -apple-system, sans-serif;
  --theme-font-display: var(--theme-font-body);
  --theme-font-button:  var(--theme-font-body);
  --theme-font-cell:    var(--theme-font-body);

  /* Masthead / title / byline */
  --theme-color-header-rule: #cccccc;
  --theme-header-align:      center;
  --theme-title-size:        2rem;
  --theme-title-tracking:    normal;
  --theme-title-transform:   none;
  --theme-color-title:       var(--theme-color-text);
  --theme-byline-style:      normal;
  --theme-byline-size:       0.875rem;

  /* Page */
  --theme-color-bg:    #ffffff;
  --theme-color-text:  #111111;
  --theme-color-muted: #555555;
  --theme-color-link:  #0000ee;

  /* Bars / borders */
  --theme-color-bar-border:  #cccccc;
  --theme-color-soft-border: #cccccc;

  /* Corner radii: text buttons, toggles and keys; and the round menu, help and keys
     buttons. */
  --theme-control-radius:     4px;
  --theme-icon-button-radius: 50%;

  /* Primary button */
  --theme-color-btn-bg:       #333333;
  --theme-color-btn-text:     #ffffff;
  --theme-button-tracking:    0.05em;

  /* Secondary / toggle button colors */
  --theme-color-btn2-bg:     #eeeeee;
  --theme-color-btn2-border: #aaaaaa;
  --theme-color-btn2-hover:  #e0e0e0;

  /* Clear button */
  --theme-color-clear-fg:       #999999;
  --theme-color-clear-hover-fg: #333333;

  /* Grid cells */
  --theme-color-cell-bg:     #ffffff;
  --theme-color-cell-stroke: #999999;
  --theme-color-cell-text:   #111111;

  /* Cell / clue states */
  --theme-color-highlight:            #deeeff;
  --theme-color-band-even:            var(--theme-color-cell-bg);
  --theme-color-highlight-band-even:  var(--theme-color-highlight);
  --theme-color-active:               #b8d4f5;
  --theme-color-active-stroke:        #1e5799;
  /* The active clue row or block (Marching Bands' clue groups):
     a theme whose active shade is too strong over that much area softens it here. */
  --theme-color-active-clue:          var(--theme-color-active);
  --theme-color-clue-hover:           #eeeeee;
  --theme-color-secondary-entry:      #f0f0f0;
  --theme-clue-radius:                2px;

  /* Snake-charmer-specific secondary-active cell */
  --theme-color-secondary-active:        #7aaed8;
  --theme-color-secondary-active-stroke: #3a72a8;

  /* Cell marks: a checked letter's color, the revealed flag and the wrong slash. A mark
     never touches the cell's fill (theme-components.css \u2192 .mark-flag). */
  --theme-color-checked-text:  #166534;
  --theme-color-revealed-flag: #166534;
  --theme-color-wrong-slash:   #991b1b;

  /* Filled clue: every cell the clue owns has content, right or wrong \u2014 like crossing it
     off by hand. Distinct from Correct above (whole board verified). Defaults are no-ops;
     a theme opts in. Contract: docs/CROSS_TOOL_SPEC.md \u2192 "Filled clues". */
  --theme-clue-filled-decoration: none;
  --theme-clue-filled-opacity:    1;

  /* Decorations */
  --theme-color-circle:      #cccccc;
  --theme-color-curl:        #aaaaaa;
  --theme-color-cell-center: #222222;

  /* Instructions */
  --theme-color-instructions: var(--theme-color-muted);
  --theme-instructions-size:  0.85rem;

  /* Congrats / overlay */
  --theme-color-overlay:         rgba(0, 0, 0, 0.45);
  --theme-color-congrats-bg:     #2e7d32;
  --theme-color-congrats-border: #1b5e20;
  --theme-color-congrats-text:   #ffffff;
  --theme-card-radius:           10px;

  /* Phone: the zoomed grid's edge shadow, where more grid lies past the view */
  --theme-color-edge-shadow: rgba(0, 0, 0, 0.28);

  /* Done-wrong */
  --theme-color-wrong-bg:     #fff3e0;
  --theme-color-wrong-border: #e65100;
  --theme-color-wrong-text:   var(--theme-color-text);

  /* Danger */
  --theme-color-danger: #b91c1c;
}
`,"/varietypack/shared/themes/theme-components.css":`/* theme-components: every tool-agnostic selector, driven entirely by --theme-*.
   Per-tool namespaced sections live at the bottom (body class hook: .tool-<name>).

   SVG cell states (.cell.active-entry / .cell.active-cell) live here safely:
   marching-bands' band rules use :where() (specificity 0,1,0) so these 0,2,0
   rules always win regardless of source order. */

body {
  background:   var(--theme-color-bg);
  color:        var(--theme-color-text);
  font-family:  var(--theme-font-body);
}

/* Masthead */
.puzzle-header {
  text-align:     var(--theme-header-align);
  border-bottom:  2px solid var(--theme-color-header-rule);
  padding-bottom: 12px;
  margin-bottom:  24px;
}
h1.title {
  font-family:     var(--theme-font-display);
  font-size:       var(--theme-title-size);
  line-height:     1;
  letter-spacing:  var(--theme-title-tracking);
  text-transform:  var(--theme-title-transform);
  color:           var(--theme-color-title);
}
.byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
  font-size:  var(--theme-byline-size);
  margin-top: 6px;
}

#active-clue-bar {
  background:    var(--theme-color-bg);
  border-bottom: 1px solid var(--theme-color-bar-border);
}
html.phone #clue-full {
  background: var(--theme-color-bg);
  color:      var(--theme-color-text);
  border-top: 1px solid var(--theme-color-bar-border);
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.15);
}

/* #menu-btn and #help-btn sit *within* #active-clue-bar's own band instead of floating
   below it as a separate row \u2014 no extra vertical space. Pure CSS calc() against the
   bar's min-height (base.css), not JS-measured: nothing has to re-measure it when the
   bar or the viewport resizes. --corner-* are the buttons' measurements (base.css);
   Marching Bands, with no bar, keeps the plain default \`top\`. The phone layout moves the
   buttons into its top bar instead (phone.css). */
.has-clue-bar #menu-btn,
.has-clue-bar #help-btn { top: calc((var(--active-clue-bar-space) - var(--corner-btn)) / 2); }

/* #menu-panel and #help-panel open directly below the bar's bottom edge (8px gap,
   matching Marching Bands' static button-to-panel gap from base.css) \u2014 same
   CSS-not-JS reasoning as the buttons above. */
.has-clue-bar #menu-panel,
.has-clue-bar #help-panel { top: calc(var(--active-clue-bar-space) + var(--corner-gap)); }

/* Right gutter for the bar's own text now that #menu-btn shares its row: its width and
   inset, plus a gap to the text. Lives here rather than in base.css's shared
   #active-clue-bar rule since only these three tools ever place the button there.
   A page with a help button (setupHelpMenu puts \`has-help-btn\` on <body>; a hashed
   build has none) also reserves its width and the gap between them. Same specificity as
   the rule above, so it follows it; the phone layer overrides both. */
.has-clue-bar #active-clue-bar { padding-right: var(--corner-btn-2); }
.has-help-btn #active-clue-bar { padding-right: calc(var(--corner-btn-2) + var(--corner-btn) + var(--corner-gap)); }

/* Direction label ("Across"/"Down", "In"/"Out") before the bar's clue number. */
.active-clue-dir {
  font-size:      0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color:          var(--theme-color-muted);
  opacity:        0.6;
  flex-shrink:    0;
}

.instructions {
  color:         var(--theme-color-instructions);
  font-size:     var(--theme-instructions-size);
  line-height:   1.5;
  margin-bottom: 20px;
}
.instructions p + p { margin-top: 0.6em; }

/* Links in a clue or the instructions (markdown). Visited ones keep the color: the
   browser's own visited purple is unreadable on a dark theme. */
a { color: var(--theme-color-link); }

.clue-item { border-radius: var(--theme-clue-radius); }
/* Clue-row highlights for the tools whose rows are <li class="clue-item"> (Marching
   Bands highlights its .clue-group instead, below). :where() keeps :hover at the same
   specificity as the state rules, so the state rules that follow win by source order. */
:where(.tool-snake-charmer, .tool-spiral, .tool-crushword) .clue-item:hover { background: var(--theme-color-clue-hover); }
.clue-item.active-clue     { background: var(--theme-color-active-clue); }
.clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.clue-item.filled .clue-text { text-decoration: var(--theme-clue-filled-decoration); opacity: var(--theme-clue-filled-opacity); }

.clue-section h2 {
  color:          var(--theme-color-text);
  border-bottom:  1px solid var(--theme-color-soft-border);
  padding-bottom: 4px;
}

/* Every button: a button takes the browser's own font unless told otherwise. */
button { font-family: var(--theme-font-button); }

/* Corner radii: one for every text button, toggle and key (the phone keyboard's too),
   another for the three icon buttons. No other layer sets a radius on these.
   .puzzle-toggle's options, buttons themselves, stay square inside its frame. */
button,
.puzzle-toggle,
.menu-toggle,
kbd { border-radius: var(--theme-control-radius); }
.puzzle-toggle .toggle-opt { border-radius: 0; }
#menu-btn,
#help-btn,
#keys-btn { border-radius: var(--theme-icon-button-radius); }

/* Primary button: the phone's first-visit Start */
html.phone .intro-card > button {
  font-size:      0.95rem;
  padding:        8px 22px;
  background:     var(--theme-color-btn-bg);
  color:          var(--theme-color-btn-text);
  border:         none;
  letter-spacing: var(--theme-button-tracking);
}
/* Clear button \u2014 flat, borderless, left-aligned, matching .menu-toggle
   (base.css): all are plain menu-panel rows now, not a bordered pill next to a
   bare checkbox. Color cues (armed, hover) carry entirely through text color
   and the shared row-hover background instead of a border. */
#clear-btn {
  font-size:      0.8rem;
  padding:        6px 8px;
  background:     transparent;
  border:         none;
  text-align:     left;
  color:          var(--theme-color-clear-fg);
  letter-spacing: var(--theme-button-tracking);
}
#clear-btn:hover              { color: var(--theme-color-clear-hover-fg); }
#clear-btn.armed              { color: var(--theme-color-danger); }
/* With no hover on a phone, the pale resting color reads as disabled next to the menu's
   other rows, so it takes the text color there; the armed state stays danger. */
html.phone #clear-btn         { color: var(--theme-color-text); }
html.phone #clear-btn.armed   { color: var(--theme-color-danger); }
#clear-btn:hover,
.menu-toggle:hover { background: var(--theme-color-clue-hover); }

/* Rebus button \u2014 the pointer route into multi-letter entry, mirroring the Enter key.
   It is disabled only where composition is refused whatever the cell's capacity (see
   setupRebusButton in shared/engine-chrome.mjs); otherwise it looks identical on every
   square, in every build, which keeps it from signalling which cells are rebus.
   Composition-in-progress is shown on the cell itself (.cell.active-cell.composing
   below), so the button carries only its label \u2014 whose width is reserved in
   shared/base.css so the Rebus\u2192Done swap does not reflow #controls. */
#rebus-btn {
  font-size:      0.8rem;
  padding:        5px 12px;
  background:     transparent;
  color:          var(--theme-color-muted);
  border-color:   var(--theme-color-btn2-border);
  letter-spacing: var(--theme-button-tracking);
}
#rebus-btn:hover:not(:disabled) { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Puzzle toggle (direction / mode / loop) */
.puzzle-toggle { border: 1px solid var(--theme-color-btn2-border); }
.toggle-opt {
  font-size:      0.9rem;
  font-weight:    bold;
  padding:        6px 16px;
  background:     var(--theme-color-btn2-bg);
  color:          var(--theme-color-muted);
  letter-spacing: 0.04em;
}
.toggle-opt:not(:last-child)   { border-right: 1px solid var(--theme-color-btn2-border); }
.toggle-opt.active             { background: var(--theme-color-btn-bg); color: var(--theme-color-btn-text); cursor: default; }
.toggle-opt:not(.active):hover { background: var(--theme-color-btn2-hover); }

/* SVG cell states */
.cell              { fill: var(--theme-color-cell-bg); stroke: var(--theme-color-cell-stroke); stroke-width: 0.5; }
.cell.active-entry { fill: var(--theme-color-highlight); }
.cell.active-cell  { fill: var(--theme-color-active); stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }

.style-circle { fill: none; stroke: var(--theme-color-circle); stroke-width: 1; }

/* No font-size on .cell-letter or .cell-num: Spiral sizes these dynamically as SVG
   presentation attributes; a CSS font-size overrides them silently. The other tools
   size them in their own template base.css. */
.cell-letter         { font-family: var(--theme-font-cell); fill: var(--theme-color-cell-text); }
/* A mark never changes the cell's fill, which belongs to the cursor and the highlights:
   a checked cell colors its letter, and the flag and slash are shapes in .mark-layer
   (setupMarkLayer, shared/engine-chrome.mjs). */
.cell-letter[data-mark="checked"] { fill: var(--theme-color-checked-text); }
.mark-shape { pointer-events: none; }
.mark-flag  { fill: var(--theme-color-revealed-flag); }
/* Screen pixels, not user units: each tool's viewBox scales its cells differently. */
.mark-slash { stroke: var(--theme-color-wrong-slash); stroke-width: 2; vector-effect: non-scaling-stroke; }
.cell-num            { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }

/* The direction chevron (Spiral, Marching Bands); each tool sets its stroke width, which
   scales with its own viewBox. */
#direction-chevron { stroke: var(--theme-color-active-stroke); opacity: 0.5; }

/* Multi-letter (rebus) cell content. Sized with transform, not font-size: Spiral writes
   its per-puzzle letter size as an SVG presentation attribute, which any CSS font-size
   rule would outrank (e2e/spiral.spec.js asserts exactly that). transform composes with
   whatever base size each tool established, so one shared block covers all three tools
   with no per-tool font math. The scale pivots on the letter's own x,y, which every
   tool centers its text on (text-anchor middle): setLetterText sets transform-origin
   from those attributes, in the view-box coordinates that transform-box: view-box
   resolves them in. fill-box (the origin as "center") would be simpler, but WebKit
   mis-resolves it for SVG <text>, so the letter slid toward the drawing's top-left. */
.cell-letter          { transform-box: view-box; }
.cell-letter.len-2    { transform: scale(0.62); }
.cell-letter.len-3    { transform: scale(0.45); }
.cell-letter.len-long { transform: scale(0.34); }

/* Rebus entry in progress. Specificity 0,3,0 beats .cell.active-cell (0,2,0) without
   depending on source order; the composing cell is always the active cell, so the
   selector states that invariant rather than working around it. Fill and stroke color
   are inherited from .cell.active-cell \u2014 only the dash pattern distinguishes the state,
   so no theme needs a new token. */
.cell.active-cell.composing { stroke-width: 2.5; stroke-dasharray: 4 2; }

/* Congrats modal \u2014 backdrop handles the overlay dim; #congrats is the visible card */
#congrats-dialog::backdrop { background: var(--theme-color-overlay); }

/* Keys button (fixed bottom-right corner, created by setupKeysOverlay) */
#keys-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#keys-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Menu and help buttons (fixed top-right corner, created by setupOptionsMenu and
   setupHelpMenu) \u2014 same var usage as #keys-btn. */
#menu-btn,
#help-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#menu-btn:hover,
#help-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Menu dropdown card \u2014 same var usage as #keys-modal. */
#menu-panel,
#help-panel {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border:        2px solid var(--theme-color-soft-border);
  border-radius: var(--theme-card-radius);
}
/* #clear-btn is full width inside the dropdown. */
#menu-panel #clear-btn { width: 100%; }
/* Each button of the help panel is a plain row, as #clear-btn is of \u2630's. */
#help-panel button {
  width:          100%;
  font-size:      0.8rem;
  padding:        6px 8px;
  background:     transparent;
  border:         none;
  color:          var(--theme-color-text);
  text-align:     left;
  letter-spacing: var(--theme-button-tracking);
}
#help-panel button:hover:not(:disabled) { background: var(--theme-color-clue-hover); }
#reveal-puzzle-btn.armed { color: var(--theme-color-danger); }

/* Keys modal \u2014 the <dialog> dim is its ::backdrop (skeleton sets this transparent) */
#keys-overlay::backdrop { background: var(--theme-color-overlay); }
#keys-modal {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border:        2px solid var(--theme-color-soft-border);
  border-radius: var(--theme-card-radius);
  padding:       20px 24px;
  min-width:     220px;
}
#keys-modal-header {
  display:         flex;
  justify-content: space-between;
  align-items:     center;
  margin-bottom:   12px;
  font-weight:     bold;
  font-size:       1rem;
  letter-spacing:  0.03em;
}
#keys-close {
  background: transparent;
  border:     none;
  font-size:  1.1rem;
  line-height: 1;
  padding:    0 0 0 12px;
  color:      var(--theme-color-text);
}
#keys-close:hover { opacity: 0.65; }
#keys-modal table { border-collapse: collapse; width: 100%; }
#keys-modal td    { padding: 3px 0; vertical-align: middle; }
#keys-modal td:first-child { padding-right: 14px; white-space: nowrap; }
kbd {
  display:       inline-block;
  background:    var(--theme-color-btn2-bg);
  border:        1px solid var(--theme-color-btn2-border);
  padding:       1px 5px;
  font-family:   monospace;
  font-size:     0.78rem;
  color:         var(--theme-color-text);
}

@keyframes congrats-pop {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}
#congrats {
  background:     var(--theme-color-congrats-bg);
  color:          var(--theme-color-congrats-text);
  border:         2px solid var(--theme-color-congrats-border);
  border-radius:  var(--theme-card-radius);
  padding:        28px 36px;
  text-align:     center;
  animation:      congrats-pop 200ms ease-out;
}
#congrats-msg {
  font-size:      1.2rem;
  font-weight:    bold;
  letter-spacing: 0.04em;
}
#congrats-time {
  font-size:      1rem;
  font-weight:    normal;
  margin-top:     8px;
  letter-spacing: 0;
  opacity:        0.85;
}
#congrats-actions {
  display:         flex;
  flex-wrap:       wrap;
  gap:             12px;
  justify-content: center;
  margin-top:      20px;
}
#congrats-copy-btn,
#congrats-view-btn,
#congrats-play-btn {
  background:   var(--theme-color-btn2-bg);
  border-color: var(--theme-color-btn2-border);
  color:        var(--theme-color-text);
}
#congrats-play-btn { font-weight: bold; }

#done-wrong {
  margin-top:     20px;
  padding:        16px 24px;
  border-radius:  var(--theme-card-radius);
  background:     var(--theme-color-wrong-bg);
  border:         2px solid var(--theme-color-wrong-border);
  color:          var(--theme-color-wrong-text);
  font-size:      1.05rem;
  font-weight:    bold;
  text-align:     center;
  letter-spacing: 0.04em;
}

/* Phone solving view (shared/engine-phone.mjs; structure in phone.css). The keys take
   the secondary-button tokens and sit in a tray of the hover shade. */
html.phone #solve-view { background: var(--theme-color-bg); }
html.phone .solve-top  { border-bottom: 2px solid var(--theme-color-header-rule); }
html.phone .solve-title {
  font-family: var(--theme-font-display);
  color:       var(--theme-color-title);
}
html.phone .solve-byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
}
html.phone #intro { background: var(--theme-color-overlay); }
html.phone .intro-card {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border-radius: var(--theme-card-radius);
}
html.phone #clues-btn {
  background:     var(--theme-color-btn2-bg);
  border-color:   var(--theme-color-btn2-border);
  color:          var(--theme-color-text);
  letter-spacing: var(--theme-button-tracking);
}
html.phone #solve-bar  { border-top: 1px solid var(--theme-color-bar-border); }
/* The zoomed grid's edge shadows: darkest at the side, fading inward. */
html.phone .edge-shadow-stop { stop-color: var(--theme-color-edge-shadow); }
html.phone .bar-step   { background: transparent; color: var(--theme-color-muted); }
html.phone .nav-label  { color: var(--theme-color-title); }
html.phone .nav-count  { color: var(--theme-color-muted); }
html.phone #drawn-kb {
  background: var(--theme-color-btn2-hover);
  border-top: 1px solid var(--theme-color-bar-border);
}
html.phone #drawn-kb button {
  background:   var(--theme-color-btn2-bg);
  border:       1px solid var(--theme-color-btn2-border);
  color:        var(--theme-color-text);
}
html.phone #drawn-kb button:active { background: var(--theme-color-clue-hover); }
/* The fill-in list's cells, as the grid colors its own: the active clue's row as its
   active entry, the cursor as its active cell. */
html.phone .list-cell {
  font-family: var(--theme-font-cell);
  background:  var(--theme-color-cell-bg);
  border:      1px solid var(--theme-color-cell-stroke);
  color:       var(--theme-color-cell-text);
}
html.phone .clue-item.active-clue .list-cell { background: var(--theme-color-highlight); }
html.phone .clue-item .list-cell.list-cursor {
  background:   var(--theme-color-active);
  border-color: var(--theme-color-active-stroke);
  box-shadow:   inset 0 0 0 1px var(--theme-color-active-stroke);
}
/* A list cell shows its grid cell's mark the same way: a checked letter's color, the
   revealed flag as a corner triangle and the wrong slash (an HTML box, so CSS draws
   them). */
html.phone .clue-item .list-cell[data-mark="checked"] { color: var(--theme-color-checked-text); }
html.phone .clue-item .list-cell[data-mark="revealed"]::after {
  content:        '';
  position:       absolute;
  inset:          0;
  background:     var(--theme-color-revealed-flag);
  clip-path:      polygon(70% 0, 100% 0, 100% 30%);
  pointer-events: none;
}
html.phone .clue-item .list-cell[data-mark="wrong"]::after {
  content:        '';
  position:       absolute;
  inset:          0;
  /* Toward the bottom-right, so the midline runs bottom-left to top-right, as on
     the grid. */
  background:     linear-gradient(to bottom right, transparent calc(50% - 1px),
                    var(--theme-color-wrong-slash) calc(50% - 1px),
                    var(--theme-color-wrong-slash) calc(50% + 1px), transparent calc(50% + 1px));
  pointer-events: none;
}
/* A cell composing a rebus dashes its outline, as in the grid (the inset shadow would
   fill the dashes in, so it goes). */
html.phone .clue-item .list-cell.list-cursor.composing {
  border-width: 2px;
  border-style: dashed;
  box-shadow:   none;
}

/* Landscape phones (the query and its reason are defined in phone.css). .solve-top has no
   box there, so the strip's rule is drawn by the view's ::before, which spans it; the
   bar loses its own top rule, and the stage's right edge, the stage/keyboard divide,
   stands in for the keyboard's (a plain list takes the whole width, so has none). */
@media screen and (orientation: landscape) and (max-height: 500px) {
  html.phone #solve-view::before { border-bottom: 2px solid var(--theme-color-header-rule); }
  html.phone #solve-bar { border-top: none; }
  html.phone #solve-stage { border-right: 1px solid var(--theme-color-bar-border); }
  html.phone.kb-left #solve-stage { border-right: none; border-left: 1px solid var(--theme-color-bar-border); }
  html.phone #solve-view:has(> #drawn-kb[hidden]) #solve-stage { border: none; }
  /* The full clue hangs below the strip, so its edge and shadow face down. */
  html.phone #clue-full {
    border-top: none;
    border-bottom: 1px solid var(--theme-color-bar-border);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
}

/* \u2500\u2500 Per-tool selectors (body class hook: .tool-<name>) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   Each tool's <body> carries a class like .tool-snake-charmer so these rules
   scope to the right tool without a separate per-tool CSS file. Plain sizing and
   spacing that reads no --theme-* token belongs in the tool's template base.css
   instead. */

/* Snake Charmer */
.tool-snake-charmer .cell.secondary-entry { fill: var(--theme-color-secondary-entry); }
.tool-snake-charmer .cell.active-cell.secondary-entry {
  fill:         var(--theme-color-secondary-active);
  stroke:       var(--theme-color-secondary-active-stroke);
  stroke-width: 1.5;
}

/* Marching Bands \u2014 band fills are unnamespaced to keep :where() specificity
   below .cell.active-entry (0,2,0); .band-even/.band-odd are MB-exclusive.
   Prefixing with .tool-marching-bands would raise these to 0,2,0 too, tying
   with active-entry and leaving the winner to source order (wrong) \u2014 dead
   CSS in other tools, but harmless since the classes are MB-exclusive. */
.cell:where(.band-even) { fill: var(--theme-color-band-even); }
.cell:where(.band-odd)  { fill: var(--theme-color-cell-bg); }
.cell.band-even.active-entry { fill: var(--theme-color-highlight-band-even); }
.tool-marching-bands .band-label  { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }
.tool-marching-bands .row-label   { font-family: var(--theme-font-cell); fill: var(--theme-color-text); }
.tool-marching-bands .cell-center { fill: var(--theme-color-cell-center); }
.tool-marching-bands .clue-group:hover          { background: var(--theme-color-clue-hover); }
.tool-marching-bands .clue-group.active-clue    { background: var(--theme-color-active-clue); }
.tool-marching-bands .clue-group.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-marching-bands #direction-chevron { stroke-width: 1.6; }

/* Spiral */
.tool-spiral #center-curl       { fill: none; stroke: var(--theme-color-curl); stroke-width: 1.4; stroke-linecap: round; }
.tool-spiral #direction-chevron { stroke-width: 0.9; }
/* Crushword, and Marching Bands when stacked */
/* Opaque background is load-bearing, not cosmetic: .puzzle-center is
   position:sticky over the clues (each tool's base.css), which scroll directly
   underneath it in the same horizontal space \u2014 without this, clue text
   would show through the sticky grid as it scrolls. */
.tool-crushword .puzzle-center,
.tool-marching-bands .puzzle-center { background: var(--theme-color-bg); }

/* Crushword */
.tool-crushword .cell-block  { fill: var(--theme-color-cell-center); }
/* Every Crushword cell composes from its first keystroke, so the shared
   dashed outline would flag nothing; reset to plain .active-cell. */
.tool-crushword .cell.active-cell.composing { stroke-width: 1.5; stroke-dasharray: none; }
/* Deliberately static: a blink competes for attention in a dense grid. */
.tool-crushword .cell-caret { fill: var(--theme-color-cell-text); pointer-events: none; }
