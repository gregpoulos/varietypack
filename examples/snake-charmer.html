      // never received input has nothing new to persist.
      if (started && onPause) onPause();
    } else {
      // Guard against unpaired visible events (bfcache, iOS app-switcher) that
      // would overwrite runningSince and silently drop accumulated time.
      if (started && runningSince === null) runningSince = _now();
    }
  }

  const register = listenVisibility ??
    (fn => document.addEventListener('visibilitychange', () => fn(document.hidden)));
  register(handleVisibility);

  return { onFirstInput, reset, getElapsedMs, restoreMs };
}

function makeCompletionLatch({
  puzzleRoot, kind, title, date, getBoardHash, getSolution, getElapsedMs,
  onComplete,
  _postMessage,
}) {
  let fired = false;
  const pm = _postMessage ?? ((msg) => window.parent?.postMessage(msg, '*'));

  function sealIfSolved(isSolved) {
    if (isSolved) fired = true;
  }

  function reset() { fired = false; }

  function check(isSolved) {
    if (fired || !isSolved) return;
    fired = true;
    const timeMs = getElapsedMs();
    const solution = getSolution();
    const boardHash = getBoardHash();
    const detail = { boardHash, kind, title, date, timeMs, solution };
    puzzleRoot.dispatchEvent(new CustomEvent('varietypack:complete', {
      bubbles: true, composed: true, detail,
    }));
    pm({ type: 'varietypack:complete', boardHash, kind, title, date, timeMs });
    if (onComplete) onComplete(timeMs);
  }

  return { check, sealIfSolved, reset, get solved() { return fired; } };
}

// Builds the timer + completion-latch pair every engine wires identically: the timer
// flushes to storage on pause, and the latch's onComplete fires once, on first solve.
// `puzzleRoot`, `getSolution` and `onComplete` are supplied rather than read from module
// scope — same DOM-via-accessor discipline as makeComposer/makeBoardChecker, which is what
// keeps this file's exports callable from plain closures under node:test. The engine builds
// its own congratsDialog (shared/engine-chrome.js) separately and passes its `.open` as
// `onComplete` — this function never references a chrome helper, so engine-state.js still
// calls nothing in engine-chrome.js.
function setupSolveTracking({ puzzleRoot, data, getSolution, saveState, onComplete }) {
  const timer = setupTimer({ onPause: saveState });
  const latch = makeCompletionLatch({
    puzzleRoot,
    kind:         data.kind,
    title:        data.title,
    date:         data.date,
    getBoardHash: () => data.boardHash,
    getSolution,
    getElapsedMs: () => timer.getElapsedMs(),
    onComplete,
  });
  return { timer, latch };
}

// Length class for a cell-letter element, derived from the *typed* content's length —
// never from the answer's capacity. Deriving it from capacity would put a len-3 class
// on an empty cell in a non-hashed build, advertising which squares are rebus, and is
// impossible in a hashed build where the engine has no capacity to read.
const LEN_CLASSES = ['len-2', 'len-3', 'len-long'];
function letterLenClass(text) {
  if (text.length < 2)  return null;
  if (text.length === 2) return 'len-2';
  if (text.length === 3) return 'len-3';
  return 'len-long';
}

// Sets a cell-letter element's text and its length class together. Every path that
// writes letter text goes through this — setCellLetter, applyState's restore, and
// resetBoard's clear — so a cell can never keep a stale size class.
function setLetterText(el, text) {
  if (!el) return;
  el.textContent = text;
  const want = letterLenClass(text);
  for (const c of LEN_CLASSES) if (c !== want) el.classList.remove(c);
  if (want) el.classList.add(want);
}

// Upper bound on a composing cell's content. Real rebus groups are 2-4 letters and the
// shared validator already warns at 5, so this can never truncate legitimate content —
// it exists because the composing branch appends without limit and nothing clips a cell's
// text, so a long paste or a held key would spill over neighbouring cells. Input past the
// cap is dropped silently; Backspace still works.
const MAX_COMPOSE_LEN = 12;

// Composing (multi-letter / rebus) cell state. At most one cell composes at a time and,
// by the focusCell invariant (see docs/CROSS_TOOL_SPEC.md → Focus management), it is
// always the active cell. A cell counts as *filled* only when it holds content AND is
// not composing: that exclusion is what stops a mid-composition prefix from being read
// as a solved board and sealing the one-way completion latch early.
//
// The tool supplies its own accessors because the four engines key cells differently
// (Snake Charmer by ring position, Spiral by cell number, Marching Bands and Crushword
// by grid id):
//   getContent(n)    → the cell's current string
//   setContent(n, s) → write it (the engine's setCellLetter)
//   getCellEl(n)     → the element that carries the .composing class
//   onCommit()       → runs after a commit: syncUI + the mode-appropriate check + save
function makeComposer({ getContent, setContent, getCellEl, onCommit }) {
  let composingId = null;

  function mark(n, on) {
    if (n === null) return;
    const el = getCellEl(n);
    if (!el) return;
    if (on) el.classList.add('composing');
    else    el.classList.remove('composing');
  }

  function isComposing(n) { return composingId !== null && n === composingId; }

  function isCellFilled(n) { return getContent(n) !== '' && n !== composingId; }

  function commit() {
    if (composingId === null) return;
    mark(composingId, false);
    // Clear the id *before* onCommit so the check it triggers sees the cell as filled.
    composingId = null;
    if (onCommit) onCommit();
  }

  // Called at the top of every engine's focusCell. Because the active cell is assigned
  // nowhere else, this one call site covers arrows, Tab, Space, cell clicks, clue
  // clicks and toggles. A same-cell focus (a direction/mode toggle) is a no-op, so
  // composition survives a toggle — the cursor did not move.
  function commitIfMoved(n) {
    if (composingId !== null && composingId !== n) commit();
  }

  // Returns true when the caller should advance the cursor.
  function typeLetter(n, text) {
    if (isComposing(n)) {
      setContent(n, (getContent(n) + text).slice(0, MAX_COMPOSE_LEN));
      return false;
    }
    // The non-composing path sets one character per keystroke. The composing path takes
    // the whole value instead, which is what makes paste and mobile autocorrect work
    // mid-rebus. The asymmetry is deliberate — do not "unify" these.
    setContent(n, text.slice(-1));
    return true;
  }

  // Returns true when it consumed the keystroke. Returning false on an empty composing
  // cell is what lets the engine fall through to its normal retreat, which commits.
  function backspace(n) {
    if (!isComposing(n)) return false;
    const cur = getContent(n);
    if (cur === '') return false;
    setContent(n, cur.slice(0, -1));
    return true;
  }

  // Toggles composition on n. Beginning keeps any existing content, so a cell holding H
  // grows into HAR without retyping and no input is ever destroyed.
  function enter(n) {
    if (isComposing(n)) { commit(); return; }
    composingId = n;
    mark(n, true);
  }

  // Drops state without firing onCommit — see resetAndRefocus for why.
  function reset() {
    mark(composingId, false);
    composingId = null;
  }

  // Composition is part of the saved board, not just live UI state. Autosave fires at
  // every mutation site including mid-composition — and on mobile also on every app
  // switch and screen lock, via setupTimer's visibility listener — so without these two
  // a reload silently commits a half-typed prefix: the cell returns *filled*, counts
  // toward isBoardFilled, and can be adjudicated as an answer the solver never submitted.
  function getComposing() { return composingId; }

  // `n` comes straight from the parsed save, so it may be undefined (a save written
  // before this field existed) or null. Only a real cell id reopens composition — an
  // absent field is treated as "not composing" rather than bumping the schema `v`,
  // matching how `activeMs`'s addition was handled.
  function restore(n) {
    if (n === null || n === undefined) return;
    composingId = n;
    mark(n, true);
  }

  return {
    isCellFilled, isComposing, typeLetter, backspace, enter, commitIfMoved, reset,
    getComposing, restore,
  };
}

// The board-state and answer-checking core, shared by every tool: pure state logic,
// covered by node:test.
//
// The tool supplies only what genuinely differs:
//   cellIds             → cell ids in canonical traversal order (the board-string order)
//   getContent(n)       → the cell's current string
//   isCellFilled(n)     → composer.isCellFilled — content present AND not composing
//   isCellMarkedCorrect(n) → reads the tool's own correct marker (class or dataset)
//   hashed              → picks the evidence source, nothing else
//   getExpected(n)      → the cell's answer string (non-hashed builds only)
//   getBoardHash()      → the stored board hash
//   markSolved()        → paint the solved board (cells, letters, and clue items if the
//                         tool marks them)
//   syncUI()            → the engine's syncUI
//
// One checkIfFilled() serves both modes. That is what keeps them symmetric by
// construction rather than by two hand-maintained copies: the guard, the syncUI calls
// and markSolved() are shared, and `hashed` chooses only how correctness is evidenced.
function makeBoardChecker({
  cellIds, getContent, isCellFilled, isCellMarkedCorrect,
  hashed, getExpected, getBoardHash, markSolved, syncUI,
}) {
  function isBoardFilled() { return cellIds.every(n => isCellFilled(n)); }

  function isSolved() { return cellIds.every(n => isCellMarkedCorrect(n)); }

  // Normalize each cell, then join — never normalize a joined string. joinCells inserts
  // CELL_DELIM so a solver's ["ha","ro"] cannot hash identically to a correct ["har","o"].
  function getSolution() {
    return joinCells(cellIds.map(n => getContent(n).toLowerCase()));
  }

  function boardIsCorrect() {
    return hashed
      ? sha256hex(getSolution()) === getBoardHash()
      : cellIds.every(n => isCellCorrect(getContent(n), getExpected(n)));
  }

  // No feedback of any kind until every cell is filled — and a composing cell is not
  // filled, which is what stops a mid-composition prefix from sealing the completion
  // latch on a half-entered board.
  function checkIfFilled() {
    if (!isBoardFilled()) return;
    if (!boardIsCorrect()) { syncUI(); return; }
    markSolved();
    syncUI();
  }

  // Restore-time repaint, called once after restoreState(). The auto-save payload
  // records cell correctness only — deliberately, since everything else the solved
  // board shows is derivable — so a solved puzzle comes back with green cells and
  // unmarked clue items. Re-running markSolved() puts the rest of the painting back.
  //
  // Mark-driven, never evidence-driven: it re-paints from correctness already
  // established, it does not re-adjudicate the board, so hashed and non-hashed
  // behave identically.
  //
  // And it must not call syncUI(), which would reach the engine's latch.check().
  // Today's engines all seal before repainting, so such a call would in fact be
  // harmless — check() returns immediately on an already-fired latch. The rule is
  // not about today: makeBoardChecker is shared and cannot see how any future
  // engine orders its restore epilogue, so the repaint has to be safe under *any*
  // ordering. Staying out of syncUI() is what buys that; seal-first is insurance,
  // not the guarantee — pinned by shared/test/engine-state.checker.test.js. All
  // four engines call latch.sealIfSolved() then checker.repaintIfSolved(), both
  // before the first focusCell(); see docs/CROSS_TOOL_SPEC.md → "localStorage key
  // format" → Timing contract for that call-order requirement.
  function repaintIfSolved() { if (isSolved()) markSolved(); }

  return { isBoardFilled, isSolved, getSolution, checkIfFilled, repaintIfSolved };
}

// The restore-time epilogue every engine's init() runs just before its first focusCell():
// apply saved state, seal the latch if the restored board is already solved, then repaint.
// One shared call keeps the order fixed across engines (see repaintIfSolved for why the
// repaint must be safe under any order anyway). Returns the cell left mid-composition, or
// null, for the engine's resume-focus call.
function restoreAndSeal({ restoreState, checker, latch, composer }) {
  restoreState();
  latch.sealIfSolved(checker.isSolved());
  checker.repaintIfSolved();
  return composer.getComposing();
}

// The in-memory board reset behind Clear and Play again, shared so its two fixed
// positions hold in every engine. composer.reset() runs first: it drops composition
// without firing onCommit, whose saveState would otherwise re-write the key clearState
// removes — and commitIfMoved can't stand in for it, being a no-op when the reset target
// is the composing cell. focusInitial() runs last, so syncUI re-derives every highlight
// and the done-wrong banner from the fully reset board. `clearBoard` is the engine's own
// teardown: letters, correct marks, flash overlays, navigation sub-mode.
function resetAndRefocus({ composer, clearBoard, clearState, timer, latch, focusInitial }) {
  composer.reset();
  clearBoard();
  clearState();
  timer.reset();
  latch.reset();
  focusInitial();
}

if (typeof module !== 'undefined') {
  module.exports = {
    setupTimer, makeCompletionLatch, makeComposer, setLetterText, letterLenClass, makeBoardChecker,
    setupSolveTracking, restoreAndSeal, resetAndRefocus,
  };
}

// Shared browser-engine "chrome": the UI-surround logic that is identical across
// every puzzle tool's engine.js — byline, instructions, the options menu and its
// two-click Clear button, the Rebus button, scroll-key forwarding, the
// localStorage save/restore/clear scaffolding, the shared keydown guard wrapper,
// the keyboard-shortcuts overlay, and the congrats dialog on solve. The
// solve-tracking cores (timer, completion latch, composer, board checker) live in
// engine-state.js; the tool-specific cores (SVG rendering, navigation, syncUI,
// per-cell answer checking) stay in each engine. Each engine calls these from
// inside its own init(). Injected into the HTML bundle as browser globals by
// getSharedBundle(); the dual-mode guard at the bottom lets node:test require the
// helpers that are tested via mocks (setupClearButton, setupRebusButton).

// Browser-only: create an SVG-namespaced element and apply an attribute map
// (setAttribute coerces each value to a string). Every engine builds SVG nodes
// this way.
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs = {}) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// author + date → `.byline`. Missing pieces are simply omitted; an empty result
// leaves the element blank.
function renderByline(data) {
  const byline = document.querySelector('.byline');
  if (!byline) return;
  const parts = [];
  if (data.author) parts.push('by ' + data.author);
  if (data.date) parts.push(String(data.date));
  byline.textContent = parts.join(' · ');
}

// Injects the pre-rendered instructions HTML into `#instructions`, which is
// revealed (hidden=false) only when content exists. `data.instructions` is
// already block-level markdown HTML by the time it reaches the browser
// (shared/build/renderMarkdown.js's renderInstructionsMarkdown, called from
// commonPuzzleData at build time) — blank-line paragraph splitting happens
// at build time, not here, so this only ever injects trusted, build-time-rendered
// HTML, never author text directly.
function renderInstructions(data) {
  const el = document.getElementById('instructions');
  if (!data.instructions || !el) return;
  el.innerHTML = data.instructions;
  el.hidden = false;
}

// Two-click arm/disarm Clear button. First click swaps the label to "Are you
// sure?" and adds `.armed` for 3s; a second click within that window calls
// onConfirmed(), which each engine supplies to perform the full in-memory
// board reset.
// `refocus` (optional) restores puzzle focus after the arming click so the
// document keydown BUTTON guard doesn't block the next keystroke.
function setupClearButton(clearBtn, onConfirmed, refocus) {
  let armed = false;
  let timer = null;
  function disarm() {
    armed = false;
    clearBtn.textContent = 'Clear Puzzle';
    clearBtn.classList.remove('armed');
  }
  clearBtn.addEventListener('click', () => {
    if (!armed) {
      armed = true;
      clearBtn.textContent = 'Are you sure?';
      clearBtn.classList.add('armed');
      timer = setTimeout(disarm, 3000);
      if (refocus) refocus();
    } else {
      clearTimeout(timer);
      disarm();
      onConfirmed();
    }
  });
}

// Touch affordance for rebus entry — the pointer equivalent of the Enter key, which is
// otherwise the only way into composition. Some Android IMEs report keyCode 229 /
// key 'Unidentified' for composition-routed keys, leaving rebus cells unreachable there.
//
// Never disabled, never hidden, identical in hashed and non-hashed builds. That is the
// spoiler rule from docs/CROSS_TOOL_SPEC.md → Enter — rebus entry: nothing in the UI may
// vary as a function of a cell's capacity. #check-btn sits next to this one in #controls
// and *is* toggled per-cell — do not copy it here.
//
// The solved guard is not redundant with the engines' `if (latch.solved) return;`: that
// one lives inside the setupKeydown callback, and a click never passes through it.
// Without the guard here, composition could open on a sealed board.
//
//   onToggle()    → run the engine's Enter branch (composer.enter + advance-or-syncUI)
//   isComposing() → composer.isComposing(activeCell)
//   isSolved()    → latch.solved
//   refocus()     → restore hidden-input focus (optional)
function setupRebusButton(btn, { onToggle, isComposing, isSolved, refocus }) {
  // Idempotent: sync() runs from every syncUI(), i.e. on every keystroke and cursor
  // move, and assigning textContent replaces the text node even when the string is
  // unchanged. The guard also makes the extra sync() in the click handler free.
  function sync() {
    const want = isComposing() ? 'Done' : 'Rebus';
    if (btn.textContent !== want) btn.textContent = want;
  }

  // Focus-on-click is a `mousedown` default action, so cancelling mousedown keeps focus
  // on the hidden input and a phone's soft keyboard open, while `click` still fires and
  // keeps the button reachable by keyboard.
  //
  // It must be mousedown and not pointerdown. On a WebKit (iOS) touch tap, cancelling
  // pointerdown suppresses the click entirely and the button never fires at all;
  // cancelling mousedown does not. Chromium fires click either way, so no Chromium-only
  // test can catch a regression here — `shared/test/engine-chrome.rebus-button.test.js`
  // asserts structurally that no pointerdown listener exists.
  btn.addEventListener('mousedown', e => e.preventDefault());

  btn.addEventListener('click', e => {
    // setupKeydown returns early on any meta/ctrl chord, so Cmd+Enter cannot open
    // composition; a modified click must match or the two entry points diverge.
    if (e && (e.metaKey || e.ctrlKey)) return;
    // Only the toggle is gated on the solved board. Refocus is unconditional — see
    // docs/CROSS_TOOL_SPEC.md → Focus management; parking focus on the button would
    // also leave setupKeydown's BUTTON guard set.
    if (!isSolved()) {
      onToggle();
      sync();
    }
    if (refocus) refocus();
  });

  sync();
  return { sync };
}

// Page-scroll deltas for keys the puzzles don't otherwise consume. Because the
// hidden input holds focus, the browser suppresses native scrolling for these,
// so the engines forward them here. Arrow = one nudge; Page = ~one viewport.
const SCROLL_DELTAS = {
  ArrowUp:   () => -80,
  ArrowDown: () =>  80,
  PageUp:    () => -window.innerHeight * 0.9,
  PageDown:  () =>  window.innerHeight * 0.9,
};

// Scrolls the page for a forwarded scroll key. Returns true when `key` is a
// scroll key (and the scroll was performed), false otherwise — so a caller that
// first tries cell navigation (e.g. Marching Bands) can fall through to this
// only when there is no in-grid target.
function scrollByKey(key) {
  const delta = SCROLL_DELTAS[key];
  if (!delta) return false;
  window.scrollBy({ top: delta(), behavior: 'auto' });
  return true;
}

// Builds the auto-save localStorage key, or null when it would be degenerate.
// Puzzles without both a title and a date get no auto-save (a `vp:<prefix>:|`
// key would collide across every untitled/undated puzzle of that type).
function storageKey(prefix, data) {
  if (!data.title || !data.date) return null;
  return 'vp:' + prefix + ':' + data.title + '|' + data.date;
}

// Flash a cell red to signal a wrong guess without disturbing the cell's own
// fill or active-state styling. Clones the cell element into `flashLayer` — an
// overlay <g> the engines paint above the cells but below the letters — relabels
// the clone `.flash-wrong-overlay` (whose base.css animation fades it out), then
// removes it once the animation ends. FLASH_WRONG_MS must match that animation's
// duration in shared/base.css.
const FLASH_WRONG_MS = 600;
function flashWrong(cellEl, flashLayer) {
  const flashEl = cellEl.cloneNode(false);
  flashEl.removeAttribute('id');
  flashEl.setAttribute('class', 'flash-wrong-overlay');
  flashLayer.appendChild(flashEl);
  setTimeout(() => flashEl.remove(), FLASH_WRONG_MS);
}

// localStorage save/restore/clear with the shared version + cellCount guard.
// The saved shape differs per tool, so the tool supplies the variable parts:
//   getState()      → tool payload merged under { v:1, cellCount } on save
//   applyState(saved) → applies a payload that passed the version/cellCount guard
// `key` may be null (see storageKey), in which case all three are no-ops.
function setupStorage(key, { cellCount, getState, applyState }) {
  function saveState() {
    if (!key) return;
    try {
      localStorage.setItem(key, JSON.stringify({ v: 1, cellCount, ...getState() }));
    } catch (_) {}
  }
  function restoreState() {
    if (!key) return;
    let saved;
    try { saved = JSON.parse(localStorage.getItem(key)); } catch (_) {}
    if (!saved || saved.v !== 1 || saved.cellCount !== cellCount) return;
    applyState(saved);
  }
  function clearState() {
    if (!key) return;
    try { localStorage.removeItem(key); } catch (_) {}
  }
  return { saveState, restoreState, clearState };
}

// Wraps a tool's keydown handler with the guards shared by every engine: hasFocus,
// Cmd+Arrow history navigation, generic Cmd/Ctrl passthrough, BUTTON focus skip,
// and keys-overlay open. The tool-specific handler receives the event only when
// all guards pass.
function setupKeydown(handler, { keysOverlay } = {}) {
  document.addEventListener('keydown', e => {
    if (!document.hasFocus()) return;
    if (keysOverlay && keysOverlay.open) return;
    if (e.metaKey && e.key === 'ArrowLeft') { history.back(); return; }
    if (e.metaKey && e.key === 'ArrowRight') { history.forward(); return; }
    if (e.metaKey || e.ctrlKey) return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    handler(e);
  });
}

// Formats elapsed milliseconds as M:SS (e.g. 154321 → "2:34").
function formatMs(ms) {
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// Builds the solve-celebration modal from the supplied callbacks and metadata.
// Creates a native <dialog id="congrats-dialog"> appended to <body>, opened via
// showModal() so the page is inert (matching the keys overlay pattern). Returns
// { open(timeMs) } — called from makeCompletionLatch's onComplete on first solve.
// Backdrop click and Escape close without resetting; Play again closes + resets.
function setupCongratsDialog({ title, date, onPlayAgain }) {
  const dialog = document.createElement('dialog');
  dialog.id = 'congrats-dialog';
  dialog.setAttribute('aria-label', 'Puzzle solved');

  const card = document.createElement('div');
  card.id = 'congrats';

  const msg = document.createElement('p');
  msg.id = 'congrats-msg';
  msg.textContent = 'Puzzle solved!';

  const timeEl = document.createElement('p');
  timeEl.id = 'congrats-time';

  const actions = document.createElement('div');
  actions.id = 'congrats-actions';

  const copyBtn = document.createElement('button');
  copyBtn.id = 'congrats-copy-btn';
  copyBtn.type = 'button';
  copyBtn.textContent = 'Copy result';

  const playBtn = document.createElement('button');
  playBtn.id = 'congrats-play-btn';
  playBtn.type = 'button';
  playBtn.autofocus = true;
  playBtn.textContent = 'Play again';

  actions.append(copyBtn, playBtn);
  card.append(msg, timeEl, actions);
  dialog.appendChild(card);
  document.body.appendChild(dialog);

  // Backdrop click (target is the transparent dialog frame, not the card) closes.
  dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });

  let copyText = '';
  copyBtn.addEventListener('click', () => {
    navigator.clipboard?.writeText(copyText).catch(() => {});
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy result'; }, 1500);
  });
  playBtn.addEventListener('click', () => {
    dialog.close();
    onPlayAgain();
  });

  function open(timeMs) {
    const timeStr = formatMs(timeMs);
    timeEl.textContent = 'Solved in ' + timeStr;
    const prefix = (title && date) ? title + ' · ' + String(date) + '\n' : '';
    copyText = prefix + 'Solved in ' + timeStr;
    if (!dialog.open) dialog.showModal();
  }

  return { open };
}

// Builds and wires the keyboard-shortcuts modal from a list of [keys, description]
// pairs (the only part that differs between tools). Creates the #keys-btn trigger
// (fixed bottom-right corner) and a native <dialog id="keys-overlay"> holding the
// #keys-modal card, both appended to <body>. Returns the <dialog> for setupKeydown's
// keysOverlay guard (which checks .open).
//
// Opens on button click or ? keypress via showModal(), which moves focus into the
// dialog, traps Tab inside it, makes the rest of the page inert, and paints the
// ::backdrop dim in the top layer — all behaviors the platform gives for free.
// Closes on close-button click, backdrop click, or Escape (native). Puzzle focus
// returns via the browser's native dialog focus-restoration: `open()` focuses the
// grid input just before showModal(), making it the recorded restore target, so
// every close path lands focus there with no explicit close handler.
function setupKeysOverlay(shortcuts, refocus) {
  const btn = document.createElement('button');
  btn.id = 'keys-btn';
  btn.type = 'button';
  btn.setAttribute('aria-label', 'Keyboard shortcuts');
  btn.textContent = '?';
  document.body.appendChild(btn);

  // <dialog> carries the dialog/aria-modal semantics implicitly when shown via
  // showModal(); it is a transparent frame, and #keys-modal is the visible card.
  const dialog = document.createElement('dialog');
  dialog.id = 'keys-overlay';
  dialog.setAttribute('aria-label', 'Keyboard shortcuts');

  const modal = document.createElement('div');
  modal.id = 'keys-modal';

  const header = document.createElement('div');
  header.id = 'keys-modal-header';
  const heading = document.createElement('span');
  heading.textContent = 'Keyboard shortcuts';
  const closeBtn = document.createElement('button');
  closeBtn.id = 'keys-close';
  closeBtn.type = 'button';
  closeBtn.autofocus = true; // showModal() focuses this, parking keystrokes off the grid
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.textContent = '✕';
  header.append(heading, closeBtn);

  const table = document.createElement('table');
  for (const [keys, desc] of shortcuts) {
    const row = document.createElement('tr');
    const keyCell = document.createElement('td');
    const kbd = document.createElement('kbd');
    kbd.textContent = keys;
    keyCell.appendChild(kbd);
    const descCell = document.createElement('td');
    descCell.textContent = desc;
    row.append(keyCell, descCell);
    table.appendChild(row);
  }

  modal.append(header, table);
  dialog.appendChild(modal);
  document.body.appendChild(dialog);

  // Focus the puzzle before opening so the input becomes the dialog's recorded
  // focus-restore target; the browser's native restoration then returns focus
  // there on every close path (Escape, ✕, backdrop, ? toggle). Without this,
  // restoration would return focus to the trigger button, briefly stranding the
  // next keystroke off the grid.
  const open  = () => { refocus(); dialog.showModal(); };
  const close = () => dialog.close();

  btn.addEventListener('click', () => dialog.open ? close() : open());
  closeBtn.addEventListener('click', close);
  // A click whose target is the dialog itself landed on the ::backdrop — clicks on
  // the #keys-modal card target the card or its children, so they don't close.
  dialog.addEventListener('click', e => { if (e.target === dialog) close(); });
  document.addEventListener('keydown', e => {
    if (!document.hasFocus()) return;
    if (e.key === '?' && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      dialog.open ? close() : open();
    }
  });
  return dialog;
}

// Builds and wires the options menu: a fixed top-right hamburger trigger
// (#menu-btn) and a non-modal dropdown (#menu-panel) that today holds only the
// Clear button, but is the shared home for any future rarely-used puzzle-wide
// toggle. Unlike setupKeysOverlay's <dialog>, the panel is a plain div — it
// never makes the page inert, so the grid stays clickable behind it.
//
// Clicks inside the panel never close it on their own. That is what lets
// #clear-btn's existing two-click arm/confirm sequence (setupClearButton) play
// out with the panel visibly open through the 3s "Are you sure?" window, instead of
// vanishing after the first (arming) click. Closing — by re-clicking the
// trigger, clicking outside, or Escape — calls `refocus`, matching every other
// control that can steal focus from the hidden input (see
// docs/CROSS_TOOL_SPEC.md → Focus management).
//
// Returns { clearBtn, close, checkBtnToggle, checkBtnToggleLabel } for setupControls
// to wire.
function setupOptionsMenu(refocus) {
  const btn = document.createElement('button');
  btn.id = 'menu-btn';
  btn.type = 'button';
  btn.setAttribute('aria-label', 'Menu');
  btn.setAttribute('aria-haspopup', 'true');
  btn.setAttribute('aria-expanded', 'false');
  btn.textContent = '☰';
  document.body.appendChild(btn);

  const panel = document.createElement('div');
  panel.id = 'menu-panel';
  panel.setAttribute('role', 'menu');
  panel.hidden = true;

  // Only meaningful in non-hashed puzzles — the caller hides checkBtnToggleLabel
  // entirely (not just the checkbox) when hashed, since there's no Check Cell
  // button there to control. Sits above Clear Puzzle: a plain display setting
  // before the destructive action.
  const checkBtnToggle = document.createElement('input');
  checkBtnToggle.type = 'checkbox';
  checkBtnToggle.id = 'check-btn-toggle';
  const checkBtnToggleLabel = document.createElement('label');
  checkBtnToggleLabel.id = 'check-btn-toggle-label';
  checkBtnToggleLabel.append(checkBtnToggle, document.createTextNode(' Show Check Cell button'));
  panel.appendChild(checkBtnToggleLabel);

  const clearBtn = document.createElement('button');
  clearBtn.id = 'clear-btn';
  clearBtn.type = 'button';
  clearBtn.textContent = 'Clear Puzzle';
  panel.appendChild(clearBtn);

  document.body.appendChild(panel);

  function isOpen() { return !panel.hidden; }

  function close() {
    if (!isOpen()) return;
    panel.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    refocus();
  }

  function open() {
    panel.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
  }

  btn.addEventListener('click', () => (isOpen() ? close() : open()));

  // A click on the trigger is excluded here because its own listener above
  // already handled it (bubbling reaches this one after), and a click inside
  // the panel (e.g. arming Clear) must never close the menu out from under it.
  document.addEventListener('click', e => {
    if (!isOpen()) return;
    if (panel.contains(e.target) || btn.contains(e.target)) return;
    close();
  });

  document.addEventListener('keydown', e => {
    if (isOpen() && e.key === 'Escape') close();
  });

  return { clearBtn, close, checkBtnToggle, checkBtnToggleLabel };
}

// A tiny, board-independent localStorage boolean for the Check Cell button's
// visibility — namespaced under the puzzle's own key (see storageKey) but never
// touched by clearState()/resetBoard(): it's a display preference, not board
// state, so Clear Puzzle must not reset it. Not built on setupStorage(), whose
// v/cellCount guard is board-shaped and meaningless for a single boolean. Absent
// (first load, or an older save) defaults to visible. `key` may be null exactly
// as in setupStorage — an untitled/undated puzzle gets no persistence either.
function setupCheckBtnPref(key) {
  const prefKey = key && (key + ':showCheckBtn');
  function load() {
    if (!prefKey) return true;
    try {
      const v = JSON.parse(localStorage.getItem(prefKey));
      return typeof v === 'boolean' ? v : true;
    } catch (_) { return true; }
  }
  function save(visible) {
    if (!prefKey) return;
    try { localStorage.setItem(prefKey, JSON.stringify(visible)); } catch (_) {}
  }
  return { load, save };
}

// Reserves #controls' current rendered width and height as min-width/min-height,
// so hiding #check-btn (via the "Show Check Cell button" toggle) never shrinks
// the row. Two independent reasons, both load-bearing:
//   - height: #check-btn is deliberately styled larger than its siblings
//     ("Primary button", theme-components.css), so it's ordinarily the
//     tallest child and the one whose removal would otherwise change
//     #controls' own height — in Snake Charmer specifically, that shifts the
//     ring below it in the same flex column.
//   - width: Snake Charmer's #ring-wrap has no explicit width — it shrinks to
//     fit its widest child (src/template/base.css), which for a small ring is
//     #controls, not the ring itself. Removing a button there shrinks
//     #controls' natural width, which shrinks #ring-wrap, which shrinks the
//     ring (#ring-svg is width:100% of it) — an unrelated button hide
//     visibly resizing the puzzle, not just reflowing #controls internally.
// Must be called while #check-btn is still visible, i.e. before applying the
// loaded preference.
// If a future fix makes #controls' rendered size constant (e.g. by giving it
// an explicit width/height instead of relying on content), revisit whether
// this runtime measurement is still needed.
function reserveControlsSize() {
  const controls = document.getElementById('controls');
  if (!controls) return;
  const rect = controls.getBoundingClientRect();
  controls.style.minWidth = rect.width + 'px';
  controls.style.minHeight = rect.height + 'px';
}

// Wires #check-btn and the options menu around it, identically in every engine:
//   - #check-btn is hidden in hashed builds (the plain-text answer never ships there, so
//     there is nothing to check against) and calls `onCheck` otherwise.
//   - Clear arms/confirms through setupClearButton; once actually confirmed (not just
//     armed) it runs `onClear` and closes the menu on the solver's behalf.
//   - The "Show Check Cell button" row is hidden in hashed builds; otherwise it reserves
//     #controls' size (before the loaded preference can hide the button — see
//     reserveControlsSize), applies the persisted preference, and keeps it in sync.
// `key` is the same storageKey(...) result the engine passes to setupStorage.
function setupControls({ checkBtn, hashed, onCheck, onClear, refocus, key }) {
  const { clearBtn, close, checkBtnToggle, checkBtnToggleLabel } = setupOptionsMenu(refocus);
  setupClearButton(clearBtn, () => { onClear(); close(); }, refocus);

  if (hashed) {
    checkBtn.hidden = true;
    checkBtnToggleLabel.hidden = true;
    return;
  }
  checkBtn.addEventListener('click', onCheck);
  reserveControlsSize();
  const checkBtnPref = setupCheckBtnPref(key);
  checkBtnToggle.checked = checkBtnPref.load();
  checkBtn.hidden = !checkBtnToggle.checked;
  checkBtnToggle.addEventListener('change', () => {
    checkBtn.hidden = !checkBtnToggle.checked;
    checkBtnPref.save(checkBtnToggle.checked);
  });
}

if (typeof module !== 'undefined') {
  module.exports = {
    svgEl, renderByline, renderInstructions, setupClearButton, setupRebusButton,
    scrollByKey, storageKey, setupStorage, flashWrong,
    setupKeydown, setupCongratsDialog, setupKeysOverlay, setupOptionsMenu,
    setupCheckBtnPref, reserveControlsSize, setupControls,
  };
}

'use strict';
// Shared core for the shape renderers (stadium.js, turn.js, double-turn.js).
//
// Every ring shape is a closed chain of sections in clockwise traversal order, and
// every section is one of two kinds:
//   - a straight track along one side of a horizontal arm. A 'top' track sits above
//     the arm's center line and runs left → right; a 'bottom' track sits below it and
//     runs right → left (clockwise traversal fixes the pairing).
//   - an arc of an annulus, stepping by a signed angle per cell (positive =
//     clockwise in SVG's y-down coordinates).
// A shape module only lists its sections; the cell outline, letter anchor and
// number-label anchor are computed here, so every shape positions labels the same way.
//
// A band is the radial extent a section occupies: { rOut, rIn, rc } — outer edge,
// inner edge, and the center line letters sit on. For a straight track the radii are
// vertical offsets from the arm's center line.

// Entry-number label placement, tuned by eye and shared by every shape. `.cell-num` is
// text-anchor: middle / dominant-baseline: middle (shared/base.css), so these position a
// label's *center*, not a corner. The values are not arbitrary:
//   - 8px from the outer edge, on straights and curves alike, is what makes a curved
//     label line up with the straight-section label it meets at a corner; 6px there
//     leaves the curved one visibly high.
//   - 6px in from a straight cell's leading edge (3px looked cramped).
//   - a curved label sits 0.2 of the way into the cell's angular span, which reads as
//     the same "just inside the leading edge" as the straight inset.
const LABEL_LEAD_INSET  = 6;
const LABEL_OUTER_INSET = 8;
const LABEL_ARC_FRAC    = 0.2;

// `n` straight cells of width `w` along the `side` ('top' | 'bottom') of the arm whose
// center line is `y`. `xStart` is the leading edge of the first cell: its left edge on
// a top track, its right edge on a bottom track.
function trackSection(n, xStart, y, side, band, w) {
  return { kind: 'track', n, xStart, y, side, band, w };
}

// `n` curved cells around (ccx, ccy), the first starting at angle `tStart` and each
// spanning `step` radians.
function arcSection(n, ccx, ccy, band, tStart, step) {
  return { kind: 'arc', n, ccx, ccy, band, tStart, step };
}

function trackCell({ xStart, y, side, band, w }, j) {
  const top = side === 'top';
  const dir = top ? 1 : -1;
  const xLead  = xStart + dir * j * w;
  const xTrail = xStart + dir * (j + 1) * w;
  // Outer edge is above the center line on a top track, below it on a bottom track.
  const yOut = top ? y - band.rOut : y + band.rOut;
  const yIn  = top ? y - band.rIn  : y + band.rIn;
  const [xl, xr]  = top ? [xLead, xTrail] : [xTrail, xLead];
  const [yT, yB]  = top ? [yOut, yIn]     : [yIn, yOut];
  return {
    path:   `M ${xl} ${yT} L ${xr} ${yT} L ${xr} ${yB} L ${xl} ${yB} Z`,
    letter: { tx: xStart + dir * (j + 0.5) * w, ty: top ? y - band.rc : y + band.rc },
    label:  { lx: xLead + dir * LABEL_LEAD_INSET, ly: top ? yOut + LABEL_OUTER_INSET : yOut - LABEL_OUTER_INSET },
  };
}

function arcCell({ ccx, ccy, band, tStart, step }, j) {
  const { rOut, rIn, rc } = band;
  const t1 = tStart + j * step;
  const t2 = tStart + (j + 1) * step;
  const c1 = Math.cos(t1), s1 = Math.sin(t1);
  const c2 = Math.cos(t2), s2 = Math.sin(t2);
  // The outer arc sweeps in the direction of travel, the inner arc back against it.
  const fOut = step > 0 ? 1 : 0;
  const fIn  = 1 - fOut;
  const tMid = tStart + (j + 0.5) * step;
  const la   = t1 + LABEL_ARC_FRAC * step;
  const rl   = rOut - LABEL_OUTER_INSET;
  return {
    path: `M ${ccx+rOut*c1} ${ccy+rOut*s1} A ${rOut} ${rOut} 0 0 ${fOut} ${ccx+rOut*c2} ${ccy+rOut*s2} ` +
          `L ${ccx+rIn*c2} ${ccy+rIn*s2} A ${rIn} ${rIn} 0 0 ${fIn} ${ccx+rIn*c1} ${ccy+rIn*s1} Z`,
    letter: { tx: ccx + rc * Math.cos(tMid), ty: ccy + rc * Math.sin(tMid) },
    label:  { lx: ccx + rl * Math.cos(la),   ly: ccy + rl * Math.sin(la) },
  };
}

// sections → { cellPath, letterCenter, labelPos, sectionOf }, each indexed by ring
// position. Sections with n = 0 (e.g. a circle's straight tracks) contribute no cells.
function makeRingRenderer(sections) {
  const cells = [];
  const sectionIdx = [];
  sections.forEach((s, k) => {
    for (let j = 0; j < s.n; j++) {
      cells.push(s.kind === 'track' ? trackCell(s, j) : arcCell(s, j));
      sectionIdx.push(k);
    }
  });
  function at(i) {
    const cell = cells[i];
    if (!cell) throw new RangeError(`ring position ${i} is outside 0..${cells.length - 1}`);
    return cell;
  }
  return {
    cellPath:     i => at(i).path,
    letterCenter: i => at(i).letter,
    labelPos:     i => at(i).label,
    sectionOf:    i => (at(i), sectionIdx[i]),
  };
}

if (typeof module !== 'undefined') module.exports = { makeRingRenderer, trackSection, arcSection };

'use strict';
// Stadium/circle shape renderer: two straight tracks joined by semicircles. A circle
// is the same ring with nStraight = 0.
// getStadiumRenderer(ring) → { cellPath, letterCenter, labelPos, sectionOf }

if (typeof makeRingRenderer === 'undefined' && typeof require !== 'undefined')
  var { makeRingRenderer, trackSection, arcSection } = require('./ring');

function getStadiumRenderer(ring) {
  const { nCurve, nStraight, L, rCenter, rOuter, rInner, cx, cy } = ring;
  const W_CELL = nStraight > 0 ? L / nStraight : 0;
  const band = { rOut: rOuter, rIn: rInner, rc: rCenter };
  const step = Math.PI / nCurve;

  return makeRingRenderer([
    trackSection(nStraight, cx - L / 2, cy, 'top', band, W_CELL),        // top, left → right
    arcSection(nCurve, cx + L / 2, cy, band, -Math.PI / 2, step),        // right semicircle, top → bottom
    trackSection(nStraight, cx + L / 2, cy, 'bottom', band, W_CELL),     // bottom, right → left
    arcSection(nCurve, cx - L / 2, cy, band, Math.PI / 2, step),         // left semicircle, bottom → top
  ]);
}

if (typeof module !== 'undefined') module.exports = { getStadiumRenderer };

'use strict';
// Turn (C-shape) renderer: two horizontal arms joined on the left by a body arc system
// centered on (cx, cy). Traversal order is documented in src/layoutTurn.js.
// getTurnRenderer(ring) → { cellPath, letterCenter, labelPos, sectionOf }

if (typeof makeRingRenderer === 'undefined' && typeof require !== 'undefined')
  var { makeRingRenderer, trackSection, arcSection } = require('./ring');

function getTurnRenderer(ring) {
  const { nArmStraight, nArmCurve, nBodyInner, nBodyOuter, rArmCenter, rArmOuter, rArmInner,
          D, R_in, R_out, L, cx, cy } = ring;
  const H_CELL = rArmOuter - rArmInner;
  const W_CELL = nArmStraight > 0 ? L / nArmStraight : 0;
  const arm  = { rOut: rArmOuter, rIn: rArmInner, rc: rArmCenter };
  const body = R => ({ rOut: R + H_CELL / 2, rIn: R - H_CELL / 2, rc: R });
  const PI = Math.PI;

  return makeRingRenderer([
    trackSection(nArmStraight, cx,     cy - D, 'top',    arm, W_CELL),          // 0 top arm upper track
    arcSection(nArmCurve,      cx + L, cy - D, arm, -PI / 2, PI / nArmCurve),   // 1 top arm right curve
    trackSection(nArmStraight, cx + L, cy - D, 'bottom', arm, W_CELL),          // 2 top arm lower track
    arcSection(nBodyInner,     cx, cy, body(R_in), -PI / 2, -PI / nBodyInner),  // 3 body inner arc (CCW)
    trackSection(nArmStraight, cx,     cy + D, 'top',    arm, W_CELL),          // 4 bottom arm upper track
    arcSection(nArmCurve,      cx + L, cy + D, arm, -PI / 2, PI / nArmCurve),   // 5 bottom arm right curve
    trackSection(nArmStraight, cx + L, cy + D, 'bottom', arm, W_CELL),          // 6 bottom arm lower track
    arcSection(nBodyOuter,     cx, cy, body(R_out), PI / 2, PI / nBodyOuter),   // 7 body outer arc
  ]);
}

if (typeof module !== 'undefined') module.exports = { getTurnRenderer };

'use strict';
// Double-turn (S-shape) renderer: three horizontal arms joined by a left body arc
// system at (cx_L, cy_L) and a right one at (cx_R, cy_R). Traversal order is
// documented in src/layoutDoubleTurn.js.
// getDoubleTurnRenderer(ring) → { cellPath, letterCenter, labelPos, sectionOf }

if (typeof makeRingRenderer === 'undefined' && typeof require !== 'undefined')
  var { makeRingRenderer, trackSection, arcSection } = require('./ring');

function getDoubleTurnRenderer(ring) {
  const { nArmStraight, nMidStraight, nArmCurve, nBodyInner, nBodyOuter,
          rArmCenter, rArmOuter, rArmInner, R_in, R_out, L, Lm,
          cx_L, cx_R, cy, cy_L, cy_R, cy_top, cy_bot } = ring;
  const H_CELL = rArmOuter - rArmInner;
  const W_CELL = nArmStraight > 0 ? L / nArmStraight
               : nMidStraight > 0 ? Lm / nMidStraight
               : 36;
  const arm  = { rOut: rArmOuter, rIn: rArmInner, rc: rArmCenter };
  const body = R => ({ rOut: R + H_CELL / 2, rIn: R - H_CELL / 2, rc: R });
  const PI = Math.PI;

  return makeRingRenderer([
    trackSection(nArmStraight, cx_L,     cy_top, 'top',    arm, W_CELL),              //  0 top arm upper track
    arcSection(nArmCurve,      cx_L + L, cy_top, arm, -PI / 2, PI / nArmCurve),       //  1 top arm right curve
    trackSection(nArmStraight, cx_L + L, cy_top, 'bottom', arm, W_CELL),              //  2 top arm lower track
    arcSection(nBodyInner,     cx_L, cy_L, body(R_in),  -PI / 2, -PI / nBodyInner),   //  3 left body inside arc (CCW)
    trackSection(nMidStraight, cx_L,     cy,     'top',    arm, W_CELL),              //  4 middle arm upper track
    arcSection(nBodyOuter,     cx_R, cy_R, body(R_out), -PI / 2, PI / nBodyOuter),    //  5 right body outside arc
    trackSection(nArmStraight, cx_R,     cy_bot, 'bottom', arm, W_CELL),              //  6 bottom arm lower track
    arcSection(nArmCurve,      cx_R - L, cy_bot, arm, PI / 2, PI / nArmCurve),        //  7 bottom arm left curve
    trackSection(nArmStraight, cx_R - L, cy_bot, 'top',    arm, W_CELL),              //  8 bottom arm upper track
    arcSection(nBodyInner,     cx_R, cy_R, body(R_in),  PI / 2, -PI / nBodyInner),    //  9 right body inside arc (CCW)
    trackSection(nMidStraight, cx_R,     cy,     'bottom', arm, W_CELL),              // 10 middle arm lower track
    arcSection(nBodyOuter,     cx_L, cy_L, body(R_out), PI / 2, PI / nBodyOuter),     // 11 left body outside arc
  ]);
}

if (typeof module !== 'undefined') module.exports = { getDoubleTurnRenderer };

'use strict';

// Shared modules injected by builder.js in the browser; loaded conditionally for Node tests.
if (typeof isCellCorrect === 'undefined' && typeof require !== 'undefined')
  var isCellCorrect = require('../../../shared/isCellCorrect');

// ── Pure helpers (exported for Node tests) ────────────────────────────────────

// Derive the cell→entry mapping from entry lengths alone (sequential positional
// assignment). entryAtCell[ringPos][loop] = entry index occupying that cell, or -1.
// ringPosByEntry[ei] = ring positions for entry ei, in posInEntry order.
// canonicalStart[ei] = { ringPos, loop } of that entry's first cell (posInEntry 0).
function buildEntryMaps(entries, loops) {
  const ringSize = entries.reduce((s, e) => s + e.length, 0) / loops;
  const entryAtCell = Array.from({ length: ringSize }, () => new Array(loops).fill(-1));
  const ringPosByEntry = entries.map(() => []);
  const canonicalStart = [];
  let concatPos = 0;
  for (let ei = 0; ei < entries.length; ei++) {
    for (let pip = 0; pip < entries[ei].length; pip++) {
      const ringPos = concatPos % ringSize;
      const loop = Math.floor(concatPos / ringSize);
      entryAtCell[ringPos][loop] = ei;
      ringPosByEntry[ei].push(ringPos);
      if (pip === 0) canonicalStart[ei] = { ringPos, loop };
      concatPos++;
    }
  }
  return { entryAtCell, ringPosByEntry, canonicalStart };
}

function nextRingPos(pos, total) {
  return (pos + 1) % total;
}

function prevRingPos(pos, total) {
  return (pos - 1 + total) % total;
}

// ── DOM engine (browser only) ─────────────────────────────────────────────────

  }

  function init() {

    const data = window.PUZZLE_DATA;
    const { svgWidth, svgHeight } = data.ring;
    const ringSize = data.ring.N;

    // ── Geometry & index maps ─────────────────────────────────────────────────
    const { cellPath, letterCenter, labelPos } = getShapeRenderer(data.shape)(data.ring);
    const { entryAtCell, ringPosByEntry, canonicalStart } = buildEntryMaps(data.entries, data.loops);

    const entriesStartingAt = Array.from({ length: ringSize }, () => []);
    canonicalStart.forEach((start, ei) => entriesStartingAt[start.ringPos].push(ei));

    let activeLoop = 0;

      letterTexts[rp].classList.toggle('correct', on);

    function setCellLetter(ringPos, letter) {
      letterState[ringPos] = letter;
      setLetterText(letterTexts[ringPos], letter);
      setCorrect(ringPos, false);

    // of focusCell — which covers every cursor move because activeRingPos is assigned
    // nowhere else.
    const composer = makeComposer({
      getContent: rp => letterState[rp],
      setContent: (rp, s) => setCellLetter(rp, s),
      getCellEl:  rp => cellPaths[rp],
      onCommit:   () => { syncUI(); checker.checkIfFilled(); saveState(); },
    });

    // Board state and answer checking. Ring positions 0..N-1 are the canonical board
    // string order. markSolved marks clue items in *both* modes, per the mode-symmetry
    // rule in docs/CROSS_TOOL_SPEC.md → Answer checking.
    const checker = makeBoardChecker({
      cellIds:             Array.from({ length: ringSize }, (_, rp) => rp),
      getContent:          rp => letterState[rp],
      isCellFilled:        rp => composer.isCellFilled(rp),
      isCellMarkedCorrect: rp => cellPaths[rp].classList.contains('correct'),
      hashed:              !!data.hashed,
      getExpected:         rp => data.letters && data.letters[rp],
      getBoardHash:        () => data.boardHash,
      markSolved: () => {
        letterState.forEach((_, rp) => setCorrect(rp, true));
        data.entries.forEach((_, ei) => cluesList.children[ei].classList.add('correct'));
      },
      syncUI: () => syncUI(),
    });

    function focusCell(ringPos, loop) {
      composer.commitIfMoved(ringPos);
      activeRingPos = ringPos;
      activeLoop = loop;
      refocus();
      syncUI();
    }

    function advanceCell(ringPos) {
      const nextPos = nextRingPos(ringPos, ringSize);
      const nextLoop = nextPos === 0 && ringPos === ringSize - 1
        ? (activeLoop + 1) % data.loops : activeLoop;
      focusCell(nextPos, nextLoop);
    }

    function retreatCell(ringPos) {
      const prevPos = prevRingPos(ringPos, ringSize);
      const prevLoop = prevPos === ringSize - 1 && ringPos === 0
        ? (activeLoop - 1 + data.loops) % data.loops : activeLoop;
      focusCell(prevPos, prevLoop);
    }

    // The one rebus toggle, shared by the Enter key and #rebus-btn. Both entry points must
    // behave identically, so neither gets its own copy of the composer call. Committing
    // does not advance the cursor — only an explicit move (arrow, Tab, click) does.
    function toggleRebus() {
      composer.enter(activeRingPos);
      syncUI();
    }

    // Declared above syncUI (which calls rebusBtn.sync()) — see docs/CROSS_TOOL_SPEC.md →
    // "Enter / Rebus button" for the TDZ rationale. Never hidden and never disabled —
    // unlike checkBtn. See setupRebusButton.
    const rebusBtn = setupRebusButton(document.getElementById('rebus-btn'), {
      onToggle:    toggleRebus,
      isComposing: () => composer.isComposing(activeRingPos),
      isSolved:    () => latch.solved,
      refocus,
    });

    function syncUI() {
      // Loop toggle active segment (loopBtns is built in Event wiring; syncUI first runs in Restore & focus).
      loopBtns.forEach((btn, i) => btn.classList.toggle('active', i === activeLoop));
      // Composition also ends on any cursor move, which never touches the button.
      rebusBtn.sync();

      // Active entry, plus the other loop's entry through the same cell as the
      // secondary highlight (snake-charmer-specific — see CLAUDE.md → SVG ring rendering).
      const activeEntryIdx = entryAtCell[activeRingPos][activeLoop];
      const activeEntryPositions = new Set(
        activeEntryIdx >= 0 ? ringPosByEntry[activeEntryIdx] : []
      );
      const otherLoop = (activeLoop + 1) % data.loops;
      const secondaryEntryIdx = entryAtCell[activeRingPos][otherLoop];
      const secondaryPositions = new Set(
        secondaryEntryIdx >= 0 && secondaryEntryIdx !== activeEntryIdx
          ? ringPosByEntry[secondaryEntryIdx]
          : []
      );

      cellPaths.forEach((p, rp) => {
        const isActive = activeEntryPositions.has(rp);
        const isSecondary = !isActive && secondaryPositions.has(rp);
        p.classList.toggle('active-entry', isActive);
        p.classList.toggle('secondary-entry', isSecondary);
        p.classList.toggle('active-cell', rp === activeRingPos);
      });
      // Repaint active cell last within its layer so its border isn't covered by a neighbour's fill.
      cellsLayer.appendChild(cellPaths[activeRingPos]);

      Array.from(cluesList.children).forEach((li, i) => {
        li.classList.toggle('active-clue', i === activeEntryIdx);
        li.classList.toggle('secondary-entry', i === secondaryEntryIdx && i !== activeEntryIdx);
      });

      barPrimaryNum.textContent    = `${activeEntryIdx + 1}.`;
      barPrimaryText.innerHTML     = data.entries[activeEntryIdx].clue; // pre-rendered markdown HTML — see shared/build/renderMarkdown.js
      barSecondaryNum.textContent  = `${secondaryEntryIdx + 1}.`;
      barSecondaryText.innerHTML   = data.entries[secondaryEntryIdx].clue; // pre-rendered markdown HTML

      const allFilled = checker.isBoardFilled();
      const everyCellCorrect = checker.isSolved();

      doneWrong.hidden = !(allFilled && !everyCellCorrect);

      if (!data.hashed) {
        checkBtn.disabled = !composer.isCellFilled(activeRingPos) ||
          cellPaths[activeRingPos].classList.contains('correct');
      }
      latch.check(everyCellCorrect);
    }

    const saveKey = storageKey('sc', data);
    const { saveState, restoreState, clearState } = setupStorage(saveKey, {
      cellCount: ringSize,
      getState() {
        const correct = [];
        cellPaths.forEach((p, i) => { if (p.classList.contains('correct')) correct.push(i); });
        return {
          letters: letterState, correct, activeMs: timer.getElapsedMs(),
          composing: composer.getComposing(),
        };
      },
      applyState(saved) {
        saved.letters.forEach((letter, i) => {
          if (!letter) return;
          letterState[i] = letter;
          setLetterText(letterTexts[i], letter);
        });
        saved.correct.forEach(i => setCorrect(i, true));
        timer.restoreMs(saved.activeMs);
        // After the letters are painted, so the composing cell shows its partial content.
        // Absent in saves predating this field; composer.restore treats that as null.
        composer.restore(saved.composing);
      },
    });

    const congratsDialog = setupCongratsDialog({
      title: data.title,
      date: data.date,
      onPlayAgain: () => resetBoard(),
    });

    const { timer, latch } = setupSolveTracking({
      puzzleRoot:  document.querySelector('.puzzle-main'),
      data,
      getSolution: () => checker.getSolution(),
      saveState,
      onComplete:  (timeMs) => congratsDialog.open(timeMs),
    });

    // ── Build SVG ─────────────────────────────────────────────────────────────
    document.querySelector('.puzzle-main').classList.add(`layout-${data.shape}`);

    // svgEl() is provided by shared/engine-chrome.js (inlined into the bundle).
    const svg = document.getElementById('ring-svg');
    svg.setAttribute('width', svgWidth);
    svg.setAttribute('height', svgHeight);
    svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);

    const cellPaths = [];
    const letterTexts = [];

    // Five explicit layers: cells < circles < flash < letters < labels.
    // flashLayer holds wrong-guess flash overlays (see flashWrong) above the cells.
    const cellsLayer   = svgEl('g');
    const circlesLayer = svgEl('g');
    const flashLayer   = svgEl('g');
    const lettersLayer = svgEl('g');
    const labelsLayer  = svgEl('g');
    svg.append(cellsLayer, circlesLayer, flashLayer, lettersLayer, labelsLayer);

    for (let i = 0; i < ringSize; i++) {
      const path = svgEl('path', { class: 'cell', id: `cell-${i}`, 'data-pos': i, d: cellPath(i) });
      path.addEventListener('click', () => {
        const alreadyActive = i === activeRingPos && document.activeElement === hiddenInput;
        focusCell(i, alreadyActive ? (activeLoop + 1) % data.loops : activeLoop);
      });
      cellsLayer.appendChild(path);
      cellPaths.push(path);
    }

    data.entries.forEach((entry, ei) => {
      if (!entry.styles || !Array.isArray(entry.styles.circle)) return;
      entry.styles.circle.forEach(posInEntry => {
        const ringPos = ringPosByEntry[ei][posInEntry];
        if (ringPos === undefined) return;
        const { tx, ty } = letterCenter(ringPos);
        circlesLayer.appendChild(svgEl('circle', { class: 'style-circle', cx: tx, cy: ty, r: 17 }));
      });
    });

    for (let i = 0; i < ringSize; i++) {
      const { tx, ty } = letterCenter(i);
      const text = svgEl('text', { class: 'cell-letter', id: `letter-${i}`, 'data-pos': i, x: tx, y: ty });
      lettersLayer.appendChild(text);
      letterTexts.push(text);
    }

    entriesStartingAt.forEach((startEntries, i) => {
      if (startEntries.length === 0) return;
      const { lx, ly } = labelPos(i);
      const numText = svgEl('text', { class: 'cell-num', x: lx, y: ly });
      numText.textContent = startEntries.map(ei => ei + 1).join('/');
      labelsLayer.appendChild(numText);
    });

    const barPrimaryNum    = document.querySelector('#active-clue-primary .active-clue-num');
    const barPrimaryText   = document.querySelector('#active-clue-primary .active-clue-text');
    const barSecondaryNum  = document.querySelector('#active-clue-secondary .active-clue-num');
    const barSecondaryText = document.querySelector('#active-clue-secondary .active-clue-text');

    // ── Header & clues ────────────────────────────────────────────────────────
    renderByline(data);
    renderInstructions(data);

    // Render clue list
    const cluesList = document.getElementById('clues');
    data.entries.forEach((entry, i) => {
      const li = document.createElement('li');
      li.className = 'clue-item';
      li.dataset.entry = i;
      const textSpan = document.createElement('span');
      textSpan.className = 'clue-text';
      textSpan.innerHTML = entry.clue; // pre-rendered markdown HTML — see shared/build/renderMarkdown.js
      li.appendChild(textSpan);
      cluesList.appendChild(li);
    });

    // ── Event wiring ──────────────────────────────────────────────────────────
    const hiddenInput = document.getElementById('hidden-input');

    const checkBtn = document.getElementById('check-btn');

    const doneWrong = document.getElementById('done-wrong');
    const keysOverlay = setupKeysOverlay(
      [
        ['Tab',       'Next entry'],
        ['Shift+Tab', 'Previous entry'],
        ['← →',       'Move along ring'],
        ['⌫',         'Clear current cell'],
        ['Space',     'Clear and advance'],
        ['Enter',     'Multi-letter cell'],
        ['.',         'Toggle direction'],
      ],
      refocus
    );

    const loopBtns = (() => {
      const toggle = document.getElementById('loop-toggle');
      const cumPos = [0];
      for (const e of data.entries) cumPos.push(cumPos[cumPos.length - 1] + e.length);
      return Array.from({ length: data.loops }, (_, l) => {
        const loopStart = l * ringSize;
        const loopEnd = (l + 1) * ringSize;
        let first = -1, last = -1;
        for (let i = 0; i < data.entries.length; i++) {
          if (cumPos[i] < loopEnd && cumPos[i + 1] > loopStart) {
            if (first === -1) first = i + 1;
            last = i + 1;
          }
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toggle-opt' + (l === 0 ? ' active' : '');
        btn.textContent = `Clues ${first}–${last}`;
        btn.addEventListener('click', () => focusCell(activeRingPos, l));
        toggle.appendChild(btn);
        return btn;
      });
    })();

    setupKeydown(e => {
      if (latch.solved) return;
      const ringPos = activeRingPos;
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (composer.backspace(ringPos)) {
          syncUI();
          saveState();
          return;
        }
        if (letterState[ringPos]) {
          setCellLetter(ringPos, '');
          syncUI();
        } else {
          setCellLetter(prevRingPos(ringPos, ringSize), '');
          retreatCell(ringPos);
        }
        saveState();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        toggleRebus();
      } else if (e.key === ' ') {
        e.preventDefault();
        setCellLetter(ringPos, '');
        saveState();
        advanceCell(ringPos);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        advanceCell(ringPos);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        retreatCell(ringPos);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const activeEntryIdx = entryAtCell[activeRingPos][activeLoop];
        const nextEntryIdx = e.shiftKey
          ? (activeEntryIdx - 1 + data.entries.length) % data.entries.length
          : (activeEntryIdx + 1) % data.entries.length;
        const { ringPos: targetRingPos, loop: targetLoop } = canonicalStart[nextEntryIdx];
        focusCell(targetRingPos, targetLoop);
      } else if (e.key === '.') {
        e.preventDefault();
        focusCell(activeRingPos, (activeLoop + 1) % data.loops);
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
                 e.key === 'PageUp'  || e.key === 'PageDown') {
        e.preventDefault();
        scrollByKey(e.key);
      }
    }, { keysOverlay });

    hiddenInput.addEventListener('input', () => {
      const ringPos = activeRingPos;
      const typed = normalize(hiddenInput.value).toUpperCase();
      hiddenInput.value = '';
      if (latch.solved || !typed) return;
      timer.onFirstInput();
      // typeLetter applies the slice(-1) rule on the non-composing path; advance only
      // when it says so, so capacity never triggers an advance.
      if (composer.typeLetter(ringPos, typed)) advanceCell(ringPos);
      else syncUI();

      // One checker call for both modes — advance first, then check, so the cursor
      // never lags a keystroke behind the hash comparison.
      checker.checkIfFilled();
      saveState();
    });

    // Clue click → jump to canonical start of that entry
    Array.from(cluesList.children).forEach((li, i) => {
      li.addEventListener('click', e => {
        // A clue can render a real link (see docs/CROSS_TOOL_SPEC.md ->
        // Markdown formatting) — let it open on its own rather than also
        // treating the click as selecting this entry.
        if (e.target.closest('a')) return;
        const { ringPos, loop } = canonicalStart[i];
        focusCell(ringPos, loop);
      });
    });

    // Check Cell (non-hashed mode only)
    function checkCell() {
      const rp = activeRingPos;
      // The focus call is required on every path out: the button holds focus here, and the
      // document keydown listener's BUTTON guard would swallow the next navigation key.
      // The already-correct guard skips a redundant re-save.
      if (!cellPaths[rp].classList.contains('correct') && composer.isCellFilled(rp)) {
        if (isCellCorrect(letterState[rp], data.letters[rp])) {
          setCorrect(rp, true);
          saveState();          // only this branch mutates persisted state
        } else {
          flashWrong(cellPaths[rp], flashLayer);
        }
      }
      syncUI();
      refocus();
    }


    function resetBoard() {
      resetAndRefocus({
        composer, clearState, timer, latch,
        clearBoard() {
          letterState.fill('');
          for (let rp = 0; rp < ringSize; rp++) {
            setLetterText(letterTexts[rp], '');
            setCorrect(rp, false);
          }
          Array.from(cluesList.children).forEach(li => li.classList.remove('correct'));
          flashLayer.replaceChildren();
        },
        focusInitial: () => focusCell(0, 0),
      });
    }

    setupControls({
      checkBtn, hashed: data.hashed, onCheck: checkCell,
      onClear: resetBoard, refocus, key: saveKey,
    });

    // ── Restore & focus ─────────────────────────────────────────────────────────
    const resumeCell = restoreAndSeal({ restoreState, checker, latch, composer });
    // Resume on the restored composing cell — see docs/CROSS_TOOL_SPEC.md → "Composition
    // is saved state" for why this is load-bearing, not a convenience.
    focusCell(resumeCell === null ? 0 : resumeCell, activeLoop);
  }

  document.addEventListener('DOMContentLoaded', init);
})();

if (typeof module !== 'undefined') {
  module.exports = { buildEntryMaps, nextRingPos, prevRingPos };
}

  </script>
</body>
</html>
