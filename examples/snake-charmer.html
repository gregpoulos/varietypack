<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Charmer</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.4; }

/* Tools with a fixed active-clue bar need body padding to clear it */
body.tool-snake-charmer,
body.tool-spiral { padding-top: 56px; }

#active-clue-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 5px 16px 4px;
}

.active-clue-row {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-size: 0.875rem;
  line-height: 1.4;
}

#active-clue-secondary {
  font-size: 0.8rem;
  opacity: 0.6;
}

.active-clue-num {
  font-weight: bold;
  flex-shrink: 0;
}

.active-clue-text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#instructions {
  max-width: 600px;
  margin: 0 auto;
}

.clue-item {
  font-size: 0.875rem;
  padding: 2px 6px;
  border-radius: 2px;
}

.cell        { cursor: pointer; }
.cell-letter { pointer-events: none; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
.cell-num    { pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
.style-circle { pointer-events: none; }

#controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

button {
  cursor: pointer;
  border-radius: 4px;
  border: 1px solid;
  padding: 6px 14px;
  font-size: 0.875rem;
}

button:disabled { opacity: 0.4; cursor: default; }

#clear-btn::after {
  content: 'Sure?';
  display: block;
  height: 0;
  overflow: hidden;
  visibility: hidden;
}

#hidden-input {
  position: fixed;
  left: -9999px;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.puzzle-toggle { display: flex; border-radius: 4px; overflow: hidden; }
.puzzle-toggle .toggle-opt { border-radius: 0; border: none; flex: 1; white-space: nowrap; }
.toggle-opt { user-select: none; cursor: pointer; }

#congrats-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
/* The `hidden` attribute is UA-origin `display: none`, which the author
   `display: flex` above overrides — restate the hide at higher specificity. */
#congrats-overlay[hidden] { display: none; }

#keys-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  z-index: 50;
  cursor: pointer;
  font-size: 1rem;
  font-weight: bold;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

#keys-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
#keys-overlay[hidden] { display: none; }

@keyframes flash-wrong {
  0%   { opacity: 1; }
  20%  { opacity: 1; }
  100% { opacity: 0; }
}
.flash-wrong-overlay {
  fill: #ef9a9a;
  pointer-events: none;
  animation: flash-wrong 600ms ease-out forwards;
}

.puzzle-header { margin-bottom: 16px; }
h1.title { font-size: 1.5rem; font-weight: bold; line-height: 1; }
.byline  { font-size: 0.875rem; margin-top: 4px; }

.puzzle-main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px 24px;
}

.puzzle-body {
  display: flex;
  flex-direction: row-reverse;
  gap: 32px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}

#ring-wrap {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}

#ring-container {
  margin-top: 40px;
  position: relative;
  min-width: 280px;
}

#ring-svg {
  display: block;
  width: 100%;
  height: auto;
}


#clue-list {
  flex: 1;
  min-width: 200px;
  max-width: 420px;
}

#clues {
  list-style: decimal;
  padding-left: 1.6em;
  margin-top: 0;
}

.clue-item { cursor: pointer; }



/* theme-base: neutral defaults — every --theme-* var a theme can override.
   A theme's <name>-tokens.css need only override what differs from these. */
:root {
  /* Fonts */
  --theme-font-body:    system-ui, -apple-system, sans-serif;
  --theme-font-display: var(--theme-font-body);
  --theme-font-button:  var(--theme-font-body);
  --theme-font-cell:    var(--theme-font-body);

  /* Masthead / title / byline */
  --theme-color-header-rule: #cccccc;
  --theme-title-tracking:    normal;
  --theme-title-transform:   none;
  --theme-color-title:       var(--theme-color-text);
  --theme-byline-style:      normal;
  --theme-byline-size:       0.875rem;

  /* Page */
  --theme-color-bg:    #ffffff;
  --theme-color-text:  #111111;
  --theme-color-muted: #555555;

  /* Bars / borders */
  --theme-color-bar-border:  #cccccc;
  --theme-color-soft-border: #cccccc;

  /* Primary button */
  --theme-color-btn-bg:       #333333;
  --theme-color-btn-text:     #ffffff;
  --theme-color-btn-hover:    #555555;
  --theme-color-btn-disabled: #999999;
  --theme-button-tracking:    0.05em;

  /* Secondary / toggle button colors */
  --theme-color-btn2-bg:     #eeeeee;
  --theme-color-btn2-border: #aaaaaa;
  --theme-color-btn2-hover:  #e0e0e0;

  /* Clear button */
  --theme-color-clear-fg:       #999999;
  --theme-color-clear-hover-fg: #333333;

  /* Grid cells */
  --theme-color-cell-bg:     #ffffff;
  --theme-color-cell-stroke: #999999;
  --theme-color-cell-text:   #111111;

  /* Cell / clue states */
  --theme-color-highlight:            #deeeff;
  --theme-color-band-even:            var(--theme-color-cell-bg);
  --theme-color-highlight-band-even:  var(--theme-color-highlight);
  --theme-color-active:               #b8d4f5;
  --theme-color-active-stroke:        #1e5799;
  --theme-color-clue-hover:           #eeeeee;
  --theme-color-secondary-entry:      #f0f0f0;
  --theme-clue-radius:                2px;

  /* Snake-charmer-specific secondary-active cell */
  --theme-color-secondary-active:        #7aaed8;
  --theme-color-secondary-active-stroke: #3a72a8;

  /* Correct */
  --theme-color-correct-bg:     #c8e6c9;
  --theme-color-correct-stroke: #4caf50;
  --theme-color-correct-text:   #1a6e22;

  /* Decorations */
  --theme-color-circle:      #cccccc;
  --theme-color-curl:        #aaaaaa;
  --theme-color-cell-center: #222222;

  /* Instructions */
  --theme-color-instructions: var(--theme-color-muted);
  --theme-instructions-size:  0.85rem;

  /* Congrats / overlay */
  --theme-color-overlay:         rgba(0, 0, 0, 0.45);
  --theme-color-congrats-bg:     #2e7d32;
  --theme-color-congrats-border: #1b5e20;
  --theme-color-congrats-text:   #ffffff;
  --theme-card-radius:           10px;

  /* Done-wrong */
  --theme-color-wrong-bg:     #fff3e0;
  --theme-color-wrong-border: #e65100;
  --theme-color-wrong-text:   var(--theme-color-text);

  /* Danger */
  --theme-color-danger: #b91c1c;
}

/* Broadsheet theme — newspaper palette. Overrides theme-base defaults. */
:root {
  --theme-font-body:    Georgia, 'Times New Roman', serif;
  --theme-font-display: Georgia, 'Times New Roman', serif;
  --theme-font-button:  Georgia, 'Times New Roman', serif;
  --theme-font-cell:    Georgia, 'Times New Roman', serif;

  --theme-color-header-rule: #222222;
  --theme-title-tracking:    0.08em;
  --theme-title-transform:   uppercase;
  --theme-byline-style:      italic;

  --theme-color-bg:    #f9f7f1;

  --theme-color-bar-border:  #bbbbbb;
  --theme-color-soft-border: #bbbbbb;

  --theme-color-btn-bg:    #222222;
  --theme-color-btn-hover: #444444;

  --theme-color-btn2-bg:    #f0ece0;
  --theme-color-btn2-hover: #e4e0d4;

  --theme-color-band-even:           #e8e8e8;
  --theme-color-highlight-band-even: #cee2f8;
  --theme-color-clue-hover:          #ede8d2;
  --theme-color-secondary-entry:     #f5f0e0;

  --theme-color-circle: #bbbbbb;
}

/* theme-components: every tool-agnostic selector, driven entirely by --theme-*.
   Per-tool namespaced sections live at the bottom (body class hook: .tool-<name>).

   SVG cell states (.cell.active-entry / .cell.active-cell) live here safely:
   marching-bands' band rules use :where() (specificity 0,1,0) so these 0,2,0
   rules always win regardless of source order. */

body {
  background:   var(--theme-color-bg);
  color:        var(--theme-color-text);
  font-family:  var(--theme-font-body);
}

/* Masthead */
.puzzle-header {
  text-align:     center;
  border-bottom:  2px solid var(--theme-color-header-rule);
  padding-bottom: 12px;
  margin-bottom:  24px;
}
h1.title {
  font-family:     var(--theme-font-display);
  font-size:       2rem;
  letter-spacing:  var(--theme-title-tracking);
  text-transform:  var(--theme-title-transform);
  color:           var(--theme-color-title);
}
.byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
  font-size:  var(--theme-byline-size);
  margin-top: 6px;
}

#active-clue-bar {
  background:    var(--theme-color-bg);
  border-bottom: 1px solid var(--theme-color-bar-border);
}

#instructions {
  color:         var(--theme-color-instructions);
  font-size:     var(--theme-instructions-size);
  line-height:   1.5;
  margin-bottom: 20px;
}
#instructions p + p { margin-top: 0.6em; }

.clue-item { border-radius: var(--theme-clue-radius); }

.clue-section h2 {
  color:          var(--theme-color-text);
  border-bottom:  1px solid var(--theme-color-soft-border);
  padding-bottom: 4px;
}

/* Primary button */
#check-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.95rem;
  padding:        8px 22px;
  background:     var(--theme-color-btn-bg);
  color:          var(--theme-color-btn-text);
  border:         none;
  letter-spacing: var(--theme-button-tracking);
}
#check-btn:hover:not(:disabled) { background: var(--theme-color-btn-hover); }
#check-btn:disabled { background: var(--theme-color-btn-disabled); cursor: default; }

/* Clear button */
#clear-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.8rem;
  padding:        5px 12px;
  background:     transparent;
  color:          var(--theme-color-clear-fg);
  border-color:   var(--theme-color-clear-fg);
  letter-spacing: var(--theme-button-tracking);
}
#clear-btn:hover { color: var(--theme-color-clear-hover-fg); border-color: var(--theme-color-clear-hover-fg); }
#clear-btn.armed { color: var(--theme-color-danger);         border-color: var(--theme-color-danger); }

/* Puzzle toggle (direction / mode / loop) */
.puzzle-toggle { border: 1px solid var(--theme-color-btn2-border); }
.toggle-opt {
  font-family:    var(--theme-font-button);
  font-size:      0.9rem;
  font-weight:    bold;
  padding:        6px 16px;
  background:     var(--theme-color-btn2-bg);
  color:          var(--theme-color-muted);
  letter-spacing: 0.04em;
}
.toggle-opt:not(:last-child)   { border-right: 1px solid var(--theme-color-btn2-border); }
.toggle-opt.active             { background: var(--theme-color-btn-bg); color: var(--theme-color-btn-text); cursor: default; }
.toggle-opt:not(.active):hover { background: var(--theme-color-btn2-hover); }

/* SVG cell states */
.cell              { fill: var(--theme-color-cell-bg); stroke: var(--theme-color-cell-stroke); stroke-width: 0.5; }
.cell.active-entry { fill: var(--theme-color-highlight); }
.cell.active-cell  { fill: var(--theme-color-active); stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }
.cell.correct      { fill: var(--theme-color-correct-bg); stroke: var(--theme-color-correct-stroke); stroke-width: 0.5; }
.cell.correct.active-cell { stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }

.style-circle { fill: none; stroke: var(--theme-color-circle); stroke-width: 1; }

/* No font-size on .cell-letter or .cell-num: Spiral sizes these dynamically as SVG
   presentation attributes; a CSS font-size overrides them silently. Per-tool sizes
   live in the namespaced sections below. */
.cell-letter         { font-family: var(--theme-font-cell); fill: var(--theme-color-cell-text); }
.cell-letter.correct { fill: var(--theme-color-correct-text); }
.cell-num            { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }

/* Congrats modal (centered in the shared #congrats-overlay from base.css) */
#congrats-overlay { background: var(--theme-color-overlay); }

/* Keys button (fixed bottom-right corner, created by setupKeysOverlay) */
#keys-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#keys-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Keys modal (centered in the shared #keys-overlay from base.css) */
#keys-overlay { background: var(--theme-color-overlay); }
#keys-modal {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border:        2px solid var(--theme-color-soft-border);
  border-radius: var(--theme-card-radius);
  padding:       20px 24px;
  min-width:     220px;
}
#keys-modal-header {
  display:         flex;
  justify-content: space-between;
  align-items:     center;
  margin-bottom:   12px;
  font-weight:     bold;
  font-size:       1rem;
  letter-spacing:  0.03em;
}
#keys-close {
  background: transparent;
  border:     none;
  cursor:     pointer;
  font-size:  1.1rem;
  line-height: 1;
  padding:    0 0 0 12px;
  color:      var(--theme-color-text);
}
/* Suppress the ring for mouse/programmatic focus, but keep it for keyboard
   users — the close button is auto-focused when the modal opens. */
#keys-close:focus:not(:focus-visible) { outline: none; }
#keys-close:hover { opacity: 0.65; }
#keys-modal table { border-collapse: collapse; width: 100%; }
#keys-modal td    { padding: 3px 0; vertical-align: middle; }
#keys-modal td:first-child { padding-right: 14px; white-space: nowrap; }
kbd {
  display:       inline-block;
  background:    var(--theme-color-btn2-bg);
  border:        1px solid var(--theme-color-btn2-border);
  border-radius: 3px;
  padding:       1px 5px;
  font-family:   var(--theme-font-ui, monospace);
  font-size:     0.78rem;
  color:         var(--theme-color-text);
}

@keyframes congrats-pop {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}
#congrats {
  background:     var(--theme-color-congrats-bg);
  color:          var(--theme-color-congrats-text);
  border:         2px solid var(--theme-color-congrats-border);
  border-radius:  var(--theme-card-radius);
  padding:        28px 36px;
  font-size:      1.2rem;
  font-weight:    bold;
  text-align:     center;
  letter-spacing: 0.04em;
  animation:      congrats-pop 200ms ease-out;
}

#done-wrong {
  margin-top:     20px;
  padding:        16px 24px;
  border-radius:  var(--theme-card-radius);
  background:     var(--theme-color-wrong-bg);
  border:         2px solid var(--theme-color-wrong-border);
  color:          var(--theme-color-wrong-text);
  font-size:      1.05rem;
  font-weight:    bold;
  text-align:     center;
  letter-spacing: 0.04em;
}

/* ── Per-tool selectors (body class hook: .tool-<name>) ─────────────────────
   Each tool's <body> carries a class like .tool-snake-charmer so these rules
   scope to the right tool without a separate per-tool CSS file. */

/* Snake Charmer */
.tool-snake-charmer .cell-num    { font-size: 9px; }
.tool-snake-charmer .cell-letter { font-size: 14px; }
.tool-snake-charmer .cell.secondary-entry { fill: var(--theme-color-secondary-entry); }
.tool-snake-charmer .cell.active-cell.secondary-entry {
  fill:         var(--theme-color-secondary-active);
  stroke:       var(--theme-color-secondary-active-stroke);
  stroke-width: 1.5;
}
/* Hover first so active/secondary overrides it at equal or higher specificity. */
.tool-snake-charmer .clue-item { margin-bottom: 5px; font-size: 0.88rem; line-height: 1.4; padding: 2px 6px 2px 2px; }
.tool-snake-charmer .clue-item:hover           { background: var(--theme-color-clue-hover); }
.tool-snake-charmer .clue-item.active-clue     { background: var(--theme-color-active); }
.tool-snake-charmer .clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-snake-charmer .clue-item.correct .clue-text { color: var(--theme-color-correct-text); text-decoration: line-through; }

/* Marching Bands — band fills are unnamespaced to keep :where() specificity
   below .cell.active-entry (0,2,0); .band-even/.band-odd are MB-exclusive. */
.cell:where(.band-even) { fill: var(--theme-color-band-even); }
.cell:where(.band-odd)  { fill: var(--theme-color-cell-bg); }
.cell.band-even.active-entry { fill: var(--theme-color-highlight-band-even); }
.tool-marching-bands .cell-letter { font-size: 14px; }
.tool-marching-bands .band-label  { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }
.tool-marching-bands .row-label   { font-family: var(--theme-font-cell); color: var(--theme-color-text); }
.tool-marching-bands .cell-center { fill: var(--theme-color-cell-center); }
.tool-marching-bands .clue-group:hover          { background: var(--theme-color-clue-hover); }
.tool-marching-bands .clue-group.active-clue    { background: var(--theme-color-active); }
.tool-marching-bands .clue-group.secondary-entry { background: var(--theme-color-secondary-entry); }

/* Spiral — no .cell-letter font-size (see comment above). */
.tool-spiral .clue-item { padding: 2px 6px 2px 2px; }
.tool-spiral .clue-item:hover           { background: var(--theme-color-clue-hover); }
.tool-spiral .clue-item.active-clue     { background: var(--theme-color-active); }
.tool-spiral .clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-spiral .clue-item.correct .clue-text { color: var(--theme-color-correct-text); text-decoration: line-through; }
.tool-spiral #center-curl       { fill: none; stroke: var(--theme-color-curl); stroke-width: 1.4; stroke-linecap: round; }
.tool-spiral #direction-chevron { stroke: var(--theme-color-active-stroke); stroke-width: 0.9; opacity: 0.5; }
.tool-spiral .active-clue-dir {
  font-size:      0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color:          var(--theme-color-muted);
  opacity:        0.6;
  flex-shrink:    0;
}

/* Shared print resets — the final override layer for printing, applied to
   every tool and theme. Forces plain ink on white regardless of solve state
   or theme. Declarations are !important by design so this layer wins over any
   theme rule regardless of its selector specificity or source order — a tool
   theme that later adds a higher-specificity highlight rule can't silently
   defeat the print reset. A tool's print.css that needs to override a reset
   here must also use !important. */
@media print {
  /* Hide interaction chrome */
  #active-clue-bar,
  #controls,
  #congrats-overlay,
  #keys-overlay,
  #keys-btn,
  #done-wrong { display: none !important; }

  body { padding-top: 0 !important; }
  h1.title { font-size: 1.4rem !important; }

  /* Cell state → plain ink on white */
  .cell,
  .cell.active-entry,
  .cell.active-cell,
  .cell.correct { fill: #fff !important; stroke: #999 !important; stroke-width: 1 !important; }
  .cell-letter.correct { fill: #111 !important; }

  /* Clue highlight / strike-through reset */
  .clue-item.active-clue,
  .clue-item.secondary-entry { background: transparent !important; }
  .clue-item.correct .clue-text { color: inherit !important; text-decoration: none !important; }
}

/* Shared print resets live in shared/themes/print-base.css (concatenated just
   before this file). Only snake-charmer-specific print rules belong here. */
@media print {
  .puzzle-main { padding: 12px 16px; }
  .puzzle-header { margin-bottom: 12px; padding-bottom: 8px; }

  /* Stack ring above clues; scale grid to fit page */
  .puzzle-body  { display: block; }
  #ring-wrap    { break-inside: avoid; }
  #ring-container { min-width: 0; }
  #ring-svg     { width: auto; max-width: min(17cm, 100%); max-height: 21cm; margin: 0 auto; }

  /* Fit clues on one page */
  #clue-list { max-width: none; padding-top: 32px; }
  #instructions { font-size: 0.8rem; margin-bottom: 16px; }
  #clues {
    column-count: 2;
    column-width: 12em;
    column-gap: 1.5em;
  }
  .clue-item {
    break-inside: avoid;
    font-size: 0.8rem;
    margin-bottom: 3px;
    padding: 1px 4px 1px 0;
  }
}

@media print and (orientation: landscape) {
  #ring-svg { max-width: min(23cm, 100%); max-height: 15cm; }
}

  </style>
</head>
<body class="tool-snake-charmer">
  <div id="active-clue-bar">
    <div class="active-clue-row" id="active-clue-primary">
      <span class="active-clue-num"></span>
      <span class="active-clue-text"></span>
    </div>
    <div class="active-clue-row" id="active-clue-secondary">
      <span class="active-clue-num"></span>
      <span class="active-clue-text"></span>
    </div>
  </div>
  <div class="puzzle-main">
    <div class="puzzle-header">
      <h1 class="title">Snake Charmer</h1>
      <p class="byline"></p>
    </div>
    <div class="puzzle-body">
      <div id="ring-wrap">
        <div id="controls">

    } else if (i < S9) {
      const j = i - S8;
      return { lx: cx_R - L + j * W_CELL + 6, ly: cy_bot - rArmOuter + 8 };
    } else if (i < S10) {
      const j = i - S9;
      const step = Math.PI / nBodyInner;
      const la = Math.PI / 2 - j * step - 0.2 * step;
      return { lx: cx_R + (R_in + H_CELL / 2 - 8) * Math.cos(la),
               ly: cy_R + (R_in + H_CELL / 2 - 8) * Math.sin(la) };
    } else if (i < S11) {
      const j = i - S10;
      return { lx: cx_R - j * W_CELL - 6, ly: cy + rArmOuter - 8 };
    } else {
      const j = i - S11;
      const step = Math.PI / nBodyOuter;
      const la = Math.PI / 2 + j * step + 0.2 * step;
      return { lx: cx_L + (R_out + H_CELL / 2 - 8) * Math.cos(la),
               ly: cy_L + (R_out + H_CELL / 2 - 8) * Math.sin(la) };
    }
  }

  return { cellPath, letterCenter, labelPos };
}

if (typeof module !== 'undefined') module.exports = { getDoubleTurnRenderer };

'use strict';

// Shared modules injected by builder.js in the browser; loaded conditionally for Node tests.
if (typeof isCellCorrect === 'undefined' && typeof require !== 'undefined')
  var isCellCorrect = require('../../../shared/isCellCorrect');

// ── Pure helpers (exported for Node tests) ────────────────────────────────────

// Derive the cell→entry mapping from entry lengths alone (sequential positional
// assignment). entryAtCell[ringPos][loop] = entry index occupying that cell, or -1.
// ringPosByEntry[ei] = ring positions for entry ei, in posInEntry order.
// canonicalStart[ei] = { ringPos, loop } of that entry's first cell (posInEntry 0).
function buildEntryMaps(entries, loops) {
  const ringSize = entries.reduce((s, e) => s + e.length, 0) / loops;
  const entryAtCell = Array.from({ length: ringSize }, () => new Array(loops).fill(-1));
  const ringPosByEntry = entries.map(() => []);
  const canonicalStart = [];
  let concatPos = 0;
  for (let ei = 0; ei < entries.length; ei++) {
    for (let pip = 0; pip < entries[ei].length; pip++) {
      const ringPos = concatPos % ringSize;
      const loop = Math.floor(concatPos / ringSize);
      entryAtCell[ringPos][loop] = ei;
      ringPosByEntry[ei].push(ringPos);
      if (pip === 0) canonicalStart[ei] = { ringPos, loop };
      concatPos++;
    }
  }
  return { entryAtCell, ringPosByEntry, canonicalStart };
}

function nextRingPos(pos, total) {
  return (pos + 1) % total;
}

function prevRingPos(pos, total) {
  return (pos - 1 + total) % total;
}

// ── DOM engine (browser only) ─────────────────────────────────────────────────
(function () {
  if (typeof document === 'undefined') return;

  function getShapeRenderer(shape) {
    if (shape === 'turn')        return getTurnRenderer;
    if (shape === 'double-turn') return getDoubleTurnRenderer;
    return getStadiumRenderer;
  }

  function init() {
    // ── Data & constants ──────────────────────────────────────────────────────
    const data = window.PUZZLE_DATA;
    const { svgWidth, svgHeight } = data.ring;
    const ringSize = data.ring.N;

    // ── Geometry & index maps ─────────────────────────────────────────────────
    const { cellPath, letterCenter, labelPos } = getShapeRenderer(data.shape)(data.ring);
    const { entryAtCell, ringPosByEntry, canonicalStart } = buildEntryMaps(data.entries, data.loops);

    // Entry indices that start (posInEntry 0) at each ring position, for number labels
    const entriesStartingAt = Array.from({ length: ringSize }, () => []);
    canonicalStart.forEach((start, ei) => entriesStartingAt[start.ringPos].push(ei));

    // ── State ─────────────────────────────────────────────────────────────────
    let activeRingPos = 0;
    let activeLoop = 0;
    let congratsDismissed = false;

    // ── Logic functions ───────────────────────────────────────────────────────
    const letterState = new Array(ringSize).fill('');

    function setCellLetter(ringPos, letter) {
      letterState[ringPos] = letter;
      letterTexts[ringPos].textContent = letter;
      cellPaths[ringPos].classList.remove('correct');
      letterTexts[ringPos].classList.remove('correct');
    }

    function focusCell(ringPos, loop) {
      activeRingPos = ringPos;
      activeLoop = loop;
      const activeEntryIdx = entryAtCell[ringPos][loop];
      const activeEntryPositions = new Set(
        activeEntryIdx >= 0 ? ringPosByEntry[activeEntryIdx] : []
      );

      const otherLoop = (loop + 1) % data.loops;
      const secondaryEntryIdx = entryAtCell[ringPos][otherLoop];
      const secondaryPositions = new Set(
        secondaryEntryIdx >= 0 && secondaryEntryIdx !== activeEntryIdx
          ? ringPosByEntry[secondaryEntryIdx]
          : []
      );

      cellPaths.forEach((p, rp) => {
        const isActive = activeEntryPositions.has(rp);
        const isSecondary = !isActive && secondaryPositions.has(rp);
        p.classList.toggle('active-entry', isActive);
        p.classList.toggle('secondary-entry', isSecondary);
        p.classList.toggle('active-cell', rp === ringPos);
      });
      // Repaint active cell last within its layer so its border isn't covered by a neighbour's fill.
      cellsLayer.appendChild(cellPaths[ringPos]);

      Array.from(cluesList.children).forEach((li, i) => {
        li.classList.toggle('active-clue', i === activeEntryIdx);
        li.classList.toggle('secondary-entry', i === secondaryEntryIdx && i !== activeEntryIdx);
      });

      barPrimaryNum.textContent    = `${activeEntryIdx + 1}.`;
      barPrimaryText.textContent   = data.entries[activeEntryIdx].clue;
      barSecondaryNum.textContent  = `${secondaryEntryIdx + 1}.`;
      barSecondaryText.textContent = data.entries[secondaryEntryIdx].clue;

      hiddenInput.focus({ preventScroll: true });
      syncUI();
    }

    function advanceCell(ringPos) {
      const nextPos = nextRingPos(ringPos, ringSize);
      const nextLoop = nextPos === 0 && ringPos === ringSize - 1
        ? (activeLoop + 1) % data.loops : activeLoop;
      focusCell(nextPos, nextLoop);
    }

    function retreatCell(ringPos) {
      const prevPos = prevRingPos(ringPos, ringSize);
      const prevLoop = prevPos === ringSize - 1 && ringPos === 0
        ? (activeLoop - 1 + data.loops) % data.loops : activeLoop;
      focusCell(prevPos, prevLoop);
    }

    function checkAllCellsIfFilled() {
      if (!letterState.every(l => l !== '')) return;
      if (!letterState.every((l, rp) => isCellCorrect(l, data.letters[rp]))) { syncUI(); return; }
      letterState.forEach((_, rp) => {
        cellPaths[rp].classList.add('correct');
        letterTexts[rp].classList.add('correct');
      });
      syncUI();
    }

    function checkBoardIfFilled() {
      if (!letterState.every(l => l !== '')) return;
      if (sha256hex(getSolution()) !== data.boardHash) { syncUI(); return; }
      letterState.forEach((_, rp) => {
        cellPaths[rp].classList.add('correct');
        letterTexts[rp].classList.add('correct');
      });
      data.entries.forEach((_, ei) => cluesList.children[ei].classList.add('correct'));
      syncUI();
    }

    function getSolution() {
      return letterState.join('').toLowerCase();
    }

    function isSolved() {
      return cellPaths.every(p => p.classList.contains('correct'));
    }

    function syncUI() {
      // Loop toggle active segment (loopBtns is built in Event wiring; syncUI first runs in Restore & focus).
      loopBtns.forEach((btn, i) => btn.classList.toggle('active', i === activeLoop));

      const allFilled = letterState.every(l => l !== '');
      const everyCellCorrect = isSolved();

      if (!congratsDismissed) congratsOverlay.hidden = !everyCellCorrect;
      doneWrong.hidden = !(allFilled && !everyCellCorrect);

      if (!data.hashed) {
        checkBtn.disabled = !letterState[activeRingPos] ||
          cellPaths[activeRingPos].classList.contains('correct');
      }
      latch.check(everyCellCorrect);
    }

    const { saveState, restoreState, clearState } = setupStorage(storageKey('sc', data), {
      cellCount: ringSize,
      getState() {
        const correct = [];
        cellPaths.forEach((p, i) => { if (p.classList.contains('correct')) correct.push(i); });
        return { letters: letterState, correct, activeMs: timer.getElapsedMs() };
      },
      applyState(saved) {
        saved.letters.forEach((letter, i) => {
          if (!letter) return;
          letterState[i] = letter;
          letterTexts[i].textContent = letter;
        });
        saved.correct.forEach(i => {
          cellPaths[i].classList.add('correct');
          letterTexts[i].classList.add('correct');
        });
        timer.restoreMs(saved.activeMs);
      },
    });

    const timer = setupTimer({ onPause: () => saveState() });
    const puzzleRoot = document.querySelector('.puzzle-main');
    const latch = makeCompletionLatch({
      puzzleRoot,
      kind:         data.kind,
      title:        data.title,
      date:         data.date,
      getBoardHash: () => data.boardHash,
      getSolution,
      getElapsedMs: () => timer.getElapsedMs(),
    });

    // ── Build SVG ─────────────────────────────────────────────────────────────
    document.querySelector('.puzzle-main').classList.add(`layout-${data.shape}`);

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('ring-svg');
    svg.setAttribute('width', svgWidth);
    svg.setAttribute('height', svgHeight);
    svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);

    const cellPaths = [];
    const letterTexts = [];

    // Five explicit layers: cells < circles < flash < letters < labels.
    // flashLayer holds wrong-guess flash overlays (see flashWrong) above the cells.
    const cellsLayer   = document.createElementNS(SVG_NS, 'g');
    const circlesLayer = document.createElementNS(SVG_NS, 'g');
    const flashLayer   = document.createElementNS(SVG_NS, 'g');
    const lettersLayer = document.createElementNS(SVG_NS, 'g');
    const labelsLayer  = document.createElementNS(SVG_NS, 'g');
    svg.append(cellsLayer, circlesLayer, flashLayer, lettersLayer, labelsLayer);

    for (let i = 0; i < ringSize; i++) {
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('class', 'cell');
      path.setAttribute('id', `cell-${i}`);
      path.setAttribute('data-pos', i);
      path.setAttribute('d', cellPath(i));
      path.addEventListener('click', () => {
        const alreadyActive = i === activeRingPos && document.activeElement === hiddenInput;
        focusCell(i, alreadyActive ? (activeLoop + 1) % data.loops : activeLoop);
      });
      cellsLayer.appendChild(path);
      cellPaths.push(path);
    }

    data.entries.forEach((entry, ei) => {
      if (!entry.styles || !Array.isArray(entry.styles.circle)) return;
      entry.styles.circle.forEach(posInEntry => {
        const ringPos = ringPosByEntry[ei][posInEntry];
        if (ringPos === undefined) return;
        const { tx, ty } = letterCenter(ringPos);
        const circ = document.createElementNS(SVG_NS, 'circle');
        circ.setAttribute('class', 'style-circle');
        circ.setAttribute('cx', tx);
        circ.setAttribute('cy', ty);
        circ.setAttribute('r', 17);
        circlesLayer.appendChild(circ);
      });
    });

    for (let i = 0; i < ringSize; i++) {
      const { tx, ty } = letterCenter(i);
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('class', 'cell-letter');
      text.setAttribute('id', `letter-${i}`);
      text.setAttribute('data-pos', i);
      text.setAttribute('x', tx);
      text.setAttribute('y', ty);
      lettersLayer.appendChild(text);
      letterTexts.push(text);
    }

    entriesStartingAt.forEach((startEntries, i) => {
      if (startEntries.length === 0) return;
      const { lx, ly } = labelPos(i);
      const numText = document.createElementNS(SVG_NS, 'text');
      numText.setAttribute('class', 'cell-num');
      numText.setAttribute('x', lx);
      numText.setAttribute('y', ly);
      numText.textContent = startEntries.map(ei => ei + 1).join('/');
      labelsLayer.appendChild(numText);
    });

    const barPrimaryNum    = document.querySelector('#active-clue-primary .active-clue-num');
    const barPrimaryText   = document.querySelector('#active-clue-primary .active-clue-text');
    const barSecondaryNum  = document.querySelector('#active-clue-secondary .active-clue-num');
    const barSecondaryText = document.querySelector('#active-clue-secondary .active-clue-text');

    // ── Header & clues ────────────────────────────────────────────────────────
    renderByline(data);
    renderInstructions(data);

    // Render clue list
    const cluesList = document.getElementById('clues');
    data.entries.forEach((entry, i) => {
      const li = document.createElement('li');
      li.className = 'clue-item';
      li.dataset.entry = i;
      const textSpan = document.createElement('span');
      textSpan.className = 'clue-text';
      textSpan.textContent = entry.clue;
      li.appendChild(textSpan);
      cluesList.appendChild(li);
    });

    // ── Event wiring ──────────────────────────────────────────────────────────
    const hiddenInput = document.getElementById('hidden-input');

    const checkBtn = document.getElementById('check-btn');
    if (data.hashed) checkBtn.hidden = true;

    const congratsOverlay = document.getElementById('congrats-overlay');
    const doneWrong = document.getElementById('done-wrong');
    const keysOverlay = setupKeysOverlay(
      [
        ['Tab',       'Next entry'],
        ['Shift+Tab', 'Previous entry'],
        ['← →',       'Move along ring'],
        ['⌫',         'Clear current cell'],
        ['Space',     'Clear and advance'],
        ['.',         'Toggle direction'],
      ],
      () => hiddenInput.focus({ preventScroll: true })
    );

    const loopBtns = (() => {
      const toggle = document.getElementById('loop-toggle');
      const cumPos = [0];
      for (const e of data.entries) cumPos.push(cumPos[cumPos.length - 1] + e.length);
      return Array.from({ length: data.loops }, (_, l) => {
        const loopStart = l * ringSize;
        const loopEnd = (l + 1) * ringSize;
        let first = -1, last = -1;
        for (let i = 0; i < data.entries.length; i++) {
          if (cumPos[i] < loopEnd && cumPos[i + 1] > loopStart) {
            if (first === -1) first = i + 1;
            last = i + 1;
          }
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toggle-opt' + (l === 0 ? ' active' : '');
        btn.textContent = `Clues ${first}–${last}`;
        btn.addEventListener('click', () => focusCell(activeRingPos, l));
        toggle.appendChild(btn);
        return btn;
      });
    })();

    setupKeydown(e => {
      const ringPos = activeRingPos;
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (letterState[ringPos]) {
          setCellLetter(ringPos, '');
          syncUI();
        } else {
          const prevPos = prevRingPos(ringPos, ringSize);
          const prevLoop = prevPos === ringSize - 1 && ringPos === 0
            ? (activeLoop - 1 + data.loops) % data.loops : activeLoop;
          setCellLetter(prevPos, '');
          focusCell(prevPos, prevLoop);
        }
        saveState();
      } else if (e.key === ' ') {
        e.preventDefault();
        setCellLetter(ringPos, '');
        saveState();
        advanceCell(ringPos);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        advanceCell(ringPos);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        retreatCell(ringPos);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const activeEntryIdx = entryAtCell[activeRingPos][activeLoop];
        const nextEntryIdx = e.shiftKey
          ? (activeEntryIdx - 1 + data.entries.length) % data.entries.length
          : (activeEntryIdx + 1) % data.entries.length;
        const { ringPos: targetRingPos, loop: targetLoop } = canonicalStart[nextEntryIdx];
        focusCell(targetRingPos, targetLoop);
      } else if (e.key === '.') {
        e.preventDefault();
        focusCell(activeRingPos, (activeLoop + 1) % data.loops);
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
                 e.key === 'PageUp'  || e.key === 'PageDown') {
        e.preventDefault();
        scrollByKey(e.key);
      }
    }, { keysOverlay });

    hiddenInput.addEventListener('input', () => {
      const ringPos = activeRingPos;
      const letter = normalize(hiddenInput.value).slice(-1).toUpperCase();
      hiddenInput.value = '';
      if (!letter) return;
      timer.onFirstInput();
      setCellLetter(ringPos, letter);
      // Advance before the hash check — awaiting the check first causes keystroke lag.
      advanceCell(ringPos);

      if (data.hashed) {
        checkBoardIfFilled();
      } else {
        checkAllCellsIfFilled();
      }
      saveState();
    });

    // Clue click → jump to canonical start of that entry
    Array.from(cluesList.children).forEach((li, i) => {
      li.addEventListener('click', () => {
        const { ringPos, loop } = canonicalStart[i];
        focusCell(ringPos, loop);
      });
    });

    // Check Cell (non-hashed mode only)
    // hiddenInput.focus() is required: buttons that don't call focusCell() must restore
    // focus manually, otherwise the BUTTON guard in the document keydown listener blocks navigation.
    if (!data.hashed) {
      checkBtn.addEventListener('click', () => {
        if (isCellCorrect(letterState[activeRingPos], data.letters[activeRingPos])) {
          cellPaths[activeRingPos].classList.add('correct');
          letterTexts[activeRingPos].classList.add('correct');
        } else {
          flashWrong(cellPaths[activeRingPos], flashLayer);
        }
        syncUI();
        saveState();
        hiddenInput.focus({ preventScroll: true });
      });
    }

    function resetBoard() {
      letterState.fill('');
      for (let rp = 0; rp < ringSize; rp++) {
        letterTexts[rp].textContent = '';
        cellPaths[rp].classList.remove('correct');
        letterTexts[rp].classList.remove('correct');
      }
      Array.from(cluesList.children).forEach(li => li.classList.remove('correct'));
      while (flashLayer.firstChild) flashLayer.removeChild(flashLayer.firstChild);
      congratsDismissed = false;
      clearState();
      timer.reset();
      latch.reset();
      focusCell(0, 0);
    }

    setupClearButton(
      document.getElementById('clear-btn'),
      resetBoard,
      () => hiddenInput.focus({ preventScroll: true })
    );

    setupCongratsOverlay(congratsOverlay, () => {
      congratsDismissed = true;
      hiddenInput.focus({ preventScroll: true });
    });

    // ── Restore & focus ─────────────────────────────────────────────────────────
    restoreState();
    latch.sealIfSolved(isSolved());
    focusCell(0, 0);
  }

  document.addEventListener('DOMContentLoaded', init);
})();

if (typeof module !== 'undefined') {
  module.exports = { buildEntryMaps, nextRingPos, prevRingPos };
}

  </script>
