<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marching Bands</title>
  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* An ID or class rule that sets `display` on a [hidden] element (e.g. #menu-panel's
   `display: flex` below) otherwise outranks the UA [hidden] default by specificity,
   leaving the element stuck visible. */
[hidden] { display: none !important; }

body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.4; }

/* Tools with a fixed active-clue bar reserve its height as body padding, and
   expose it as --active-clue-bar-space for anything positioned against the
   bar (#menu-btn/#menu-panel in theme-components.css, Crushword's sticky
   grid). The bar's min-height fills that space even when its content is
   shorter (e.g. Crushword hiding its secondary row), so there's no unpainted
   strip for scrolled content to show through — and, since its clue text can
   never wrap (forced nowrap + ellipsis, base.css below), this is also an
   exact ceiling, not just a floor: the bar's rendered height is always
   precisely this value, never more, which is what makes calc()-only
   positioning against it exact rather than approximate. */
body.tool-snake-charmer,
body.tool-spiral,
body.tool-crushword {
  padding-top: 56px;
  --active-clue-bar-space: 56px;
}

#active-clue-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  min-height: var(--active-clue-bar-space);
  padding: 5px 16px 4px;
}

.active-clue-row {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-size: 0.875rem;
  line-height: 1.4;
}

#active-clue-secondary {
  font-size: 0.8rem;
  opacity: 0.6;
}

.active-clue-num {
  font-weight: bold;
  flex-shrink: 0;
}

.active-clue-text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#instructions {
  max-width: 600px;
  margin: 0 auto;
}

.clue-item {
  font-size: 0.875rem;
  padding: 2px 6px;
  border-radius: 2px;
}

.cell        { cursor: pointer; }
.cell-letter { pointer-events: none; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
.cell-num    { pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
.style-circle { pointer-events: none; }

#controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

button {
  cursor: pointer;
  border-radius: 4px;
  border: 1px solid;
  padding: 6px 14px;
  font-size: 0.875rem;
}

/* Suppress double-tap-to-zoom and its tap delay on the in-solve controls, which are
   tapped repeatedly (#rebus-btn especially) so the delay is felt. Scoped to #controls
   rather than every button: the modal and dialog buttons are tapped once and have no
   reason to change hit-testing behavior. */
#controls button { touch-action: manipulation; }

button:disabled { opacity: 0.4; cursor: default; }

/* Reserve the width of the widest label each button can show, so swapping the label
   never reflows its container — #menu-panel for #clear-btn (shrink-to-fit width,
   sized off this reservation, not the panel's own min-width), #controls for
   #rebus-btn. #clear-btn swaps Clear Puzzle→Are you sure?, #rebus-btn Rebus→Done;
   each reserves its longer string — measured, not eyeballed: 'Are you sure?' is
   wider than 'Clear Puzzle' despite having fewer wide characters. */
#clear-btn::after,
#rebus-btn::after {
  display: block;
  height: 0;
  overflow: hidden;
  visibility: hidden;
}
#clear-btn::after { content: 'Are you sure?'; }
#rebus-btn::after { content: 'Rebus'; }

#hidden-input {
  position: fixed;
  left: -9999px;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.puzzle-toggle { display: flex; border-radius: 4px; overflow: hidden; }
.puzzle-toggle .toggle-opt { border-radius: 0; border: none; flex: 1; white-space: nowrap; }
.toggle-opt { user-select: none; cursor: pointer; }

#keys-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  z-index: 50;
  cursor: pointer;
  font-size: 1rem;
  font-weight: bold;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Fixed top-right corner, mirroring #keys-btn's bottom-right circle. Snake
   Charmer/Spiral override `top` (theme-components.css) to sit the button
   below #active-clue-bar instead of at this default offset — see that
   override for why. */
#menu-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  z-index: 110;
  cursor: pointer;
  font-size: 1rem;
  font-weight: bold;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  /* The ☰ glyph's ink sits noticeably below its own line box (most of a
     typeface's descent is unused whitespace for this character, but not all
     of it) — flex-centering the line box therefore visually centers the
     glyph about 1px low. This asymmetric padding nudges the centered line
     box up by half the difference to compensate; pinned by an e2e pixel
     measurement, not eyeballed, since the misalignment itself is only ~1px. */
  padding-bottom: 8px;
}

/* Non-modal dropdown — plain div, not <dialog>, so the page behind it stays
   interactive. The [hidden] reset above (!important) wins over this display:flex
   while the panel is closed. */
#menu-panel {
  position: fixed;
  top: 60px;
  right: 20px;
  z-index: 110;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  min-width: 120px;
}

/* Matches #clear-btn's padding/font-size/border-radius (theme-components.css)
   so both menu-panel rows read as plain, equally-weighted menu items — a flat
   hoverable strip, not a bordered "submit button" next to a bare checkbox. */
#check-btn-toggle-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
  padding: 6px 8px;
  border-radius: 4px;
}
#check-btn-toggle { cursor: pointer; }

/* Native <dialog>: raised to the top layer by showModal() and dimmed via
   ::backdrop — no positioning or z-index needed. The dialog is a transparent
   frame; #keys-modal (inside it) is the visible card. `margin: auto` restores the
   UA modal centering that the global `* { margin: 0 }` reset above would otherwise
   defeat (the UA `dialog:modal { inset: 0 }` is still in effect). */
#keys-overlay {
  margin: auto;
  padding: 0;
  border: none;
  background: transparent;
  max-width: 100vw;
  max-height: 100vh;
}

/* Native <dialog> congrats modal — same transparent-frame pattern as #keys-overlay. */
#congrats-dialog {
  margin: auto;
  padding: 0;
  border: none;
  background: transparent;
  max-width: 100vw;
  max-height: 100vh;
}

@keyframes flash-wrong {
  0%   { opacity: 1; }
  20%  { opacity: 1; }
  100% { opacity: 0; }
}
.flash-wrong-overlay {
  fill: #ef9a9a;
  pointer-events: none;
  animation: flash-wrong 600ms ease-out forwards;
}

.puzzle-header { margin-bottom: 16px; }
h1.title { font-size: 1.5rem; font-weight: bold; line-height: 1; }
.byline  { font-size: 0.875rem; margin-top: 4px; }

.puzzle-main { max-width: 1300px; margin: 0 auto; padding: 20px 16px; }

.puzzle-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) min-content minmax(0, 1fr);
  grid-template-areas: "left center right";
  gap: 0 24px;
  align-items: start;
}

.puzzle-center        { grid-area: center; display: flex; flex-direction: column; align-items: center; gap: 12px; position: sticky; top: 16px; align-self: start; }
.clue-section-rows    { grid-area: left; }
.clue-section-bands   { grid-area: right; }

#grid-wrap {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
}

#row-labels {
  display: flex;
  flex-direction: column;
  margin-right: 4px;
  user-select: none;
}

.row-label {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  font-size: 0.75rem;
  font-weight: bold;
  padding-right: 4px;
  height: 34px;
  line-height: 1;
}

#puzzle-svg { display: block; overflow: visible; }

.cell-letter { font-weight: bold; dominant-baseline: central; }


.clue-section h2 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-bottom: 4px;
  margin-bottom: 6px;
}

.clue-section ul { list-style: none; }

.clue-group {
  border-radius: 2px;
  cursor: pointer;
}

.clue-item {
  display: flex;
  align-items: baseline;
}

.clue-label {
  font-size: 0.7rem;
  font-weight: bold;
  letter-spacing: 0.04em;
  margin-right: 4px;
  flex-shrink: 0;
  display: flex;
  align-items: baseline;
}

.clue-parent {
  display: inline-block;
  min-width: 1.4em;
  text-align: right;
  margin-right: 0.2em;
  text-transform: uppercase;
}

@media (max-width: 880px) {
  .puzzle-body { display: block; }
  .puzzle-center { align-items: stretch; }
  #grid-wrap { justify-content: center; }
}

/* theme-base: neutral defaults — every --theme-* var a theme can override.
   A theme's <name>-tokens.css need only override what differs from these. */
:root {
  /* Fonts */
  --theme-font-body:    system-ui, -apple-system, sans-serif;
  --theme-font-display: var(--theme-font-body);
  --theme-font-button:  var(--theme-font-body);
  --theme-font-cell:    var(--theme-font-body);

  /* Masthead / title / byline */
  --theme-color-header-rule: #cccccc;
  --theme-title-tracking:    normal;
  --theme-title-transform:   none;
  --theme-color-title:       var(--theme-color-text);
  --theme-byline-style:      normal;
  --theme-byline-size:       0.875rem;

  /* Page */
  --theme-color-bg:    #ffffff;
  --theme-color-text:  #111111;
  --theme-color-muted: #555555;

  /* Bars / borders */
  --theme-color-bar-border:  #cccccc;
  --theme-color-soft-border: #cccccc;

  /* Primary button */
  --theme-color-btn-bg:       #333333;
  --theme-color-btn-text:     #ffffff;
  --theme-color-btn-hover:    #555555;
  --theme-color-btn-disabled: #999999;
  --theme-button-tracking:    0.05em;

  /* Secondary / toggle button colors */
  --theme-color-btn2-bg:     #eeeeee;
  --theme-color-btn2-border: #aaaaaa;
  --theme-color-btn2-hover:  #e0e0e0;

  /* Clear button */
  --theme-color-clear-fg:       #999999;
  --theme-color-clear-hover-fg: #333333;

  /* Grid cells */
  --theme-color-cell-bg:     #ffffff;
  --theme-color-cell-stroke: #999999;
  --theme-color-cell-text:   #111111;

  /* Cell / clue states */
  --theme-color-highlight:            #deeeff;
  --theme-color-band-even:            var(--theme-color-cell-bg);
  --theme-color-highlight-band-even:  var(--theme-color-highlight);
  --theme-color-active:               #b8d4f5;
  --theme-color-active-stroke:        #1e5799;
  --theme-color-clue-hover:           #eeeeee;
  --theme-color-secondary-entry:      #f0f0f0;
  --theme-clue-radius:                2px;

  /* Snake-charmer-specific secondary-active cell */
  --theme-color-secondary-active:        #7aaed8;
  --theme-color-secondary-active-stroke: #3a72a8;

  /* Correct */
  --theme-color-correct-bg:     #c8e6c9;
  --theme-color-correct-stroke: #4caf50;
  --theme-color-correct-text:   #1a6e22;

  /* Decorations */
  --theme-color-circle:      #cccccc;
  --theme-color-curl:        #aaaaaa;
  --theme-color-cell-center: #222222;

  /* Instructions */
  --theme-color-instructions: var(--theme-color-muted);
  --theme-instructions-size:  0.85rem;

  /* Congrats / overlay */
  --theme-color-overlay:         rgba(0, 0, 0, 0.45);
  --theme-color-congrats-bg:     #2e7d32;
  --theme-color-congrats-border: #1b5e20;
  --theme-color-congrats-text:   #ffffff;
  --theme-card-radius:           10px;

  /* Done-wrong */
  --theme-color-wrong-bg:     #fff3e0;
  --theme-color-wrong-border: #e65100;
  --theme-color-wrong-text:   var(--theme-color-text);

  /* Danger */
  --theme-color-danger: #b91c1c;
}

/* Broadsheet theme — newspaper palette. Overrides theme-base defaults. */
:root {
  --theme-font-body:    Georgia, 'Times New Roman', serif;
  --theme-font-display: Georgia, 'Times New Roman', serif;
  --theme-font-button:  Georgia, 'Times New Roman', serif;
  --theme-font-cell:    Georgia, 'Times New Roman', serif;

  --theme-color-header-rule: #222222;
  --theme-title-tracking:    0.08em;
  --theme-title-transform:   uppercase;
  --theme-byline-style:      italic;

  --theme-color-bg:    #f9f7f1;

  --theme-color-bar-border:  #bbbbbb;
  --theme-color-soft-border: #bbbbbb;

  --theme-color-btn-bg:    #222222;
  --theme-color-btn-hover: #444444;

  --theme-color-btn2-bg:    #f0ece0;
  --theme-color-btn2-hover: #e4e0d4;

  --theme-color-band-even:           #e8e8e8;
  --theme-color-highlight-band-even: #cee2f8;
  --theme-color-clue-hover:          #ede8d2;
  --theme-color-secondary-entry:     #f5f0e0;

  --theme-color-circle: #bbbbbb;
}

/* theme-components: every tool-agnostic selector, driven entirely by --theme-*.
   Per-tool namespaced sections live at the bottom (body class hook: .tool-<name>).

   SVG cell states (.cell.active-entry / .cell.active-cell) live here safely:
   marching-bands' band rules use :where() (specificity 0,1,0) so these 0,2,0
   rules always win regardless of source order. */

body {
  background:   var(--theme-color-bg);
  color:        var(--theme-color-text);
  font-family:  var(--theme-font-body);
}

/* Masthead */
.puzzle-header {
  text-align:     center;
  border-bottom:  2px solid var(--theme-color-header-rule);
  padding-bottom: 12px;
  margin-bottom:  24px;
}
h1.title {
  font-family:     var(--theme-font-display);
  font-size:       2rem;
  letter-spacing:  var(--theme-title-tracking);
  text-transform:  var(--theme-title-transform);
  color:           var(--theme-color-title);
}
.byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
  font-size:  var(--theme-byline-size);
  margin-top: 6px;
}

#active-clue-bar {
  background:    var(--theme-color-bg);
  border-bottom: 1px solid var(--theme-color-bar-border);
}

/* #menu-btn sits *within* #active-clue-bar's own band instead of floating
   below it as a separate row — costs no extra vertical space, which matters
   most on mobile where the on-screen keyboard already eats much of it. Pure
   CSS calc() against #active-clue-bar's min-height (base.css), not
   JS-measured: an earlier version computed this via getBoundingClientRect()
   on every syncUI() and could snapshot a stale value mid mobile-keyboard
   viewport animation, leaving the button off-screen with nothing to
   re-correct it. 32px is the button's own height (base.css); Marching
   Bands, with no bar, keeps the plain `top: 20px` default. */
.tool-snake-charmer #menu-btn,
.tool-spiral        #menu-btn,
.tool-crushword     #menu-btn { top: calc((var(--active-clue-bar-space) - 32px) / 2); }

/* #menu-panel opens directly below the bar's bottom edge (8px gap, matching
   Marching Bands' static button-to-panel gap from base.css) — same
   CSS-not-JS reasoning as #menu-btn above. */
.tool-snake-charmer #menu-panel,
.tool-spiral        #menu-panel,
.tool-crushword     #menu-panel { top: calc(var(--active-clue-bar-space) + 8px); }

/* Right gutter for the bar's own text now that #menu-btn shares its row.
   Lives here rather than in base.css's shared #active-clue-bar rule since
   only these three tools ever place the button there. */
.tool-snake-charmer #active-clue-bar,
.tool-spiral        #active-clue-bar,
.tool-crushword     #active-clue-bar { padding-right: 60px; }

/* Direction label ("Across"/"Down", "In"/"Out") before the bar's clue number. */
.active-clue-dir {
  font-size:      0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color:          var(--theme-color-muted);
  opacity:        0.6;
  flex-shrink:    0;
}

#instructions {
  color:         var(--theme-color-instructions);
  font-size:     var(--theme-instructions-size);
  line-height:   1.5;
  margin-bottom: 20px;
}
#instructions p + p { margin-top: 0.6em; }

.clue-item { border-radius: var(--theme-clue-radius); }

.clue-section h2 {
  color:          var(--theme-color-text);
  border-bottom:  1px solid var(--theme-color-soft-border);
  padding-bottom: 4px;
}

/* Primary button */
#check-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.95rem;
  padding:        8px 22px;
  background:     var(--theme-color-btn-bg);
  color:          var(--theme-color-btn-text);
  border:         none;
  letter-spacing: var(--theme-button-tracking);
}
#check-btn:hover:not(:disabled) { background: var(--theme-color-btn-hover); }
#check-btn:disabled { background: var(--theme-color-btn-disabled); cursor: default; }

/* Clear button — flat, borderless, left-aligned, matching #check-btn-toggle-label
   (base.css): both are plain menu-panel rows now, not a bordered pill next to a
   bare checkbox. Colour cues (armed, hover) carry entirely through text colour
   and the shared row-hover background instead of a border. */
#clear-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.8rem;
  padding:        6px 8px;
  background:     transparent;
  border:         none;
  text-align:     left;
  color:          var(--theme-color-clear-fg);
  letter-spacing: var(--theme-button-tracking);
}
#clear-btn:hover              { color: var(--theme-color-clear-hover-fg); }
#clear-btn.armed              { color: var(--theme-color-danger); }
#clear-btn:hover,
#check-btn-toggle-label:hover { background: var(--theme-color-clue-hover); }

/* Rebus button — the pointer route into multi-letter entry, mirroring the Enter key.
   Deliberately has no disabled or per-cell state: it looks identical on every square,
   in every build, which is what keeps it from signalling which cells are rebus.
   Composition-in-progress is shown on the cell itself (.cell.active-cell.composing
   below), so the button carries only its label — whose width is reserved in
   shared/base.css so the Rebus→Done swap does not reflow #controls. */
#rebus-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.8rem;
  padding:        5px 12px;
  background:     transparent;
  color:          var(--theme-color-muted);
  border-color:   var(--theme-color-btn2-border);
  letter-spacing: var(--theme-button-tracking);
}
#rebus-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Puzzle toggle (direction / mode / loop) */
.puzzle-toggle { border: 1px solid var(--theme-color-btn2-border); }
.toggle-opt {
  font-family:    var(--theme-font-button);
  font-size:      0.9rem;
  font-weight:    bold;
  padding:        6px 16px;
  background:     var(--theme-color-btn2-bg);
  color:          var(--theme-color-muted);
  letter-spacing: 0.04em;
}
.toggle-opt:not(:last-child)   { border-right: 1px solid var(--theme-color-btn2-border); }
.toggle-opt.active             { background: var(--theme-color-btn-bg); color: var(--theme-color-btn-text); cursor: default; }
.toggle-opt:not(.active):hover { background: var(--theme-color-btn2-hover); }

/* SVG cell states */
.cell              { fill: var(--theme-color-cell-bg); stroke: var(--theme-color-cell-stroke); stroke-width: 0.5; }
.cell.active-entry { fill: var(--theme-color-highlight); }
.cell.active-cell  { fill: var(--theme-color-active); stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }
.cell.correct      { fill: var(--theme-color-correct-bg); stroke: var(--theme-color-correct-stroke); stroke-width: 0.5; }
.cell.correct.active-cell { stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }

.style-circle { fill: none; stroke: var(--theme-color-circle); stroke-width: 1; }

/* No font-size on .cell-letter or .cell-num: Spiral sizes these dynamically as SVG
   presentation attributes; a CSS font-size overrides them silently. Per-tool sizes
   live in the namespaced sections below. */
.cell-letter         { font-family: var(--theme-font-cell); fill: var(--theme-color-cell-text); }
.cell-letter.correct { fill: var(--theme-color-correct-text); }
.cell-num            { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }

/* Multi-letter (rebus) cell content. Sized with transform, not font-size: Spiral writes
   its per-puzzle letter size as an SVG presentation attribute, which any CSS font-size
   rule would outrank (e2e/spiral.spec.js asserts exactly that). transform composes with
   whatever base size each tool established, so one shared block covers all three tools
   with no per-tool font math. transform-box: fill-box is required — SVG's default
   view-box origin would drag the text toward the viewport origin instead of scaling it
   in place. */
.cell-letter          { transform-box: fill-box; transform-origin: center; }
.cell-letter.len-2    { transform: scale(0.62); }
.cell-letter.len-3    { transform: scale(0.45); }
.cell-letter.len-long { transform: scale(0.34); }

/* Rebus entry in progress. Specificity 0,3,0 beats .cell.active-cell (0,2,0) without
   depending on source order; the composing cell is always the active cell, so the
   selector states that invariant rather than working around it. Fill and stroke colour
   are inherited from .cell.active-cell — only the dash pattern distinguishes the state,
   so no theme needs a new token. */
.cell.active-cell.composing { stroke-width: 2.5; stroke-dasharray: 4 2; }

/* Congrats modal — backdrop handles the overlay dim; #congrats is the visible card */
#congrats-dialog::backdrop { background: var(--theme-color-overlay); }

/* Keys button (fixed bottom-right corner, created by setupKeysOverlay) */
#keys-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#keys-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Menu button (fixed top-right corner, created by setupOptionsMenu) — same
   var usage as #keys-btn. */
#menu-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#menu-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Menu dropdown card — same var usage as #keys-modal. */
#menu-panel {

.tool-snake-charmer .cell-num    { font-size: 9px; }
.tool-snake-charmer .cell-letter { font-size: 14px; }
.tool-snake-charmer .cell.secondary-entry { fill: var(--theme-color-secondary-entry); }
.tool-snake-charmer .cell.active-cell.secondary-entry {
  fill:         var(--theme-color-secondary-active);

/* Hover first so active/secondary overrides it at equal or higher specificity. */

.tool-snake-charmer .clue-item:hover           { background: var(--theme-color-clue-hover); }
.tool-snake-charmer .clue-item.active-clue     { background: var(--theme-color-active); }
.tool-snake-charmer .clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-snake-charmer .clue-item.correct .clue-text { color: var(--theme-color-correct-text); text-decoration: line-through; }

/* Marching Bands — band fills are unnamespaced to keep :where() specificity
   below .cell.active-entry (0,2,0); .band-even/.band-odd are MB-exclusive.
   Prefixing with .tool-marching-bands would raise these to 0,2,0 too, tying
   with active-entry and leaving the winner to source order (wrong) — dead
   CSS in other tools, but harmless since the classes are MB-exclusive. */
.cell:where(.band-even) { fill: var(--theme-color-band-even); }
.cell:where(.band-odd)  { fill: var(--theme-color-cell-bg); }
.cell.band-even.active-entry { fill: var(--theme-color-highlight-band-even); }
.tool-marching-bands .cell-letter { font-size: 14px; }
.tool-marching-bands .band-label  { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }

.tool-marching-bands .cell-center { fill: var(--theme-color-cell-center); }
.tool-marching-bands .clue-group:hover          { background: var(--theme-color-clue-hover); }
.tool-marching-bands .clue-group.active-clue    { background: var(--theme-color-active); }
.tool-marching-bands .clue-group.secondary-entry { background: var(--theme-color-secondary-entry); }

.tool-spiral .clue-item:hover           { background: var(--theme-color-clue-hover); }
.tool-spiral .clue-item.active-clue     { background: var(--theme-color-active); }
.tool-spiral .clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-spiral .clue-item.correct .clue-text { color: var(--theme-color-correct-text); text-decoration: line-through; }
.tool-spiral #center-curl       { fill: none; stroke: var(--theme-color-curl); stroke-width: 1.4; stroke-linecap: round; }
.tool-spiral #direction-chevron { stroke: var(--theme-color-active-stroke); stroke-width: 0.9; opacity: 0.5; }
/* Crushword */
/* Opaque background is load-bearing, not cosmetic: .puzzle-center is
   position:sticky over .clue-columns (base.css), which scrolls directly
   underneath it in the same horizontal space — without this, clue text
   would show through the padding around the sticky grid as it scrolls. */
.tool-crushword .puzzle-center { background: var(--theme-color-bg); }
.tool-crushword .cell-num    { font-size: 8px; }
.tool-crushword .cell-letter { font-size: 14px; }
.tool-crushword .cell-block  { fill: var(--theme-color-cell-center); }

.tool-crushword .cell.active-cell.composing { stroke-width: 1.5; stroke-dasharray: none; }

.tool-crushword .cell-caret { fill: var(--theme-color-cell-text); pointer-events: none; }
.tool-crushword .clue-item { margin-bottom: 4px; font-size: 0.85rem; line-height: 1.35; padding: 2px 6px 2px 2px; }
.tool-crushword .clue-item:hover           { background: var(--theme-color-clue-hover); }
.tool-crushword .clue-item.active-clue     { background: var(--theme-color-active); }
.tool-crushword .clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-crushword .clue-item.correct .clue-text { color: var(--theme-color-correct-text); text-decoration: line-through; }

/* Shared print resets — the final override layer for printing, applied to
   every tool and theme. Forces plain ink on white regardless of solve state
   or theme. Declarations are !important by design so this layer wins over any
   theme rule regardless of its selector specificity or source order — a tool
   theme that later adds a higher-specificity highlight rule can't silently
   defeat the print reset. A tool's print.css that needs to override a reset
   here must also use !important. */
@media print {
  /* Hide interaction chrome */
  #active-clue-bar,
  #controls,
  #congrats-dialog,
  #keys-overlay,
  #keys-btn,
  #menu-btn,
  #menu-panel,
  #done-wrong { display: none !important; }

  body { padding-top: 0 !important; }
  h1.title { font-size: 1.4rem !important; }

  /* Cell state → plain ink on white */
  .cell,
  .cell.active-entry,
  .cell.active-cell,
  .cell.correct,
  .cell.secondary-entry { fill: #fff !important; stroke: #999 !important; stroke-width: 1 !important; stroke-dasharray: none !important; }
  .cell-letter.correct { fill: #111 !important; }

  /* Clue highlight / strike-through reset */
  .clue-item.active-clue,
  .clue-item.secondary-entry { background: transparent !important; }
  .clue-item.correct .clue-text { color: inherit !important; text-decoration: none !important; }

  .clue-group.active-clue    { background: transparent !important; }
  .clue-group.secondary-entry { background: transparent !important; }

  .cell-center { fill: #222 !important; }

    grid-template-areas: "left center right";
    gap: 0 16px;
  }
}

      // never received input has nothing new to persist.

// leaves the element blank.
function renderByline(data) {
  const byline = document.querySelector('.byline');
  if (!byline) return;
  const parts = [];
  if (data.author) parts.push('by ' + data.author);
  if (data.date) parts.push(String(data.date));
  byline.textContent = parts.join(' · ');
}

// revealed (hidden=false) only when content exists. `data.instructions` is
// already block-level markdown HTML by the time it reaches the browser
// (shared/build/renderMarkdown.js's renderInstructionsMarkdown, called from
// commonPuzzleData at build time) — blank-line paragraph splitting happens
// at build time, not here, so this only ever injects trusted, build-time-rendered
// HTML, never author text directly.
function renderInstructions(data) {
  const el = document.getElementById('instructions');
  if (!data.instructions || !el) return;
  el.innerHTML = data.instructions;
  el.hidden = false;

// Two-click arm/disarm Clear button. First click swaps the label to "Are you
// sure?" and adds `.armed` for 3s; a second click within that window calls
// onConfirmed(), which each engine supplies to perform the full in-memory
// board reset.
// `refocus` (optional) restores puzzle focus after the arming click so the
// document keydown BUTTON guard doesn't block the next keystroke.
function setupClearButton(clearBtn, onConfirmed, refocus) {
  let armed = false;
  let timer = null;
  function disarm() {
    armed = false;
    clearBtn.textContent = 'Clear Puzzle';
    clearBtn.classList.remove('armed');
  }
  clearBtn.addEventListener('click', () => {
    if (!armed) {
      armed = true;
      clearBtn.textContent = 'Are you sure?';
      clearBtn.classList.add('armed');
      timer = setTimeout(disarm, 3000);
      if (refocus) refocus();
    } else {
      clearTimeout(timer);
      disarm();
      onConfirmed();
    }

//
// Never disabled, never hidden, identical in hashed and non-hashed builds. That is the
// spoiler rule from docs/CROSS_TOOL_SPEC.md → Enter — rebus entry: nothing in the UI may
// vary as a function of a cell's capacity. #check-btn sits next to this one in #controls
// and *is* toggled per-cell — do not copy it here.
//

// Without the guard here, composition could open on a sealed board.
//
//   onToggle()    → run the engine's Enter branch (composer.enter + advance-or-syncUI)
//   isComposing() → composer.isComposing(activeCell)

      sync();
    }
    if (refocus) refocus();
  });

  sync();
  return { sync };
}

// Page-scroll deltas for keys the puzzles don't otherwise consume. Because the
// hidden input holds focus, the browser suppresses native scrolling for these,
// so the engines forward them here. Arrow = one nudge; Page = ~one viewport.
const SCROLL_DELTAS = {
  ArrowUp:   () => -80,
  ArrowDown: () =>  80,
  PageUp:    () => -window.innerHeight * 0.9,
  PageDown:  () =>  window.innerHeight * 0.9,
};

// Scrolls the page for a forwarded scroll key. Returns true when `key` is a
// scroll key (and the scroll was performed), false otherwise — so a caller that
// first tries cell navigation (e.g. Marching Bands) can fall through to this
// only when there is no in-grid target.
function scrollByKey(key) {
  const delta = SCROLL_DELTAS[key];
  if (!delta) return false;
  window.scrollBy({ top: delta(), behavior: 'auto' });
  return true;
}

// Builds the auto-save localStorage key, or null when it would be degenerate.
// Puzzles without both a title and a date get no auto-save (a `vp:<prefix>:|`
// key would collide across every untitled/undated puzzle of that type).
function storageKey(prefix, data) {
  if (!data.title || !data.date) return null;
  return 'vp:' + prefix + ':' + data.title + '|' + data.date;
}

// Flash a cell red to signal a wrong guess without disturbing the cell's own
// fill or active-state styling. Clones the cell element into `flashLayer` — an
// overlay <g> the engines paint above the cells but below the letters — relabels
// the clone `.flash-wrong-overlay` (whose base.css animation fades it out), then
// removes it once the animation ends. FLASH_WRONG_MS must match that animation's
// duration in shared/base.css.
const FLASH_WRONG_MS = 600;
function flashWrong(cellEl, flashLayer) {
  const flashEl = cellEl.cloneNode(false);
  flashEl.removeAttribute('id');
  flashEl.setAttribute('class', 'flash-wrong-overlay');
  flashLayer.appendChild(flashEl);
  setTimeout(() => flashEl.remove(), FLASH_WRONG_MS);
}

// localStorage save/restore/clear with the shared version + cellCount guard.
// The saved shape differs per tool, so the tool supplies the variable parts:
//   getState()      → tool payload merged under { v:1, cellCount } on save
//   applyState(saved) → applies a payload that passed the version/cellCount guard
// `key` may be null (see storageKey), in which case all three are no-ops.
function setupStorage(key, { cellCount, getState, applyState }) {
  function saveState() {
    if (!key) return;
    try {
      localStorage.setItem(key, JSON.stringify({ v: 1, cellCount, ...getState() }));
    } catch (_) {}
  }
  function restoreState() {
    if (!key) return;
    let saved;
    try { saved = JSON.parse(localStorage.getItem(key)); } catch (_) {}
    if (!saved || saved.v !== 1 || saved.cellCount !== cellCount) return;
    applyState(saved);
  }
  function clearState() {
    if (!key) return;
    try { localStorage.removeItem(key); } catch (_) {}
  }
  return { saveState, restoreState, clearState };
}

// Wraps a tool's keydown handler with the guards shared by every engine: hasFocus,
// Cmd+Arrow history navigation, generic Cmd/Ctrl passthrough, BUTTON focus skip,
// and keys-overlay open. The tool-specific handler receives the event only when
// all guards pass.
function setupKeydown(handler, { keysOverlay } = {}) {
  document.addEventListener('keydown', e => {
    if (!document.hasFocus()) return;
    if (keysOverlay && keysOverlay.open) return;
    if (e.metaKey && e.key === 'ArrowLeft') { history.back(); return; }
    if (e.metaKey && e.key === 'ArrowRight') { history.forward(); return; }
    if (e.metaKey || e.ctrlKey) return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    handler(e);
  });
}

// Formats elapsed milliseconds as M:SS (e.g. 154321 → "2:34").
function formatMs(ms) {
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// Builds the solve-celebration modal from the supplied callbacks and metadata.
// Creates a native <dialog id="congrats-dialog"> appended to <body>, opened via
// showModal() so the page is inert (matching the keys overlay pattern). Returns
// { open(timeMs) } — called from makeCompletionLatch's onComplete on first solve.
// Backdrop click and Escape close without resetting; Play again closes + resets.
function setupCongratsDialog({ title, date, onPlayAgain }) {
  const dialog = document.createElement('dialog');
  dialog.id = 'congrats-dialog';
  dialog.setAttribute('aria-label', 'Puzzle solved');

  const card = document.createElement('div');
  card.id = 'congrats';

  const msg = document.createElement('p');
  msg.id = 'congrats-msg';
  msg.textContent = 'Puzzle solved!';

  const timeEl = document.createElement('p');
  timeEl.id = 'congrats-time';

  const actions = document.createElement('div');
  actions.id = 'congrats-actions';

  const copyBtn = document.createElement('button');
  copyBtn.id = 'congrats-copy-btn';
  copyBtn.type = 'button';
  copyBtn.textContent = 'Copy result';

  const playBtn = document.createElement('button');
  playBtn.id = 'congrats-play-btn';
  playBtn.type = 'button';
  playBtn.autofocus = true;
  playBtn.textContent = 'Play again';

  actions.append(copyBtn, playBtn);
  card.append(msg, timeEl, actions);
  dialog.appendChild(card);
  document.body.appendChild(dialog);

  // Backdrop click (target is the transparent dialog frame, not the card) closes.
  dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });

  let copyText = '';
  copyBtn.addEventListener('click', () => {
    navigator.clipboard?.writeText(copyText).catch(() => {});
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy result'; }, 1500);
  });
  playBtn.addEventListener('click', () => {
    dialog.close();
    onPlayAgain();
  });

  function open(timeMs) {
    const timeStr = formatMs(timeMs);
    timeEl.textContent = 'Solved in ' + timeStr;
    const prefix = (title && date) ? title + ' · ' + String(date) + '\n' : '';
    copyText = prefix + 'Solved in ' + timeStr;
    if (!dialog.open) dialog.showModal();
  }

  return { open };
}

// Builds and wires the keyboard-shortcuts modal from a list of [keys, description]
// pairs (the only part that differs between tools). Creates the #keys-btn trigger
// (fixed bottom-right corner) and a native <dialog id="keys-overlay"> holding the
// #keys-modal card, both appended to <body>. Returns the <dialog> for setupKeydown's
// keysOverlay guard (which checks .open).
//
// Opens on button click or ? keypress via showModal(), which moves focus into the
// dialog, traps Tab inside it, makes the rest of the page inert, and paints the
// ::backdrop dim in the top layer — all behaviors the platform gives for free.
// Closes on close-button click, backdrop click, or Escape (native). Puzzle focus
// returns via the browser's native dialog focus-restoration: `open()` focuses the
// grid input just before showModal(), making it the recorded restore target, so
// every close path lands focus there with no explicit close handler.
function setupKeysOverlay(shortcuts, refocus) {
  const btn = document.createElement('button');
  btn.id = 'keys-btn';
  btn.type = 'button';
  btn.setAttribute('aria-label', 'Keyboard shortcuts');
  btn.textContent = '?';
  document.body.appendChild(btn);

  // <dialog> carries the dialog/aria-modal semantics implicitly when shown via
  // showModal(); it is a transparent frame, and #keys-modal is the visible card.
  const dialog = document.createElement('dialog');
  dialog.id = 'keys-overlay';
  dialog.setAttribute('aria-label', 'Keyboard shortcuts');

  const modal = document.createElement('div');
  modal.id = 'keys-modal';

  const header = document.createElement('div');
  header.id = 'keys-modal-header';
  const heading = document.createElement('span');
  heading.textContent = 'Keyboard shortcuts';
  const closeBtn = document.createElement('button');
  closeBtn.id = 'keys-close';
  closeBtn.type = 'button';
  closeBtn.autofocus = true; // showModal() focuses this, parking keystrokes off the grid
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.textContent = '✕';
  header.append(heading, closeBtn);

  const table = document.createElement('table');
  for (const [keys, desc] of shortcuts) {
    const row = document.createElement('tr');
    const keyCell = document.createElement('td');
    const kbd = document.createElement('kbd');
    kbd.textContent = keys;
    keyCell.appendChild(kbd);
    const descCell = document.createElement('td');
    descCell.textContent = desc;
    row.append(keyCell, descCell);
    table.appendChild(row);
  }

  modal.append(header, table);
  dialog.appendChild(modal);
  document.body.appendChild(dialog);

  // Focus the puzzle before opening so the input becomes the dialog's recorded
  // focus-restore target; the browser's native restoration then returns focus
  // there on every close path (Escape, ✕, backdrop, ? toggle). Without this,
  // restoration would return focus to the trigger button, briefly stranding the
  // next keystroke off the grid.
  const open  = () => { refocus(); dialog.showModal(); };
  const close = () => dialog.close();

  btn.addEventListener('click', () => dialog.open ? close() : open());
  closeBtn.addEventListener('click', close);
  // A click whose target is the dialog itself landed on the ::backdrop — clicks on
  // the #keys-modal card target the card or its children, so they don't close.
  dialog.addEventListener('click', e => { if (e.target === dialog) close(); });
  document.addEventListener('keydown', e => {
    if (!document.hasFocus()) return;
    if (e.key === '?' && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      dialog.open ? close() : open();
    }
  });
  return dialog;
}

// Builds and wires the options menu: a fixed top-right hamburger trigger
// (#menu-btn) and a non-modal dropdown (#menu-panel) that today holds only the
// Clear button, but is the shared home for any future rarely-used puzzle-wide
// toggle. Unlike setupKeysOverlay's <dialog>, the panel is a plain div — it
// never makes the page inert, so the grid stays clickable behind it.
//
// Clicks inside the panel never close it on their own. That is what lets
// #clear-btn's existing two-click arm/confirm sequence (setupClearButton) play
// out with the panel visibly open through the 3s "Are you sure?" window, instead of
// vanishing after the first (arming) click. Closing — by re-clicking the
// trigger, clicking outside, or Escape — calls `refocus`, matching every other
// control that can steal focus from the hidden input (see
// docs/CROSS_TOOL_SPEC.md → Focus management).
//
// Returns { clearBtn, close, checkBtnToggle, checkBtnToggleLabel } for setupControls
// to wire.
function setupOptionsMenu(refocus) {
  const btn = document.createElement('button');
  btn.id = 'menu-btn';
  btn.type = 'button';
  btn.setAttribute('aria-label', 'Menu');
  btn.setAttribute('aria-haspopup', 'true');
  btn.setAttribute('aria-expanded', 'false');
  btn.textContent = '☰';
  document.body.appendChild(btn);

  const panel = document.createElement('div');
  panel.id = 'menu-panel';
  panel.setAttribute('role', 'menu');
  panel.hidden = true;

  // Only meaningful in non-hashed puzzles — the caller hides checkBtnToggleLabel
  // entirely (not just the checkbox) when hashed, since there's no Check Cell
  // button there to control. Sits above Clear Puzzle: a plain display setting
  // before the destructive action.
  const checkBtnToggle = document.createElement('input');
  checkBtnToggle.type = 'checkbox';
  checkBtnToggle.id = 'check-btn-toggle';
  const checkBtnToggleLabel = document.createElement('label');
  checkBtnToggleLabel.id = 'check-btn-toggle-label';
  checkBtnToggleLabel.append(checkBtnToggle, document.createTextNode(' Show Check Cell button'));
  panel.appendChild(checkBtnToggleLabel);

  const clearBtn = document.createElement('button');
  clearBtn.id = 'clear-btn';
  clearBtn.type = 'button';
  clearBtn.textContent = 'Clear Puzzle';
  panel.appendChild(clearBtn);

  document.body.appendChild(panel);

  function isOpen() { return !panel.hidden; }

  function close() {
    if (!isOpen()) return;
    panel.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    refocus();
  }

  function open() {
    panel.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
  }

  btn.addEventListener('click', () => (isOpen() ? close() : open()));

  // A click on the trigger is excluded here because its own listener above
  // already handled it (bubbling reaches this one after), and a click inside
  // the panel (e.g. arming Clear) must never close the menu out from under it.
  document.addEventListener('click', e => {
    if (!isOpen()) return;
    if (panel.contains(e.target) || btn.contains(e.target)) return;
    close();
  });

  document.addEventListener('keydown', e => {
    if (isOpen() && e.key === 'Escape') close();
  });

  return { clearBtn, close, checkBtnToggle, checkBtnToggleLabel };
}

// A tiny, board-independent localStorage boolean for the Check Cell button's
// visibility — namespaced under the puzzle's own key (see storageKey) but never
// touched by clearState()/resetBoard(): it's a display preference, not board
// state, so Clear Puzzle must not reset it. Not built on setupStorage(), whose
// v/cellCount guard is board-shaped and meaningless for a single boolean. Absent
// (first load, or an older save) defaults to visible. `key` may be null exactly
// as in setupStorage — an untitled/undated puzzle gets no persistence either.
function setupCheckBtnPref(key) {
  const prefKey = key && (key + ':showCheckBtn');
  function load() {
    if (!prefKey) return true;
    try {
      const v = JSON.parse(localStorage.getItem(prefKey));
      return typeof v === 'boolean' ? v : true;
    } catch (_) { return true; }
  }
  function save(visible) {
    if (!prefKey) return;
    try { localStorage.setItem(prefKey, JSON.stringify(visible)); } catch (_) {}
  }
  return { load, save };
}

// Reserves #controls' current rendered width and height as min-width/min-height,
// so hiding #check-btn (via the "Show Check Cell button" toggle) never shrinks
// the row. Two independent reasons, both load-bearing:
//   - height: #check-btn is deliberately styled larger than its siblings
//     ("Primary button", theme-components.css), so it's ordinarily the
//     tallest child and the one whose removal would otherwise change
//     #controls' own height — in Snake Charmer specifically, that shifts the
//     ring below it in the same flex column.
//   - width: Snake Charmer's #ring-wrap has no explicit width — it shrinks to
//     fit its widest child (src/template/base.css), which for a small ring is
//     #controls, not the ring itself. Removing a button there shrinks
//     #controls' natural width, which shrinks #ring-wrap, which shrinks the
//     ring (#ring-svg is width:100% of it) — an unrelated button hide
//     visibly resizing the puzzle, not just reflowing #controls internally.
// Must be called while #check-btn is still visible, i.e. before applying the
// loaded preference.
// If a future fix makes #controls' rendered size constant (e.g. by giving it
// an explicit width/height instead of relying on content), revisit whether
// this runtime measurement is still needed.
function reserveControlsSize() {
  const controls = document.getElementById('controls');
  if (!controls) return;
  const rect = controls.getBoundingClientRect();
  controls.style.minWidth = rect.width + 'px';
  controls.style.minHeight = rect.height + 'px';
}

// Wires #check-btn and the options menu around it, identically in every engine:
//   - #check-btn is hidden in hashed builds (the plain-text answer never ships there, so
//     there is nothing to check against) and calls `onCheck` otherwise.
//   - Clear arms/confirms through setupClearButton; once actually confirmed (not just
//     armed) it runs `onClear` and closes the menu on the solver's behalf.
//   - The "Show Check Cell button" row is hidden in hashed builds; otherwise it reserves
//     #controls' size (before the loaded preference can hide the button — see
//     reserveControlsSize), applies the persisted preference, and keeps it in sync.
// `key` is the same storageKey(...) result the engine passes to setupStorage.
function setupControls({ checkBtn, hashed, onCheck, onClear, refocus, key }) {
  const { clearBtn, close, checkBtnToggle, checkBtnToggleLabel } = setupOptionsMenu(refocus);
  setupClearButton(clearBtn, () => { onClear(); close(); }, refocus);

  if (hashed) {
    checkBtn.hidden = true;
    checkBtnToggleLabel.hidden = true;
    return;
  }
  checkBtn.addEventListener('click', onCheck);
  reserveControlsSize();
  const checkBtnPref = setupCheckBtnPref(key);
  checkBtnToggle.checked = checkBtnPref.load();
  checkBtn.hidden = !checkBtnToggle.checked;
  checkBtnToggle.addEventListener('change', () => {
    checkBtn.hidden = !checkBtnToggle.checked;
    checkBtnPref.save(checkBtnToggle.checked);
  });
}

if (typeof module !== 'undefined') {
  module.exports = {
    svgEl, renderByline, renderInstructions, setupClearButton, setupRebusButton,
    scrollByKey, storageKey, setupStorage, flashWrong,
    setupKeydown, setupCongratsDialog, setupKeysOverlay, setupOptionsMenu,
    setupCheckBtnPref, reserveControlsSize, setupControls,
  };
}

'use strict';
// Grid geometry shared by the validator, the hasher and the browser engine — the
// engine gets it by concatenation (see src/builder.js), which is what keeps its
// band traversal and the validator's from drifting apart. Dual-mode guard at the
// bottom, as in shared/ (root CLAUDE.md → Shared library pattern).

function bandIndexOf(row, col, N) {
  return Math.min(row - 1, col - 1, N - row, N - col);
}

function centerFlatIndex(N) {
  // 0-indexed flat index of the center cell (only meaningful for odd N)
  const mid = (N - 1) / 2;
  return mid * N + mid;
}

function centerN(N) {
  // 1-indexed flat ID of the center cell (only meaningful for odd N)
  return centerFlatIndex(N) + 1;
}

function bandCells(k, N) {
  // Returns array of 1-indexed flat cell IDs in clockwise order for band k (0-indexed).
  // Count = 4*(N-1-2k) for ring bands; for the center cell (odd N, k=(N-1)/2) returns [centerN(N)].
  // Cell n = (row-1)*N + col (1-indexed row and col).
  const cells = [];
  // Top edge: row k+1, cols k+1 → N-k
  for (let col = k + 1; col <= N - k; col++)
    cells.push(k * N + col);
  // Right edge: col N-k, rows k+2 → N-k
  for (let row = k + 2; row <= N - k; row++)
    cells.push((row - 1) * N + (N - k));
  // Bottom edge: row N-k, cols N-k-1 → k+1 (right to left)
  for (let col = N - k - 1; col >= k + 1; col--)
    cells.push((N - k - 1) * N + col);
  // Left edge: col k+1, rows N-k-1 → k+2 (bottom to top)
  for (let row = N - k - 1; row >= k + 2; row--)
    cells.push((row - 1) * N + (k + 1));
  return cells;
}

if (typeof module !== 'undefined') module.exports = { bandIndexOf, bandCells, centerFlatIndex, centerN };

/* global window, document */
(function () {
  'use strict';

  function init() {
    // ── Data & constants ─────────────────────────────────────────────────────
    const data = window.PUZZLE_DATA;
    const N = data.size;
    const numBands = Math.floor(N / 2);
    const CELL_SIZE = 34;
    const BAND_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

    // ── Geometry & index maps ─────────────────────────────────────────────────
    // bandIndexOf/bandCells/centerN come from src/layout.js, concatenated ahead of this
    // file by the builder — the same functions the validator and hasher use, so the
    // engine's band traversal cannot drift from theirs.
    function cellId(row, col)  { return (row - 1) * N + col; }
    function rowOf(n)          { return Math.ceil(n / N); }
    function colOf(n)          { return ((n - 1) % N) + 1; }
    function bandOf(n)         { return bandIndexOf(rowOf(n), colOf(n), N); }

    // 1-indexed center cell ID (odd N only, -1 for even N)
    const CENTER_N = (N % 2 === 1) ? centerN(N) : -1;

    // bandCellsMap[k]: clockwise-ordered 1-indexed cell IDs for band k
    const bandCellsMap = Array.from({ length: numBands }, (_, k) => bandCells(k, N));

    // rowCellsMap[r]: left-to-right 1-indexed cell IDs for row r (0-indexed), skipping center
    const rowCellsMap = [];
    for (let r = 0; r < N; r++) {
      const cells = [];
      for (let c = 1; c <= N; c++) {
        const n = cellId(r+1, c);
        if (n !== CENTER_N) cells.push(n);
      }
      rowCellsMap.push(cells);
    }

    // ── State ─────────────────────────────────────────────────────────────────
    let mode = 'row';    // 'row' | 'band'
    let activeN = rowCellsMap[0][0]; // first non-center cell of row 0

    // ── Logic functions ───────────────────────────────────────────────────────
    // #hidden-input is static markup, present regardless of when this runs, so this can be
    // declared up front rather than waiting for a local hiddenInput const (MB has none).
    const refocus = () => document.getElementById('hidden-input').focus({ preventScroll: true });

    const cellLetters = {};
    function getCellLetter(n) { return cellLetters[n] || ''; }

    // Marks (or unmarks) cell n's correct state on its rect and its letter element
    // together, so the two can never drift. The `.correct` class is the marker every
    // other site reads — matching Snake Charmer and Spiral.
    function setCorrect(n, on) {
      cellRects[n].classList.toggle('correct', on);
      letterTexts[n].classList.toggle('correct', on);
    }

    function isCorrect(n) { return cellRects[n].classList.contains('correct'); }

    function setCellLetter(n, letter) {
      if (letter) cellLetters[n] = letter;
      else delete cellLetters[n];
      setLetterText(letterTexts[n], letter);
      setCorrect(n, false);
    }

    // Multi-letter (rebus) entry state. Commit is wired at exactly one place — the top
    // of focusCell — which covers every cursor move because activeN is assigned
    // nowhere else.
    const composer = makeComposer({
      getContent: n => getCellLetter(n),
      setContent: (n, s) => setCellLetter(n, s),
      getCellEl:  n => cellRects[n],
      onCommit:   () => { syncUI(); checker.checkIfFilled(); saveState(); },
    });

    // Row-major order skipping the black centre — the canonical board string order.
    // The centre contributes nothing to the string, not an empty segment.
    const CELL_IDS = [];
    for (let n = 1; n <= N * N; n++) if (n !== CENTER_N) CELL_IDS.push(n);

    // Board state and answer checking. Marching Bands marks no clue items in either
    // mode — its clue groups deliberately hide entry boundaries — so it is already
    // mode-symmetric and markSolved stays cells-and-letters only.
    const checker = makeBoardChecker({
      cellIds:             CELL_IDS,
      getContent:          n => getCellLetter(n),
      isCellFilled:        n => composer.isCellFilled(n),
      isCellMarkedCorrect: isCorrect,
      hashed:              !!data.hashed,
      getExpected:         n => data.letters && data.letters[n - 1],
      getBoardHash:        () => data.boardHash,
      markSolved:          () => markAllCorrect(),
      syncUI:              () => syncUI(),
    });

    function activeRowIndex()  { return rowOf(activeN) - 1; }   // 0-indexed
    function activeBandIndex() { return bandOf(activeN); }       // 0-indexed

    // Clue-group <li> elements by row/band index, filled by buildClues below (declared
    // here so MODES can hold them).
    const rowClueGroups  = [];
    const bandClueGroups = [];

    // Everything that differs between the two modes, in one table: the cells of each
    // row/band, which one the cursor is in, how many there are, their clue groups, and
    // the other mode's name. Every `mode === 'row' ? … : …` in this engine reads from
    // here instead. activeRowIndex/activeBandIndex are hoisted function declarations.
    const MODES = {
      row:  { cells: rowCellsMap,  index: activeRowIndex,  count: N,        groups: rowClueGroups,  other: 'band' },
      band: { cells: bandCellsMap, index: activeBandIndex, count: numBands, groups: bandClueGroups, other: 'row'  },
    };

    function activeContextCells() {
      const { cells, index } = MODES[mode];
      return cells[index()];
    }

    function nextCell(n) {
      const cells = activeContextCells();
      const pos = cells.indexOf(n);
      if (pos < cells.length - 1) return cells[pos + 1];
      // Wrap to the first cell of the next row or band.
      const m = MODES[mode];
      return m.cells[(m.index() + 1) % m.count][0];
    }

    function prevCell(n) {
      const cells = activeContextCells();
      const pos = cells.indexOf(n);
      if (pos > 0) return cells[pos - 1];
      // Wrap to the last cell of the previous row or band.
      const m = MODES[mode];
      const prev = m.cells[(m.index() - 1 + m.count) % m.count];
      return prev[prev.length - 1];
    }

    function arrowTarget(n, dr, dc) {
      let r = rowOf(n) + dr;
      let c = colOf(n) + dc;
      if (r >= 1 && r <= N && c >= 1 && c <= N) {
        const candidate = cellId(r, c);
        if (candidate === CENTER_N) { r += dr; c += dc; }
      }
      if (r < 1 || r > N || c < 1 || c > N) return null;
      return cellId(r, c);
    }

    function focusCell(n) {
      composer.commitIfMoved(n);
      activeN = n;
      syncUI();
      refocus();
    }

    // The one rebus toggle, shared by the Enter key and #rebus-btn. Both entry points must
    // behave identically, so neither gets its own copy of the composer call. Committing
    // does not advance the cursor — only an explicit move (arrow, Tab, click) does.
    function toggleRebus() {
      composer.enter(activeN);
      syncUI();
    }

    // Declared above syncUI (which calls rebusBtn.sync()) — see docs/CROSS_TOOL_SPEC.md →
    // "Enter / Rebus button" for the TDZ rationale. Never hidden and never disabled —
    // unlike #check-btn. See setupRebusButton.
    const rebusBtn = setupRebusButton(document.getElementById('rebus-btn'), {
      onToggle:    toggleRebus,
      isComposing: () => composer.isComposing(activeN),
      isSolved:    () => latch.solved,
      refocus,
    });

    function syncUI() {
      // Composition also ends on any cursor move, which never touches the button.
      rebusBtn.sync();

      // Clear transient highlight classes — band-even/band-odd and correct never change here
      for (const n of CELL_IDS) cellRects[n].classList.remove('active-entry', 'active-cell');

      // Highlight active row or band (all its cells)
      for (const n of activeContextCells()) cellRects[n].classList.add('active-entry');

      // Mark active cell
      const activeRect = cellRects[activeN];
      activeRect.classList.remove('active-entry');
      activeRect.classList.add('active-cell');
      cellsLayer.appendChild(activeRect); // paint on top so stroke is uniform on all four sides

      // Clear all clue highlights
      for (const m of Object.values(MODES)) {
        for (const group of m.groups) group.classList.remove('active-clue', 'secondary-entry');
      }

      // Highlight active row/band clue cluster; secondary-highlight the cross-mode cluster
      const activeMode = MODES[mode];
      const crossMode  = MODES[activeMode.other];
      activeMode.groups[activeMode.index()].classList.add('active-clue');
      crossMode.groups[crossMode.index()].classList.add('secondary-entry');

      // Mode toggle active segment
      document.querySelectorAll('#mode-toggle .toggle-opt').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      // Check button: enable only if active cell has a letter and is not already correct (non-hashed mode)
      if (!data.hashed) {
        document.getElementById('check-btn').disabled =
          !composer.isCellFilled(activeN) || isCorrect(activeN);
      }

      // Congrats / done-wrong banners are derived purely from board state.
      const allFilled = checker.isBoardFilled();
      const solved    = checker.isSolved();
      document.getElementById('done-wrong').hidden = !(allFilled && !solved);

      // Scroll active clue cluster into view
      activeMode.groups[activeMode.index()]?.scrollIntoView({ block: 'nearest' });
      latch.check(solved);
    }

    function markAllCorrect() {
      for (const n of CELL_IDS) setCorrect(n, true);
    }

    function checkCell() {
      const n = activeN;
      // The focus call is required on every path out: the button holds focus here, and the
      // document keydown listener's BUTTON guard would swallow the next navigation key.
      // The already-correct guard skips a redundant re-save; setCellLetter clears the flag
      // on any content change, so a flagged cell always still holds correct content.
      if (!isCorrect(n) && composer.isCellFilled(n)) {
        if (isCellCorrect(getCellLetter(n), data.letters[n - 1])) {
          setCorrect(n, true);
          saveState();          // only this branch mutates persisted state
        } else {
          flashWrong(cellRects[n], flashLayer);
        }
      }
      syncUI();
      refocus();
    }

    const saveKey = storageKey('mb', data);
    const { saveState, restoreState, clearState } = setupStorage(saveKey, {
      cellCount: N * N - (N % 2),
      getState() {
        const letters = {};
        const correct = [];
        for (const n of CELL_IDS) {
          const l = getCellLetter(n);
          if (l) letters[n] = l;
          if (isCorrect(n)) correct.push(n);
        }
        return {
          letters, correct, activeMs: timer.getElapsedMs(),
          composing: composer.getComposing(),
        };
      },
      applyState(saved) {
        for (const n of CELL_IDS) {
          const letter = saved.letters?.[n];
          if (!letter) continue;
          cellLetters[n] = letter;
          setLetterText(letterTexts[n], letter);
        }
        for (const n of (saved.correct || [])) setCorrect(n, true);
        timer.restoreMs(saved.activeMs);
        // After the letters are painted, so the composing cell shows its partial content.
        // Absent in saves predating this field; composer.restore treats that as null.
        composer.restore(saved.composing);
      },
    });

    const congratsDialog = setupCongratsDialog({
      title: data.title,
      date: data.date,
      onPlayAgain: () => resetBoard(),
    });

    const { timer, latch } = setupSolveTracking({
      puzzleRoot:  document.querySelector('.puzzle-main'),
      data,
      getSolution: () => checker.getSolution(),
      saveState,
      onComplete:  (timeMs) => congratsDialog.open(timeMs),
    });

    // ── Build SVG ─────────────────────────────────────────────────────────────
    const cellRects  = {};  // n → <rect>
    const letterTexts = {}; // n → <text>

    const svg = document.getElementById('puzzle-svg');
    const svgSize = N * CELL_SIZE;
    svg.setAttribute('width',   svgSize);
    svg.setAttribute('height',  svgSize);
    svg.setAttribute('viewBox', `0 0 ${svgSize} ${svgSize}`);

    const cellsLayer   = svgEl('g', { id: 'cells-layer' });
    const circlesLayer = svgEl('g', { id: 'circles-layer' });
    const flashLayer   = svgEl('g', { id: 'flash-layer' });
    const lettersLayer = svgEl('g', { id: 'letters-layer' });
    const labelsLayer  = svgEl('g', { id: 'labels-layer' });
    svg.append(cellsLayer, circlesLayer, flashLayer, lettersLayer, labelsLayer);

    for (let n = 1; n <= N * N; n++) {
      const r = rowOf(n), c = colOf(n);
      const x = (c - 1) * CELL_SIZE, y = (r - 1) * CELL_SIZE;

      if (n === CENTER_N) {
        const rect = svgEl('rect', {
          id: 'cell-center', x, y,
          width: CELL_SIZE, height: CELL_SIZE,
          class: 'cell-center',
        });
        cellsLayer.appendChild(rect);
        continue;
      }

      const bIdx = bandOf(n);
      const bandClass = bIdx % 2 === 0 ? 'band-even' : 'band-odd';
      const rect = svgEl('rect', {
        id: `cell-${n}`, x, y,
        width: CELL_SIZE, height: CELL_SIZE,
        class: `cell ${bandClass}`,
      });
      rect.addEventListener('click', () => onCellClick(n));
      cellsLayer.appendChild(rect);
      cellRects[n] = rect;

      const cx = x + CELL_SIZE / 2, cy = y + CELL_SIZE / 2;
      const text = svgEl('text', {
        id: `letter-${n}`,
        x: cx, y: cy,
        class: 'cell-letter',
      });
      lettersLayer.appendChild(text);
      letterTexts[n] = text;
    }

    // Band letter labels at top-left corner of each band
    for (let k = 0; k < numBands; k++) {
      const n = cellId(k+1, k+1);
      const r = rowOf(n), c = colOf(n);
      const x = (c-1) * CELL_SIZE + 2;
      const y = (r-1) * CELL_SIZE + 9;
      const label = svgEl('text', { x, y, 'font-size': '8', class: 'band-label' });
      label.textContent = BAND_LETTERS[k];
      labelsLayer.appendChild(label);
    }

    function renderCircles(groups, cellsForGroup) {
      groups.forEach((group, gi) => {
        let offset = 0;
        group.entries.forEach(entry => {
          if (entry.styles && Array.isArray(entry.styles.circle)) {
            entry.styles.circle.forEach(pos => {
              const n = cellsForGroup(gi)[offset + pos];
              if (n === undefined) return;
              const cx = (colOf(n) - 1) * CELL_SIZE + CELL_SIZE / 2;
              const cy = (rowOf(n) - 1) * CELL_SIZE + CELL_SIZE / 2;
              circlesLayer.appendChild(svgEl('circle', { class: 'style-circle', cx, cy, r: CELL_SIZE / 2 - 2 }));
            });
          }
          offset += entry.length;
        });
      });
    }
    renderCircles(data.rows,  r => rowCellsMap[r]);
    renderCircles(data.bands, k => bandCellsMap[k]);

    const rowLabelsDiv = document.getElementById('row-labels');
    for (let r = 1; r <= N; r++) {
      const div = document.createElement('div');
      div.className = 'row-label';
      div.textContent = r;
      rowLabelsDiv.appendChild(div);
    }

    // ── Header & clues ────────────────────────────────────────────────────────
    const rowsCluesList  = document.getElementById('rows-clues');
    const bandsCluesList = document.getElementById('bands-clues');

    // Builds a clue cluster for one row/band. parentLabel is the row number or band
    // letter, shown only on the first entry; subsequent entries get a blank parent so
    // entry boundaries within the row/band are not revealed. onGroupClick(gi) is called
    // when the user clicks anywhere in the group, navigating to that row/band.
    function buildClues(groups, listEl, itemStore, parentLabel, onGroupClick) {
      groups.forEach((group, gi) => {
        const groupLi = document.createElement('li');
        groupLi.className = 'clue-group';
        groupLi.addEventListener('click', e => {
          // A clue can render a real link (see docs/CROSS_TOOL_SPEC.md ->
          // Markdown formatting) — let it open on its own rather than also
          // treating the click as navigating to this row/band.
          if (e.target.closest('a')) return;
          onGroupClick(gi);
        });
        const innerUl = document.createElement('ul');
        group.entries.forEach((entry, i) => {
          const li = document.createElement('li');
          li.className = 'clue-item';
          const labelEl = document.createElement('span');
          labelEl.className = 'clue-label';
          const parentEl = document.createElement('span');
          parentEl.className = 'clue-parent';
          parentEl.textContent = i === 0 ? parentLabel(gi) : '';
          const letterEl = document.createElement('span');
          letterEl.className = 'clue-letter';
          letterEl.textContent = String.fromCharCode(97 + i);
          labelEl.append(parentEl, letterEl);
          const textEl = document.createElement('span');
          textEl.className = 'clue-text';
          textEl.innerHTML = entry.clue; // pre-rendered markdown HTML — see shared/build/renderMarkdown.js
          li.append(labelEl, textEl);
          innerUl.appendChild(li);
        });
        groupLi.appendChild(innerUl);
        listEl.appendChild(groupLi);
        itemStore.push(groupLi);
      });
    }
    buildClues(data.rows,  rowsCluesList,  rowClueGroups,  r => String(r + 1),
      gi => { mode = 'row';  focusCell(rowCellsMap[gi][0]); });
    buildClues(data.bands, bandsCluesList, bandClueGroups, k => BAND_LETTERS[k],
      gi => { mode = 'band'; focusCell(bandCellsMap[gi][0]); });

    renderByline(data);
    renderInstructions(data);

    // ── Event wiring ──────────────────────────────────────────────────────────
    document.getElementById('mode-toggle').addEventListener('click', e => {
      const btn = e.target.closest('.toggle-opt');
      if (!btn) return;
      mode = btn.dataset.mode;
      focusCell(activeN);
    });

    function onCellClick(n) {
      if (n === activeN) {
        mode = MODES[mode].other;
      }
      focusCell(n);
    }

    const keysOverlay = setupKeysOverlay(
      [
        ['Tab',       'Next row or band'],
        ['Shift+Tab', 'Previous row or band'],
        ['↑ ↓ ← →',   'Move one cell'],
        ['⌫',         'Clear current cell'],
        ['Space',     'Clear and advance'],
        ['Enter',     'Multi-letter cell'],
        ['.',         'Toggle row / band mode'],
      ],
      refocus
    );
    setupKeydown(e => {
      if (latch.solved) return;
      if (e.key === '.') {
        e.preventDefault();
        mode = MODES[mode].other;
        focusCell(activeN);
        return;
      }

      if (e.key === 'Tab') {
        e.preventDefault();
        const m = MODES[mode];
        const step = e.shiftKey ? -1 : 1;
        focusCell(m.cells[(m.index() + step + m.count) % m.count][0]);
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        toggleRebus();
        return;
      }

      if (e.key === 'Backspace') {
        e.preventDefault();
        if (composer.backspace(activeN)) {
          syncUI();
          saveState();
          return;
        }
        if (getCellLetter(activeN)) {
          setCellLetter(activeN, '');
          syncUI();
        } else {
          const prev = prevCell(activeN);
          setCellLetter(prev, '');
          focusCell(prev);   // focusCell syncUIs and refocuses the hidden input
        }
        saveState();
        return;
      }

      if (e.key === ' ') {
        e.preventDefault();
        setCellLetter(activeN, '');
        focusCell(nextCell(activeN));
        saveState();
        return;
      }

      if (e.key === 'ArrowRight') { e.preventDefault(); const t = arrowTarget(activeN, 0, 1);  if (t) focusCell(t); return; }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); const t = arrowTarget(activeN, 0, -1); if (t) focusCell(t); return; }
      if (e.key === 'ArrowDown')  {
        e.preventDefault();
        const t = arrowTarget(activeN, 1, 0);
        if (t) focusCell(t); else scrollByKey('ArrowDown');
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        const t = arrowTarget(activeN, -1, 0);
        if (t) focusCell(t); else scrollByKey('ArrowUp');
        return;
      }

      if (e.key === 'PageDown') { e.preventDefault(); scrollByKey('PageDown'); return; }
      if (e.key === 'PageUp')   { e.preventDefault(); scrollByKey('PageUp'); return; }
    }, { keysOverlay });

    document.getElementById('hidden-input').addEventListener('input', e => {
      const typed = normalize(e.target.value).toUpperCase();
      e.target.value = '';
      if (latch.solved || !typed) return;
      timer.onFirstInput();
      // typeLetter applies the slice(-1) rule on the non-composing path; advance only
      // when it says so, so capacity never triggers an advance.
      if (composer.typeLetter(activeN, typed)) focusCell(nextCell(activeN));
      else syncUI();

      // One checker call for both modes — advance first, then check, so the cursor
      // never lags a keystroke behind the hash comparison.
      checker.checkIfFilled();
      saveState();
    });


    function resetBoard() {
      resetAndRefocus({
        composer, clearState, timer, latch,
        clearBoard() {
          for (const n of CELL_IDS) {
            delete cellLetters[n];
            setLetterText(letterTexts[n], '');
            setCorrect(n, false);
          }
          flashLayer.replaceChildren();
          mode = 'row';
        },
        focusInitial: () => focusCell(rowCellsMap[0][0]),
      });
    }

    setupControls({
      checkBtn: document.getElementById('check-btn'), hashed: data.hashed, onCheck: checkCell,
      onClear: resetBoard, refocus, key: saveKey,
    });

    // ── Restore & focus ───────────────────────────────────────────────────────
    // Structurally a no-op here — markAllCorrect() paints exactly what applyState
    // restored, and MB marks no clue items — but the epilogue stays identical across
    // all four engines so the shared restore contract has one shape, not two.
    const resumeCell = restoreAndSeal({ restoreState, checker, latch, composer });
    // Resume on the restored composing cell — see docs/CROSS_TOOL_SPEC.md → "Composition
    // is saved state" for why this is load-bearing, not a convenience.
    focusCell(resumeCell === null ? activeN : resumeCell);
  }

  document.addEventListener('DOMContentLoaded', init);

})();
</script>
</body>
</html>
