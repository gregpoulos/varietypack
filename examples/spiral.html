<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral</title>
  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.4; }

/* Tools with a fixed active-clue bar need body padding to clear it */
body.tool-snake-charmer,
body.tool-spiral { padding-top: 56px; }

#active-clue-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 5px 16px 4px;
}

.active-clue-row {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-size: 0.875rem;
  line-height: 1.4;
}

#active-clue-secondary {
  font-size: 0.8rem;
  opacity: 0.6;
}

.active-clue-num {
  font-weight: bold;
  flex-shrink: 0;
}

.active-clue-text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#instructions {
  max-width: 600px;
  margin: 0 auto;
}

.clue-item {
  font-size: 0.875rem;
  padding: 2px 6px;
  border-radius: 2px;
}

.cell        { cursor: pointer; }
.cell-letter { pointer-events: none; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
.cell-num    { pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
.style-circle { pointer-events: none; }

#controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

button {
  cursor: pointer;
  border-radius: 4px;
  border: 1px solid;
  padding: 6px 14px;
  font-size: 0.875rem;
}

button:disabled { opacity: 0.4; cursor: default; }

#clear-btn::after {
  content: 'Sure?';
  display: block;
  height: 0;
  overflow: hidden;
  visibility: hidden;
}

#hidden-input {
  position: fixed;
  left: -9999px;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.puzzle-toggle { display: flex; border-radius: 4px; overflow: hidden; }
.puzzle-toggle .toggle-opt { border-radius: 0; border: none; flex: 1; white-space: nowrap; }
.toggle-opt { user-select: none; cursor: pointer; }

#congrats-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
/* The `hidden` attribute is UA-origin `display: none`, which the author
   `display: flex` above overrides — restate the hide at higher specificity. */
#congrats-overlay[hidden] { display: none; }

#keys-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  z-index: 50;
  cursor: pointer;
  font-size: 1rem;
  font-weight: bold;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

#keys-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
#keys-overlay[hidden] { display: none; }

@keyframes flash-wrong {
  0%   { opacity: 1; }
  20%  { opacity: 1; }
  100% { opacity: 0; }
}
.flash-wrong-overlay {
  fill: #ef9a9a;
  pointer-events: none;
  animation: flash-wrong 600ms ease-out forwards;
}

.puzzle-header { margin-bottom: 16px; }
h1.title { font-size: 1.5rem; font-weight: bold; line-height: 1; }
.byline  { font-size: 0.875rem; margin-top: 4px; }

.puzzle-main {
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 16px 20px;
}


#grid-wrap {
  display: flex;
  justify-content: center;
  width: 100%;
}

#spiral-svg {
  max-width: min(100%, 500px);
  height: auto;
  display: block;
}

.puzzle-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) min(500px, 100%) minmax(0, 1fr);
  grid-template-areas: "left center right";
  gap: 0 32px;
  align-items: start;
}

.puzzle-center        { grid-area: center; }
.clue-section-inward  { grid-area: left; }
.clue-section-outward { grid-area: right; }

.puzzle-center {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

@media (max-width: 880px) {
  .puzzle-body {
    display: block;
  }
  .clue-section-inward,
  .clue-section-outward {
    margin-top: 24px;
  }
}

.clue-section h2 {
  font-size: 1rem;
  font-weight: bold;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.clue-item {
  display: flex;
  gap: 8px;
  cursor: pointer;
  list-style: none;
}

.clue-range {
  min-width: 5em;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.clue-item.correct .clue-text {
  text-decoration: line-through;
  opacity: 0.5;
}

#direction-chevron { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

/* theme-base: neutral defaults — every --theme-* var a theme can override.
   A theme's <name>-tokens.css need only override what differs from these. */
:root {
  /* Fonts */
  --theme-font-body:    system-ui, -apple-system, sans-serif;
  --theme-font-display: var(--theme-font-body);
  --theme-font-button:  var(--theme-font-body);
  --theme-font-cell:    var(--theme-font-body);

  /* Masthead / title / byline */
  --theme-color-header-rule: #cccccc;
  --theme-title-tracking:    normal;
  --theme-title-transform:   none;
  --theme-color-title:       var(--theme-color-text);
  --theme-byline-style:      normal;
  --theme-byline-size:       0.875rem;

  /* Page */
  --theme-color-bg:    #ffffff;
  --theme-color-text:  #111111;
  --theme-color-muted: #555555;

  /* Bars / borders */
  --theme-color-bar-border:  #cccccc;
  --theme-color-soft-border: #cccccc;

  /* Primary button */
  --theme-color-btn-bg:       #333333;
  --theme-color-btn-text:     #ffffff;
  --theme-color-btn-hover:    #555555;
  --theme-color-btn-disabled: #999999;
  --theme-button-tracking:    0.05em;

  /* Secondary / toggle button colors */
  --theme-color-btn2-bg:     #eeeeee;
  --theme-color-btn2-border: #aaaaaa;
  --theme-color-btn2-hover:  #e0e0e0;

  /* Clear button */
  --theme-color-clear-fg:       #999999;
  --theme-color-clear-hover-fg: #333333;

  /* Grid cells */
  --theme-color-cell-bg:     #ffffff;
  --theme-color-cell-stroke: #999999;
  --theme-color-cell-text:   #111111;

  /* Cell / clue states */
  --theme-color-highlight:            #deeeff;
  --theme-color-band-even:            var(--theme-color-cell-bg);
  --theme-color-highlight-band-even:  var(--theme-color-highlight);
  --theme-color-active:               #b8d4f5;
  --theme-color-active-stroke:        #1e5799;
  --theme-color-clue-hover:           #eeeeee;
  --theme-color-secondary-entry:      #f0f0f0;
  --theme-clue-radius:                2px;

  /* Snake-charmer-specific secondary-active cell */
  --theme-color-secondary-active:        #7aaed8;
  --theme-color-secondary-active-stroke: #3a72a8;

  /* Correct */
  --theme-color-correct-bg:     #c8e6c9;
  --theme-color-correct-stroke: #4caf50;
  --theme-color-correct-text:   #1a6e22;

  /* Decorations */
  --theme-color-circle:      #cccccc;
  --theme-color-curl:        #aaaaaa;
  --theme-color-cell-center: #222222;

  /* Instructions */
  --theme-color-instructions: var(--theme-color-muted);
  --theme-instructions-size:  0.85rem;

  /* Congrats / overlay */
  --theme-color-overlay:         rgba(0, 0, 0, 0.45);
  --theme-color-congrats-bg:     #2e7d32;
  --theme-color-congrats-border: #1b5e20;
  --theme-color-congrats-text:   #ffffff;
  --theme-card-radius:           10px;

  /* Done-wrong */
  --theme-color-wrong-bg:     #fff3e0;
  --theme-color-wrong-border: #e65100;
  --theme-color-wrong-text:   var(--theme-color-text);

  /* Danger */
  --theme-color-danger: #b91c1c;
}

/* Broadsheet theme — newspaper palette. Overrides theme-base defaults. */
:root {
  --theme-font-body:    Georgia, 'Times New Roman', serif;
  --theme-font-display: Georgia, 'Times New Roman', serif;
  --theme-font-button:  Georgia, 'Times New Roman', serif;
  --theme-font-cell:    Georgia, 'Times New Roman', serif;

  --theme-color-header-rule: #222222;
  --theme-title-tracking:    0.08em;
  --theme-title-transform:   uppercase;
  --theme-byline-style:      italic;

  --theme-color-bg:    #f9f7f1;

  --theme-color-bar-border:  #bbbbbb;
  --theme-color-soft-border: #bbbbbb;

  --theme-color-btn-bg:    #222222;
  --theme-color-btn-hover: #444444;

  --theme-color-btn2-bg:    #f0ece0;
  --theme-color-btn2-hover: #e4e0d4;

  --theme-color-band-even:           #e8e8e8;
  --theme-color-highlight-band-even: #cee2f8;
  --theme-color-clue-hover:          #ede8d2;
  --theme-color-secondary-entry:     #f5f0e0;

  --theme-color-circle: #bbbbbb;
}

/* theme-components: every tool-agnostic selector, driven entirely by --theme-*.
   Per-tool namespaced sections live at the bottom (body class hook: .tool-<name>).

   SVG cell states (.cell.active-entry / .cell.active-cell) live here safely:
   marching-bands' band rules use :where() (specificity 0,1,0) so these 0,2,0
   rules always win regardless of source order. */

body {
  background:   var(--theme-color-bg);
  color:        var(--theme-color-text);
  font-family:  var(--theme-font-body);
}

/* Masthead */
.puzzle-header {
  text-align:     center;
  border-bottom:  2px solid var(--theme-color-header-rule);
  padding-bottom: 12px;
  margin-bottom:  24px;
}
h1.title {
  font-family:     var(--theme-font-display);
  font-size:       2rem;
  letter-spacing:  var(--theme-title-tracking);
  text-transform:  var(--theme-title-transform);
  color:           var(--theme-color-title);
}
.byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
  font-size:  var(--theme-byline-size);
  margin-top: 6px;
}

#active-clue-bar {
  background:    var(--theme-color-bg);
  border-bottom: 1px solid var(--theme-color-bar-border);
}

#instructions {
  color:         var(--theme-color-instructions);
  font-size:     var(--theme-instructions-size);
  line-height:   1.5;
  margin-bottom: 20px;
}
#instructions p + p { margin-top: 0.6em; }

.clue-item { border-radius: var(--theme-clue-radius); }

.clue-section h2 {
  color:          var(--theme-color-text);
  border-bottom:  1px solid var(--theme-color-soft-border);
  padding-bottom: 4px;
}

/* Primary button */
#check-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.95rem;
  padding:        8px 22px;
  background:     var(--theme-color-btn-bg);
  color:          var(--theme-color-btn-text);
  border:         none;
  letter-spacing: var(--theme-button-tracking);
}
#check-btn:hover:not(:disabled) { background: var(--theme-color-btn-hover); }
#check-btn:disabled { background: var(--theme-color-btn-disabled); cursor: default; }

/* Clear button */
#clear-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.8rem;
  padding:        5px 12px;
  background:     transparent;
  color:          var(--theme-color-clear-fg);
  border-color:   var(--theme-color-clear-fg);
  letter-spacing: var(--theme-button-tracking);
}
#clear-btn:hover { color: var(--theme-color-clear-hover-fg); border-color: var(--theme-color-clear-hover-fg); }
#clear-btn.armed { color: var(--theme-color-danger);         border-color: var(--theme-color-danger); }

/* Puzzle toggle (direction / mode / loop) */
.puzzle-toggle { border: 1px solid var(--theme-color-btn2-border); }
.toggle-opt {
  font-family:    var(--theme-font-button);
  font-size:      0.9rem;
  font-weight:    bold;
  padding:        6px 16px;
  background:     var(--theme-color-btn2-bg);
  color:          var(--theme-color-muted);
  letter-spacing: 0.04em;
}
.toggle-opt:not(:last-child)   { border-right: 1px solid var(--theme-color-btn2-border); }
.toggle-opt.active             { background: var(--theme-color-btn-bg); color: var(--theme-color-btn-text); cursor: default; }
.toggle-opt:not(.active):hover { background: var(--theme-color-btn2-hover); }

/* SVG cell states */
.cell              { fill: var(--theme-color-cell-bg); stroke: var(--theme-color-cell-stroke); stroke-width: 0.5; }
.cell.active-entry { fill: var(--theme-color-highlight); }
.cell.active-cell  { fill: var(--theme-color-active); stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }
.cell.correct      { fill: var(--theme-color-correct-bg); stroke: var(--theme-color-correct-stroke); stroke-width: 0.5; }
.cell.correct.active-cell { stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }

.style-circle { fill: none; stroke: var(--theme-color-circle); stroke-width: 1; }

/* No font-size on .cell-letter or .cell-num: Spiral sizes these dynamically as SVG
   presentation attributes; a CSS font-size overrides them silently. Per-tool sizes
   live in the namespaced sections below. */
.cell-letter         { font-family: var(--theme-font-cell); fill: var(--theme-color-cell-text); }
.cell-letter.correct { fill: var(--theme-color-correct-text); }
.cell-num            { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }

/* Congrats modal (centered in the shared #congrats-overlay from base.css) */
#congrats-overlay { background: var(--theme-color-overlay); }

/* Keys button (fixed bottom-right corner, created by setupKeysOverlay) */
#keys-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#keys-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Keys modal (centered in the shared #keys-overlay from base.css) */
#keys-overlay { background: var(--theme-color-overlay); }
#keys-modal {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border:        2px solid var(--theme-color-soft-border);
  border-radius: var(--theme-card-radius);
  padding:       20px 24px;
  min-width:     220px;
}
#keys-modal-header {
  display:         flex;
  justify-content: space-between;
  align-items:     center;
  margin-bottom:   12px;
  font-weight:     bold;
  font-size:       1rem;
  letter-spacing:  0.03em;
}
#keys-close {
  background: transparent;
  border:     none;
  cursor:     pointer;
  font-size:  1.1rem;
  line-height: 1;
  padding:    0 0 0 12px;
  color:      var(--theme-color-text);
}
/* Suppress the ring for mouse/programmatic focus, but keep it for keyboard
   users — the close button is auto-focused when the modal opens. */
#keys-close:focus:not(:focus-visible) { outline: none; }
#keys-close:hover { opacity: 0.65; }
#keys-modal table { border-collapse: collapse; width: 100%; }
#keys-modal td    { padding: 3px 0; vertical-align: middle; }
#keys-modal td:first-child { padding-right: 14px; white-space: nowrap; }
kbd {
  display:       inline-block;
  background:    var(--theme-color-btn2-bg);
  border:        1px solid var(--theme-color-btn2-border);
  border-radius: 3px;
  padding:       1px 5px;
  font-family:   var(--theme-font-ui, monospace);
  font-size:     0.78rem;
  color:         var(--theme-color-text);
}

@keyframes congrats-pop {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}
#congrats {
  background:     var(--theme-color-congrats-bg);
  color:          var(--theme-color-congrats-text);
  border:         2px solid var(--theme-color-congrats-border);
  border-radius:  var(--theme-card-radius);
  padding:        28px 36px;
  font-size:      1.2rem;
  font-weight:    bold;
  text-align:     center;
  letter-spacing: 0.04em;
  animation:      congrats-pop 200ms ease-out;
}

#done-wrong {
  margin-top:     20px;
  padding:        16px 24px;
  border-radius:  var(--theme-card-radius);
  background:     var(--theme-color-wrong-bg);
  border:         2px solid var(--theme-color-wrong-border);
  color:          var(--theme-color-wrong-text);
  font-size:      1.05rem;
  font-weight:    bold;
  text-align:     center;
  letter-spacing: 0.04em;
}

/* ── Per-tool selectors (body class hook: .tool-<name>) ─────────────────────
   Each tool's <body> carries a class like .tool-snake-charmer so these rules
   scope to the right tool without a separate per-tool CSS file. */

/* Snake Charmer */
.tool-snake-charmer .cell-num    { font-size: 9px; }
.tool-snake-charmer .cell-letter { font-size: 14px; }
.tool-snake-charmer .cell.secondary-entry { fill: var(--theme-color-secondary-entry); }
.tool-snake-charmer .cell.active-cell.secondary-entry {
  fill:         var(--theme-color-secondary-active);
  stroke:       var(--theme-color-secondary-active-stroke);
  stroke-width: 1.5;
}
/* Hover first so active/secondary overrides it at equal or higher specificity. */
.tool-snake-charmer .clue-item { margin-bottom: 5px; font-size: 0.88rem; line-height: 1.4; padding: 2px 6px 2px 2px; }
.tool-snake-charmer .clue-item:hover           { background: var(--theme-color-clue-hover); }
.tool-snake-charmer .clue-item.active-clue     { background: var(--theme-color-active); }
.tool-snake-charmer .clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-snake-charmer .clue-item.correct .clue-text { color: var(--theme-color-correct-text); text-decoration: line-through; }

/* Marching Bands — band fills are unnamespaced to keep :where() specificity
   below .cell.active-entry (0,2,0); .band-even/.band-odd are MB-exclusive. */
.cell:where(.band-even) { fill: var(--theme-color-band-even); }
.cell:where(.band-odd)  { fill: var(--theme-color-cell-bg); }
.cell.band-even.active-entry { fill: var(--theme-color-highlight-band-even); }
.tool-marching-bands .cell-letter { font-size: 14px; }
.tool-marching-bands .band-label  { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }
.tool-marching-bands .row-label   { font-family: var(--theme-font-cell); color: var(--theme-color-text); }
.tool-marching-bands .cell-center { fill: var(--theme-color-cell-center); }
.tool-marching-bands .clue-group:hover          { background: var(--theme-color-clue-hover); }
.tool-marching-bands .clue-group.active-clue    { background: var(--theme-color-active); }
.tool-marching-bands .clue-group.secondary-entry { background: var(--theme-color-secondary-entry); }

/* Spiral — no .cell-letter font-size (see comment above). */
.tool-spiral .clue-item { padding: 2px 6px 2px 2px; }
.tool-spiral .clue-item:hover           { background: var(--theme-color-clue-hover); }
.tool-spiral .clue-item.active-clue     { background: var(--theme-color-active); }
.tool-spiral .clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-spiral .clue-item.correct .clue-text { color: var(--theme-color-correct-text); text-decoration: line-through; }
.tool-spiral #center-curl       { fill: none; stroke: var(--theme-color-curl); stroke-width: 1.4; stroke-linecap: round; }
.tool-spiral #direction-chevron { stroke: var(--theme-color-active-stroke); stroke-width: 0.9; opacity: 0.5; }
.tool-spiral .active-clue-dir {
  font-size:      0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color:          var(--theme-color-muted);
  opacity:        0.6;
  flex-shrink:    0;
}

/* Shared print resets — the final override layer for printing, applied to
   every tool and theme. Forces plain ink on white regardless of solve state
   or theme. Declarations are !important by design so this layer wins over any
   theme rule regardless of its selector specificity or source order — a tool
   theme that later adds a higher-specificity highlight rule can't silently
   defeat the print reset. A tool's print.css that needs to override a reset
   here must also use !important. */
@media print {
  /* Hide interaction chrome */
  #active-clue-bar,
  #controls,
  #congrats-overlay,
  #keys-overlay,
  #keys-btn,
  #done-wrong { display: none !important; }

  body { padding-top: 0 !important; }
  h1.title { font-size: 1.4rem !important; }

  /* Cell state → plain ink on white */
  .cell,
  .cell.active-entry,
  .cell.active-cell,
  .cell.correct { fill: #fff !important; stroke: #999 !important; stroke-width: 1 !important; }
  .cell-letter.correct { fill: #111 !important; }

  /* Clue highlight / strike-through reset */
  .clue-item.active-clue,
  .clue-item.secondary-entry { background: transparent !important; }
  .clue-item.correct .clue-text { color: inherit !important; text-decoration: none !important; }
}

/* Shared print resets live in shared/themes/print-base.css (concatenated just
   before this file). Only spiral-specific print rules belong here. */
@media print {
  #direction-chevron { display: none; }

  .puzzle-main   { padding: 8px 16px; }
  .puzzle-header { margin-bottom: 8px; }
  .byline        { font-size: 0.8rem; }
  #instructions  { font-size: 0.8rem; margin-bottom: 8px; }
  .clue-section h2 { margin-bottom: 4px; }
  .clue-item     { padding: 1px 4px; }
  .cell-num      { fill: #555; }

  .puzzle-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "center center"
      "left   right";
  }
  .clue-section { break-inside: avoid; }
}

@media print and (orientation: landscape) {
  .puzzle-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) min(40%, 500px) minmax(0, 1fr);
    grid-template-areas: "left center right";
    gap: 0 16px;
  }
}
</style>
</head>

// Shared browser-engine "chrome": the UI-surround logic that is identical across
// every puzzle tool's engine.js — byline, instructions, the two-click Clear
// button, scroll-key forwarding, the localStorage save/restore/clear scaffolding,
// the shared keydown guard wrapper, and the congrats-overlay dismiss handlers.
// Each engine calls these from inside its own init(); the tool-specific cores
// (SVG rendering, navigation, syncUI, answer checking) stay in the engine.
// Injected into the HTML bundle as browser globals by getSharedBundle(); the
// dual-mode guard at the bottom keeps the pattern consistent with the other
// shared/ files even though no Node code requires it.

// author + date → `.byline`. Missing pieces are simply omitted; an empty result
// leaves the element blank.
function renderByline(data) {
  const byline = document.querySelector('.byline');
  if (!byline) return;
  const parts = [];
  if (data.author) parts.push('by ' + data.author);
  if (data.date) parts.push(String(data.date));

// `#instructions`, which is revealed (hidden=false) only when content exists.
function renderInstructions(data) {

  if (!data.instructions || !el) return;

    p.textContent = para.trim();
    el.appendChild(p);

// `refocus` (optional) restores puzzle focus after the arming click so the

function setupClearButton(clearBtn, onConfirmed, refocus) {
  let armed = false;

  clearBtn.addEventListener('click', () => {
    if (!armed) {

      clearBtn.textContent = 'Sure?';
      clearBtn.classList.add('armed');

        clearBtn.textContent = 'Clear';
        clearBtn.classList.remove('armed');

      armed = false;
      clearBtn.textContent = 'Clear';

// restores focus there.
function setupCongratsOverlay(overlay, onDismiss) {
  function dismiss() {
    overlay.hidden = true;
    onDismiss();
  }
  overlay.addEventListener('click', e => {
    if (e.target === overlay) dismiss();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !overlay.hidden) dismiss();
  });
}

// Builds and wires the keyboard-shortcuts modal from a list of [keys, description]
// pairs (the only part that differs between tools). Creates the #keys-btn trigger
// (fixed bottom-right corner) and the #keys-overlay > #keys-modal dialog, both
// appended to <body>. Returns the overlay element for setupKeydown's keysOverlay
// guard.
//
// Opens on button click or ? keypress; closes on backdrop click, close-button
// click, or Escape. Opening moves focus to the close button so keystrokes can't
// leak into the grid while the modal is up; `refocus` restores puzzle focus on close.
function setupKeysOverlay(shortcuts, refocus) {
  const btn = document.createElement('button');
  btn.id = 'keys-btn';
  btn.type = 'button';
  btn.setAttribute('aria-label', 'Keyboard shortcuts');
  btn.textContent = '?';
  document.body.appendChild(btn);

  const overlay = document.createElement('div');
  overlay.id = 'keys-overlay';
  overlay.hidden = true;

  const modal = document.createElement('div');
  modal.id = 'keys-modal';
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-label', 'Keyboard shortcuts');

  const header = document.createElement('div');
  header.id = 'keys-modal-header';
  const heading = document.createElement('span');
  heading.textContent = 'Keyboard shortcuts';
  const closeBtn = document.createElement('button');
  closeBtn.id = 'keys-close';
  closeBtn.type = 'button';
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.textContent = '✕';
  header.append(heading, closeBtn);

  const table = document.createElement('table');
  for (const [keys, desc] of shortcuts) {
    const row = document.createElement('tr');
    const keyCell = document.createElement('td');
    const kbd = document.createElement('kbd');
    kbd.textContent = keys;
    keyCell.appendChild(kbd);
    const descCell = document.createElement('td');
    descCell.textContent = desc;
    row.append(keyCell, descCell);
    table.appendChild(row);
  }

  modal.append(header, table);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  function open() {
    overlay.hidden = false;
    closeBtn.focus();
  }
  function close() {
    overlay.hidden = true;
    refocus();
  }
  btn.addEventListener('click', () => overlay.hidden ? open() : close());
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', e => {
    if (!document.hasFocus()) return;
    if (e.key === 'Escape' && !overlay.hidden) { close(); return; }
    if (e.key === '?' && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      overlay.hidden ? open() : close();
    }
  });
  return overlay;
}

function setupTimer({ onPause, listenVisibility, now: _now = Date.now } = {}) {
  let activeMs = 0;
  let runningSince = null;
  let started = false;

  function onFirstInput() {
    if (started) return;
    started = true;
    runningSince = _now();
  }

  // Resets all timer state to initial values — used by resetBoard in each
  // engine so a cleared puzzle starts timing fresh from the next keystroke.
  function reset() {
    started = false;
    runningSince = null;
    activeMs = 0;
  }

  function getElapsedMs() {
    return activeMs + (runningSince !== null ? _now() - runningSince : 0);
  }

  function restoreMs(ms) {
    activeMs = (typeof ms === 'number' && ms >= 0) ? ms : 0;
  }

  function handleVisibility(hidden) {
    if (hidden) {
      if (runningSince !== null) {
        activeMs += _now() - runningSince;
        runningSince = null;
      }
      // Only flush to storage if the clock was ever started — an idle tab that
      // never received input has nothing new to persist.
      if (started && onPause) onPause();
    } else {
      // Guard against unpaired visible events (bfcache, iOS app-switcher) that
      // would overwrite runningSince and silently drop accumulated time.
      if (started && runningSince === null) runningSince = _now();
    }
  }

  const register = listenVisibility ??
    (fn => document.addEventListener('visibilitychange', () => fn(document.hidden)));
  register(handleVisibility);

  return { onFirstInput, reset, getElapsedMs, restoreMs };
}

function makeCompletionLatch({
  puzzleRoot, kind, title, date, getBoardHash, getSolution, getElapsedMs,
  _postMessage,
}) {
  let fired = false;
  const pm = _postMessage ?? ((msg) => window.parent?.postMessage(msg, '*'));

  function sealIfSolved(isSolved) {
    if (isSolved) fired = true;
  }

  function reset() { fired = false; }

  function check(isSolved) {
    if (fired || !isSolved) return;
    fired = true;
    const timeMs = getElapsedMs();
    const solution = getSolution();
    const boardHash = getBoardHash();
    const detail = { boardHash, kind, title, date, timeMs, solution };
    puzzleRoot.dispatchEvent(new CustomEvent('varietypack:complete', {
      bubbles: true, composed: true, detail,
    }));
    pm({ type: 'varietypack:complete', boardHash, kind, title, date, timeMs });
  }

  return { check, sealIfSolved, reset };
}

if (typeof module !== 'undefined') {
  module.exports = {
    renderByline, renderInstructions, setupClearButton,
    scrollByKey, storageKey, setupStorage, flashWrong,
    setupKeydown, setupCongratsOverlay, setupKeysOverlay, setupTimer,
    makeCompletionLatch,
  };
}

/* global window, document */
(function () {
  'use strict';

  function init() {
    // ── Data & constants ────────────────────────────────────────────────────
    const data       = window.PUZZLE_DATA;
    const totalCells = data.cells.length;

    // ── Geometry & index maps ────────────────────────────────────────────────
    const NS = 'http://www.w3.org/2000/svg';

    function svgEl(tag, attrs) {
      const el = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function polar(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }
    function f(n) { return n.toFixed(3); }

    function cellPath(cell) {
      const { theta_start: ts, theta_end: te,
              r_inner_start: ris, r_outer_start: ros,
              r_inner_end:   rie, r_outer_end:   roe } = cell;
      const laf       = (te - ts > Math.PI) ? 1 : 0;
      const r_out_arc = (ros + roe) / 2;
      const r_in_arc  = (ris + rie) / 2;
      const [ax, ay] = polar(ris, ts);
      const [bx, by] = polar(ros, ts);
      const [cx, cy] = polar(roe, te);
      const [dx, dy] = polar(rie, te);
      return `M${f(ax)},${f(ay)} L${f(bx)},${f(by)} ` +
             `A${f(r_out_arc)},${f(r_out_arc)} 0 ${laf},1 ${f(cx)},${f(cy)} ` +
             `L${f(dx)},${f(dy)} ` +
             `A${f(r_in_arc)},${f(r_in_arc)} 0 ${laf},0 ${f(ax)},${f(ay)}Z`;
    }

    const inwardMap         = {};
    const inwardEntryCells  = data.inward.map(() => []);
    let cellPos = 1;
    data.inward.forEach((entry, i) => {
      for (let j = 0; j < entry.length; j++) {
        inwardMap[cellPos] = { entryIndex: i, posInEntry: j };
        inwardEntryCells[i].push(cellPos);
        cellPos++;
      }
    });

    const outwardMap        = {};
    const outwardEntryCells = data.outward.map(() => []);
    cellPos = totalCells;
    data.outward.forEach((entry, i) => {
      for (let j = 0; j < entry.length; j++) {
        outwardMap[cellPos] = { entryIndex: i, posInEntry: j };
        outwardEntryCells[i].push(cellPos);
        cellPos--;
      }
    });

    // ── State ────────────────────────────────────────────────────────────────
    let activeCell = 1;
    let direction  = 'inward';
    let congratsDismissed = false;

    // ── Logic functions ──────────────────────────────────────────────────────
    function entryFirstCell(dir, entryIndex) {
      return dir === 'inward'
        ? inwardEntryCells[entryIndex][0]
        : outwardEntryCells[entryIndex][0];
    }

    function entryLastCell(dir, entryIndex) {
      const arr = dir === 'inward' ? inwardEntryCells[entryIndex] : outwardEntryCells[entryIndex];
      return arr[arr.length - 1];
    }

    function nextInDir(cellNum, dir) {
      const map     = dir === 'inward' ? inwardMap : outwardMap;
      const entries = dir === 'inward' ? data.inward : data.outward;
      const { entryIndex, posInEntry } = map[cellNum];
      if (posInEntry < entries[entryIndex].length - 1) {
        return dir === 'inward' ? cellNum + 1 : cellNum - 1;
      }
      const next = (entryIndex + 1) % entries.length;
      return entryFirstCell(dir, next);
    }

    function prevInDir(cellNum, dir) {
      const map     = dir === 'inward' ? inwardMap : outwardMap;
      const entries = dir === 'inward' ? data.inward : data.outward;
      const { entryIndex, posInEntry } = map[cellNum];
      if (posInEntry > 0) {
        return dir === 'inward' ? cellNum - 1 : cellNum + 1;
      }
      const prev = (entryIndex - 1 + entries.length) % entries.length;
      return entryLastCell(dir, prev);
    }

    function nextEntryFirstCell(dir, cellNum) {
      const map     = dir === 'inward' ? inwardMap : outwardMap;
      const entries = dir === 'inward' ? data.inward : data.outward;
      const next    = (map[cellNum].entryIndex + 1) % entries.length;
      return entryFirstCell(dir, next);
    }

    const cellLetters = new Map();

    function getCellLetter(n) { return cellLetters.get(n) || ''; }

    function setCellLetter(n, letter) {
      if (letter) cellLetters.set(n, letter);
      else cellLetters.delete(n);
      letterTexts[n].textContent = letter;
      cellPaths[n].classList.remove('correct');
      letterTexts[n].classList.remove('correct');
    }

    function checkCell() {
      const n = activeCell;
      if (isCellCorrect(getCellLetter(n), data.letters[n - 1])) {
        cellPaths[n].classList.add('correct');
        letterTexts[n].classList.add('correct');
      } else {
        flashWrong(cellPaths[n], flashLayer);
      }
      syncUI();
      saveState();
      document.getElementById('hidden-input').focus({ preventScroll: true });
    }

    function checkAllCellsIfFilled() {
      if (!data.cells.every(c => getCellLetter(c.cell_number) !== '')) return;
      if (!data.cells.every(c => isCellCorrect(getCellLetter(c.cell_number), data.letters[c.cell_number - 1]))) {
        syncUI();
        return;
      }
      data.cells.forEach(c => {
        cellPaths[c.cell_number].classList.add('correct');
        letterTexts[c.cell_number].classList.add('correct');
      });
      syncUI();
    }

    function checkBoardIfFilled() {
      if (!data.cells.every(c => getCellLetter(c.cell_number) !== '')) return;
      if (sha256hex(getSolution()) !== data.boardHash) { syncUI(); return; }
      data.cells.forEach(c => {
        cellPaths[c.cell_number].classList.add('correct');
        letterTexts[c.cell_number].classList.add('correct');
      });
      data.inward.forEach((_, i) => {
        document.querySelector(`[data-direction="inward"][data-entry-index="${i}"]`)
          ?.classList.add('correct');
      });
      data.outward.forEach((_, i) => {
        document.querySelector(`[data-direction="outward"][data-entry-index="${i}"]`)
          ?.classList.add('correct');
      });
      syncUI();
    }

    function getSolution() {
      return inwardEntryCells.flat().map(n => getCellLetter(n)).join('').toLowerCase();
    }

    function isSolved() {
      return data.cells.every(c => cellPaths[c.cell_number].classList.contains('correct'));
    }

    function inwardRange(i) {
      const arr = inwardEntryCells[i];
      return `${arr[0]}–${arr[arr.length - 1]}`;
    }

    function outwardRange(i) {
      const cells = outwardEntryCells[i];
      return `${Math.min(...cells)}–${Math.max(...cells)}`;
    }

    function renderClues() {
      const inwardList  = document.getElementById('inward-clues');
      const outwardList = document.getElementById('outward-clues');

      data.inward.forEach((entry, i) => {
        const li = document.createElement('li');
        li.className = 'clue-item';
        li.dataset.direction  = 'inward';
        li.dataset.entryIndex = i;
        const rangeSpan = document.createElement('span');
        rangeSpan.className = 'clue-range';
        rangeSpan.textContent = inwardRange(i) + '.';
        const textSpan = document.createElement('span');
        textSpan.className = 'clue-text';
        textSpan.textContent = entry.clue;
        li.append(rangeSpan, textSpan);
        li.addEventListener('click', () => {
          direction  = 'inward';
          focusCell(inwardEntryCells[i][0]);
        });
        inwardList.appendChild(li);
      });

      data.outward.forEach((entry, i) => {
        const li = document.createElement('li');
        li.className = 'clue-item';
        li.dataset.direction  = 'outward';
        li.dataset.entryIndex = i;
        const rangeSpan = document.createElement('span');
        rangeSpan.className = 'clue-range';
        rangeSpan.textContent = outwardRange(i) + '.';
        const textSpan = document.createElement('span');
        textSpan.className = 'clue-text';
        textSpan.textContent = entry.clue;
        li.append(rangeSpan, textSpan);
        li.addEventListener('click', () => {
          direction  = 'outward';
          focusCell(outwardEntryCells[i][0]);
        });
        outwardList.appendChild(li);
      });
    }

    function focusCell(n) {
      activeCell = n;
      document.getElementById('hidden-input').focus({ preventScroll: true });
      syncUI();
    }

    function onCellClick(n) {
      if (n === activeCell) direction = direction === 'inward' ? 'outward' : 'inward';
      focusCell(n);
    }

    function syncUI() {
      toggleOpts.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.dir === direction);
      });

      const curMap      = direction === 'inward' ? inwardMap : outwardMap;
      const curEntryIdx = curMap[activeCell].entryIndex;

      data.cells.forEach(cell => {
        const el  = cellPaths[cell.cell_number];
        const cel = curMap[cell.cell_number];
        el.classList.toggle('active-entry', !!cel && cel.entryIndex === curEntryIdx);
        el.classList.toggle('active-cell',  cell.cell_number === activeCell);
      });

      const oppMap      = direction === 'inward' ? outwardMap : inwardMap;
      const oppDir      = direction === 'inward' ? 'outward' : 'inward';
      const oppEntryIdx = oppMap[activeCell].entryIndex;

      document.querySelectorAll('.clue-item').forEach(item => {
        const itemDir = item.dataset.direction;
        const itemIdx = Number(item.dataset.entryIndex);
        item.classList.toggle('active-clue',
          itemDir === direction && itemIdx === curEntryIdx);
        item.classList.toggle('secondary-entry',
          itemDir === oppDir && itemIdx === oppEntryIdx);
      });

      const curEntries = direction === 'inward' ? data.inward : data.outward;
      const oppEntries = direction === 'inward' ? data.outward : data.inward;
      const curRange   = direction === 'inward' ? inwardRange(curEntryIdx) : outwardRange(curEntryIdx);
      const oppRange   = oppDir === 'inward'    ? inwardRange(oppEntryIdx) : outwardRange(oppEntryIdx);
      barPrimaryDir.textContent    = direction.charAt(0).toUpperCase() + direction.slice(1);
      barPrimaryNum.textContent    = curRange + '.';
      barPrimaryText.textContent   = curEntries[curEntryIdx].clue;
      barSecondaryDir.textContent  = oppDir.charAt(0).toUpperCase() + oppDir.slice(1);
      barSecondaryNum.textContent  = oppRange + '.';
      barSecondaryText.textContent = oppEntries[oppEntryIdx].clue;

      if (!data.hashed && checkBtn) {
        checkBtn.disabled = !getCellLetter(activeCell) ||
          cellPaths[activeCell].classList.contains('correct');
      }

      // Chevron on leading edge of active cell pointing in direction of travel
      const ac        = data.cells[activeCell - 1];
      const isInward  = direction === 'inward';
      const theta_e   = isInward ? ac.theta_end    : ac.theta_start;
      const r_inner_e = isInward ? ac.r_inner_end  : ac.r_inner_start;
      const r_outer_e = isInward ? ac.r_outer_end  : ac.r_outer_start;
      const [ix, iy]  = polar(r_inner_e, theta_e);
      const [ox, oy]  = polar(r_outer_e, theta_e);
      const [mx, my]  = polar((r_inner_e + r_outer_e) / 2, theta_e);
      const [tsx, tsy] = polar((ac.r_inner_start + ac.r_outer_start) / 2, ac.theta_start);
      const [tex, tey] = polar((ac.r_inner_end   + ac.r_outer_end)   / 2, ac.theta_end);
      let tdx = tex - tsx, tdy = tey - tsy;
      if (!isInward) { tdx = -tdx; tdy = -tdy; }
      const tlen      = Math.sqrt(tdx * tdx + tdy * tdy);
      const prot      = (R_MAX - R_HOLE) / (N_TURNS + 1) * 0.15;
      chevronEl.setAttribute('d',
        `M${f(ix)},${f(iy)} L${f(mx + tdx/tlen*prot)},${f(my + tdy/tlen*prot)} L${f(ox)},${f(oy)}`);

      const solved = isSolved();
      const allFilled = data.cells.every(c => getCellLetter(c.cell_number) !== '');
      if (!congratsDismissed) congratsOverlay.hidden = !solved;
      doneWrong.hidden = !(allFilled && !solved);
      latch.check(solved);
    }

    const { saveState, restoreState, clearState } = setupStorage(storageKey('sp', data), {
      cellCount: totalCells,
      getState() {
        const letters = {};
        cellLetters.forEach((v, k) => { letters[k] = v; });
        const correct = [];
        data.cells.forEach(c => {
          if (cellPaths[c.cell_number].classList.contains('correct')) correct.push(c.cell_number);
        });
        return { letters, correct, activeMs: timer.getElapsedMs() };
      },
      applyState(saved) {
        Object.entries(saved.letters).forEach(([k, v]) => {
          const n = Number(k);
          cellLetters.set(n, v);
          letterTexts[n].textContent = v;
        });
        saved.correct.forEach(n => {
          cellPaths[n].classList.add('correct');
          letterTexts[n].classList.add('correct');
        });
        timer.restoreMs(saved.activeMs);
      },
    });

    const timer = setupTimer({ onPause: () => saveState() });
    const puzzleRoot = document.querySelector('.puzzle-main');
    const latch = makeCompletionLatch({
      puzzleRoot,
      kind:         data.kind,
      title:        data.title,
      date:         data.date,
      getBoardHash: () => data.boardHash,
      getSolution,
      getElapsedMs: () => timer.getElapsedMs(),
    });

    // ── Build SVG ────────────────────────────────────────────────────────────
    const svg = document.getElementById('spiral-svg');

    const { R_HOLE, R_MAX, N_TURNS } = data.geometry;
    const PAD = 18;
    svg.setAttribute('viewBox',
      `${-(R_MAX + PAD)} ${-(R_MAX + PAD)} ${2 * (R_MAX + PAD)} ${2 * (R_MAX + PAD)}`);

    // Spiral curl: winds inward from the last cell's inner edge, tapering to a point
    const lastCell       = data.cells[data.cells.length - 1];
    const curlStartR     = lastCell.r_inner_end;
    const curlStartTheta = lastCell.theta_end;
    const curlSteps      = 300;
    const curlAngle      = 1.75 * 2 * Math.PI;
    let curlD = '';
    for (let i = 0; i <= curlSteps; i++) {
      const t = i / curlSteps;
      const [x, y] = polar(curlStartR * (1 - t * 0.97), curlStartTheta + t * curlAngle);
      curlD += `${i === 0 ? 'M' : 'L'}${f(x)},${f(y)} `;
    }
    svg.appendChild(svgEl('path', { id: 'center-curl', d: curlD }));

    // Four explicit layer groups: cells < circles < flash < letters.
    // flashLayer holds wrong-guess flash overlays (see flashWrong) above the cells.
    // The chevron is appended directly to svg after the groups so it paints on top.
    const cellsLayer   = svgEl('g', {});
    const circlesLayer = svgEl('g', {});
    const flashLayer   = svgEl('g', {});
    const lettersLayer = svgEl('g', {});
    svg.append(cellsLayer, circlesLayer, flashLayer, lettersLayer);

    const numSize      = (R_MAX - R_HOLE) / (N_TURNS * 6.5);
    const letterSize   = (R_MAX - R_HOLE) / (N_TURNS * 3.2);
    const BAND         = (R_MAX - R_HOLE) / (N_TURNS + 1);
    const circleRadius = BAND / 2;

    const cellCenters       = {};
    const cellCircleCenters = {};
    const cellPaths         = {};
    const letterTexts       = {};

    // Pass 1: cell paths (innermost-first for correct z-ordering of strokes).
    for (let i = data.cells.length - 1; i >= 0; i--) {
      const cell = data.cells[i];
      const n    = cell.cell_number;
      const path = svgEl('path', { id: `cell-${n}`, class: 'cell', d: cellPath(cell) });
      path.addEventListener('click', () => onCellClick(n));
      cellsLayer.appendChild(path);
      cellPaths[n] = path;

      const a_mid = (cell.theta_start + cell.theta_end) / 2;

      // Letter center: biased slightly toward inner edge (intentional for legibility).
      const r_mid = 0.55 * cell.r_inner_start + 0.45 * cell.r_outer_start;
      cellCenters[n] = polar(r_mid, a_mid);

      // Circle center: geometric midpoint of the cell shape, matching cellPath's arc radii.
      const r_out = (cell.r_outer_start + cell.r_outer_end) / 2;
      const r_in  = (cell.r_inner_start + cell.r_inner_end) / 2;
      cellCircleCenters[n] = polar((r_out + r_in) / 2, a_mid);
    }

    // Pass 2: circle decorations for entries with styles.
    function renderEntryCircles(entries, entryCells) {
      entries.forEach((entry, i) => {
        if (!entry.styles || !Array.isArray(entry.styles.circle)) return;
        entry.styles.circle.forEach(posInEntry => {
          const n = entryCells[i][posInEntry];
          if (n === undefined) {
            console.warn(`style-circle: entry ${i} has no cell at position ${posInEntry}`);
            return;
          }
          const [cx, cy] = cellCircleCenters[n];
          circlesLayer.appendChild(svgEl('circle', {
            class: 'style-circle', cx: f(cx), cy: f(cy), r: f(circleRadius),
          }));
        });
      });
    }
    renderEntryCircles(data.inward, inwardEntryCells);
    renderEntryCircles(data.outward, outwardEntryCells);

    // Pass 3: cell number labels and letter texts.
    for (let i = data.cells.length - 1; i >= 0; i--) {
      const cell = data.cells[i];
      const n    = cell.cell_number;

      const r_num = 0.78 * cell.r_outer_start + 0.22 * cell.r_inner_start;
      const a_num = cell.theta_start + 0.18 * (cell.theta_end - cell.theta_start);
      const [nx, ny] = polar(r_num, a_num);
      const numText = svgEl('text', {
        id: `cellnum-${n}`, class: 'cell-num',
        x: f(nx), y: f(ny), 'font-size': f(numSize),
      });
      numText.textContent = n;
      lettersLayer.appendChild(numText);

      const [tx, ty] = cellCenters[n];
      const letterText = svgEl('text', {
        id: `letter-${n}`, class: 'cell-letter',
        x: f(tx), y: f(ty), 'font-size': f(letterSize),
      });
      lettersLayer.appendChild(letterText);
      letterTexts[n] = letterText;
    }

    const chevronEl = svgEl('path', { id: 'direction-chevron' });
    svg.appendChild(chevronEl);

    const barPrimaryDir    = document.querySelector('#active-clue-primary .active-clue-dir');
    const barPrimaryNum    = document.querySelector('#active-clue-primary .active-clue-num');
    const barPrimaryText   = document.querySelector('#active-clue-primary .active-clue-text');
    const barSecondaryDir  = document.querySelector('#active-clue-secondary .active-clue-dir');
    const barSecondaryNum  = document.querySelector('#active-clue-secondary .active-clue-num');
    const barSecondaryText = document.querySelector('#active-clue-secondary .active-clue-text');

    const toggleOpts      = Array.from(document.querySelectorAll('.toggle-opt'));
    const checkBtn        = document.getElementById('check-btn');
    const congratsOverlay = document.getElementById('congrats-overlay');
    const doneWrong       = document.getElementById('done-wrong');

    // ── Header & clues ───────────────────────────────────────────────────────
    renderByline(data);
    renderInstructions(data);
    renderClues();

    // ── Event wiring ─────────────────────────────────────────────────────────
    toggleOpts.forEach(btn => {
      btn.addEventListener('click', () => {
        direction = btn.dataset.dir;
        focusCell(activeCell);
      });
    });

    if (!data.hashed) {
      checkBtn.addEventListener('click', checkCell);
    } else {
      checkBtn.hidden = true;
    }

    function resetBoard() {
      cellLetters.clear();
      data.cells.forEach(c => {
        letterTexts[c.cell_number].textContent = '';
        cellPaths[c.cell_number].classList.remove('correct');
        letterTexts[c.cell_number].classList.remove('correct');
      });
      document.querySelectorAll('.clue-item').forEach(li => li.classList.remove('correct'));
      while (flashLayer.firstChild) flashLayer.removeChild(flashLayer.firstChild);
      congratsDismissed = false;
      direction = 'inward';
      clearState();
      timer.reset();
      latch.reset();
      focusCell(inwardEntryCells[0][0]);
    }

    setupClearButton(
      document.getElementById('clear-btn'),
      resetBoard,
      () => document.getElementById('hidden-input').focus({ preventScroll: true })
    );

    setupCongratsOverlay(congratsOverlay, () => {
      congratsDismissed = true;
      document.getElementById('hidden-input').focus({ preventScroll: true });
    });

    const hiddenInput = document.getElementById('hidden-input');
    const keysOverlay = setupKeysOverlay(
      [
        ['Tab',       'Next entry'],
        ['Shift+Tab', 'Previous entry'],
        ['← →',       'Move along entry'],
        ['⌫',         'Clear current cell'],
        ['Space',     'Clear and advance'],
        ['.',         'Toggle inward / outward'],
      ],
      () => hiddenInput.focus({ preventScroll: true })
    );

    setupKeydown(e => {
      if (e.key === '.') {
        e.preventDefault();
        direction = direction === 'inward' ? 'outward' : 'inward';
        focusCell(activeCell);
        return;
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const map     = direction === 'inward' ? inwardMap : outwardMap;
        const entries = direction === 'inward' ? data.inward : data.outward;
        if (e.shiftKey) {
          const prev = (map[activeCell].entryIndex - 1 + entries.length) % entries.length;
          focusCell(entryFirstCell(direction, prev));
        } else {
          focusCell(nextEntryFirstCell(direction, activeCell));
        }
        return;
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        focusCell(nextInDir(activeCell, direction));
        return;
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        focusCell(prevInDir(activeCell, direction));
        return;
      }
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (getCellLetter(activeCell)) {
          setCellLetter(activeCell, '');
          syncUI();
        } else {
          const prev = prevInDir(activeCell, direction);
          setCellLetter(prev, '');
          focusCell(prev);
        }
        saveState();
        return;
      }
      if (e.key === ' ') {
        e.preventDefault();
        setCellLetter(activeCell, '');
        saveState();
        focusCell(nextInDir(activeCell, direction));
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
          e.key === 'PageUp'  || e.key === 'PageDown') {
        e.preventDefault();
        scrollByKey(e.key);
      }
    }, { keysOverlay });

    hiddenInput.addEventListener('input', () => {
      const letter = normalize(hiddenInput.value).slice(-1).toUpperCase();
      hiddenInput.value = '';
      if (!letter) return;
      timer.onFirstInput();
      setCellLetter(activeCell, letter);
      if (data.hashed) {
        focusCell(nextInDir(activeCell, direction));
        checkBoardIfFilled();
      } else {
        focusCell(nextInDir(activeCell, direction));
        checkAllCellsIfFilled();
      }
      saveState();
    });

    svg.addEventListener('click', e => {
      if (e.target === svg) document.getElementById('hidden-input').focus();
    });

    // ── Restore & focus ──────────────────────────────────────────────────────
    restoreState();
    latch.sealIfSolved(isSolved());
    focusCell(1);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
