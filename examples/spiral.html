<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral</title>
  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* An ID or class rule that sets `display` on a [hidden] element (e.g. #menu-panel's
   `display: flex` below) otherwise outranks the UA [hidden] default by specificity,
   leaving the element stuck visible. */
[hidden] { display: none !important; }

body { line-height: 1.4; }

/* Tools with a fixed active-clue bar reserve its height as body padding, and expose it
   as --active-clue-bar-space for anything positioned against the bar (#menu-btn and
   #menu-panel in theme-components.css, Crushword's sticky grid). The bar's min-height
   fills that space, and its clue text can never wrap (nowrap + ellipsis), so this is an
   exact height, not a floor — which is what makes calc()-only positioning against it
   exact. */
body.has-clue-bar {
  padding-top: 56px;
  --active-clue-bar-space: 56px;
}

#active-clue-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  min-height: var(--active-clue-bar-space);
  padding: 5px 16px 4px;
}

.active-clue-row {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-size: 0.875rem;
  line-height: 1.4;
}

#active-clue-secondary {
  font-size: 0.8rem;
  opacity: 0.6;
}

.active-clue-num {
  font-weight: bold;
  flex-shrink: 0;
}

.active-clue-text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#instructions {
  max-width: 600px;
  margin: 0 auto;
}

.clue-item {
  font-size: 0.875rem;
  padding: 2px 6px;
  border-radius: 2px;
}

.cell        { cursor: pointer; }
.cell-letter { pointer-events: none; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
.cell-num    { pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
.style-circle { pointer-events: none; }

#controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

button {
  cursor: pointer;
  border-radius: 4px;
  border: 1px solid;
  padding: 6px 14px;
  font-size: 0.875rem;
}

/* Suppress double-tap-to-zoom and its tap delay on the in-solve controls, which are
   tapped repeatedly (#rebus-btn especially) so the delay is felt. Scoped to #controls
   rather than every button: the modal and dialog buttons are tapped once and have no
   reason to change hit-testing behavior. */
#controls button { touch-action: manipulation; }

/* The solver's "Show Check Cell button" preference hides #check-btn with this class
   rather than `hidden`: invisible but still laid out, so turning it off moves nothing.
   #check-btn is taller than its row-mates, and for a small ring it widens Snake
   Charmer's #ring-wrap, so removing it from layout would shift the page and resize the
   ring. A hashed page has no Check Cell at all and removes it with `hidden`. */
#check-btn.check-btn-off { visibility: hidden; }

button:disabled { opacity: 0.4; cursor: default; }

/* Reserve the width of the widest label each button can show, so swapping the label
   never reflows its container — #menu-panel for #clear-btn (shrink-to-fit width,
   sized off this reservation, not the panel's own min-width), #controls for
   #rebus-btn. #clear-btn swaps Clear Puzzle→Are you sure?, #rebus-btn Rebus→Done;
   each reserves its longer string — measured, not eyeballed: 'Are you sure?' is
   wider than 'Clear Puzzle' despite having fewer wide characters. */
#clear-btn::after,
#rebus-btn::after {
  display: block;
  height: 0;
  overflow: hidden;
  visibility: hidden;
}
#clear-btn::after { content: 'Are you sure?'; }
#rebus-btn::after { content: 'Rebus'; }

#hidden-input {
  position: fixed;
  left: -9999px;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.puzzle-toggle { display: flex; border-radius: 4px; overflow: hidden; }
.puzzle-toggle .toggle-opt { border-radius: 0; border: none; flex: 1; white-space: nowrap; }
.toggle-opt { user-select: none; cursor: pointer; }

#keys-btn,
#menu-btn {
  position: fixed;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  font-weight: bold;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

#keys-btn {
  bottom: 20px;
  z-index: 50;
}

/* Fixed top-right corner, mirroring #keys-btn's bottom-right circle. Snake
   Charmer/Spiral override `top` (theme-components.css) to sit the button
   below #active-clue-bar instead of at this default offset — see that
   override for why. */
#menu-btn {
  top: 20px;
  z-index: 110;
  /* The ☰ glyph's ink sits ~1px below its line box's center; asymmetric padding nudges
     it up to compensate (pinned by an e2e pixel measurement). */
  padding-bottom: 8px;
}

/* Non-modal dropdown — plain div, not <dialog>, so the page behind it stays
   interactive. The [hidden] reset above (!important) wins over this display:flex
   while the panel is closed. */
#menu-panel {
  position: fixed;
  top: 60px;
  right: 20px;
  z-index: 110;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  min-width: 120px;
}

/* Matches #clear-btn's padding/font-size/border-radius (theme-components.css)
   so the menu-panel rows all read as plain, equally-weighted menu items — a flat
   hoverable strip, not a bordered "submit button" next to a bare checkbox. */
.menu-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
  padding: 6px 8px;
  border-radius: 4px;
}
.menu-toggle input { cursor: pointer; }

/* Native <dialog>: raised to the top layer by showModal() and dimmed via
   ::backdrop — no positioning or z-index needed. The dialog is a transparent
   frame; #keys-modal / the congrats card (inside it) is the visible card.
   `margin: auto` restores the UA modal centering that the global
   `* { margin: 0 }` reset above would otherwise defeat (the UA
   `dialog:modal { inset: 0 }` is still in effect). */
#keys-overlay,
#congrats-dialog {
  margin: auto;
  padding: 0;
  border: none;
  background: transparent;
  max-width: 100vw;
  max-height: 100vh;
}

@keyframes flash-wrong {
  0%   { opacity: 1; }
  20%  { opacity: 1; }
  100% { opacity: 0; }
}
.flash-wrong-overlay {
  fill: #ef9a9a;
  pointer-events: none;
  animation: flash-wrong 600ms ease-out forwards;
}
/* The same flash on a Clues-screen cell (FLASH_WRONG_MS in engine-chrome.mjs is its
   length). No end keyframe: it fades to the cell's own background. */
@keyframes flash-wrong-cell {
  0%, 20% { background: #ef9a9a; }
}
html.phone .list-cell.flash-wrong { animation: flash-wrong-cell 600ms ease-out; }

/* ── Phone solving view (html.phone; shared/engine-phone.mjs) ─────────────────────────
   Every rule is prefixed with html.phone, and with #solve-stage where it resizes a
   tool's grid, so it outranks the tool's desktop rules: the tool's base.css comes later
   in the cascade. */

/* Everything the phone layout shows has moved out of .puzzle-body. What's left includes
   Crushword's sticky, opaque .puzzle-center, which would otherwise float empty over the
   page. #controls goes with it, holding only the desktop toggle by now. */
html.phone .puzzle-body,
html.phone #keys-btn { display: none; }

html.phone body.has-clue-bar { padding-top: 0; }

/* The view and its keyboard run edge to edge, with nothing above them on screen: the
   top bar and the Clues screen show the header and instructions (setupPhoneLayout).
   They still print, with a gutter. */
html.phone .puzzle-main { max-width: none; padding: 0; }
html.phone .puzzle-header,
html.phone #instructions { padding-left: 16px; padding-right: 16px; }
@media screen {
  html.phone .puzzle-header,
  html.phone #instructions { display: none; }
}
html.phone .list-instructions { margin: 0 0 16px; }

/* One screen high, in normal page flow (below the header, which only prints), and
   nothing in it is sticky or fixed. In a frame, 100svh is the frame's height, which the
   host makes one screen high (setupEmbedResize's `fill`). */
html.phone #solve-view {
  height: 100svh;
  display: flex;
  flex-direction: column;
  position: relative;
}
/* The congrats card's buttons, at the 44px tap minimum. */
html.phone #congrats-actions button { min-height: 44px; padding: 0 16px; }
/* First-visit instructions (setupPhoneLayout): a card over the whole view. */
html.phone #intro {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
html.phone .intro-card {
  max-height: 100%;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
html.phone .intro-card > button { align-self: center; min-width: 120px; min-height: 44px; }

/* Top bar: title, Clues/Grid, menu, 52px high to leave the 44px buttons clear of the
   divider below. The menu panel opens below it, absolutely, since a fixed panel would
   stay put while the bar scrolls with the page. */
html.phone .solve-top {
  flex: none;
  min-height: 52px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px 0 12px;
}
/* The title's slot, which the done-wrong banner covers while it shows (setupPhoneLayout).
   Its text is clipped to the slot, so the bar keeps its height. */
html.phone .solve-head-slot {
  flex: 1;
  min-width: 0;
  align-self: stretch;
  display: flex;
  position: relative;
}
html.phone .solve-head-slot #done-wrong {
  position: absolute;
  inset: 4px 0;
  display: flex;
  align-items: center;
  margin: 0;
  padding: 0 10px;
  overflow: hidden;
  font-size: 0.85rem;
  line-height: 1.2;
}
/* The title, up to two lines, over the byline: the bar takes its height from them once,
   at load, so a long title costs the grid a line instead of being cut off. */
html.phone .solve-head {
  flex: 1;
  align-self: center;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 4px 0;
}
html.phone .solve-title {
  font-weight: bold;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}
html.phone .solve-byline {
  font-size: 0.8rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
html.phone #clues-btn { flex: none; height: 44px; min-width: 64px; }
html.phone #menu-btn { position: static; flex: none; width: 44px; height: 44px; }
html.phone #help-btn {
  flex: none;
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
html.phone #menu-panel { position: absolute; top: 100%; right: 8px; z-index: 10; }
/* The help panel opens under its own button, right of ☰'s: the bar's 4px padding, ☰'s
   44px and a gap. */
html.phone #help-panel {
  position: absolute;
  top: 100%;
  right: 56px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  min-width: 120px;
  padding: 10px;
}
/* The menus' rows at the 44px tap minimum. */
html.phone #menu-panel .menu-toggle,
html.phone #menu-panel #clear-btn,
html.phone #help-panel #check-btn { min-height: 44px; }

/* The stage takes what the bars leave. The grid fills it, and the SVG's viewBox scales
   it to fit; the ID rules below undo each tool's desktop sizing. */
html.phone #solve-stage { flex: 1; min-height: 0; }
html.phone #grid-pane { height: 100%; padding: 6px 8px; }
html.phone #grid-pane > *,
html.phone #solve-stage #ring-svg,
html.phone #solve-stage #spiral-svg,
html.phone #solve-stage #puzzle-svg { width: 100%; height: 100%; max-width: none; }
html.phone #solve-stage #ring-container { margin-top: 0; min-width: 0; }
html.phone #solve-stage #grid-wrap { display: block; }

/* Not overscroll-behavior: contain. Until the solver scrolls the view flush, the pane
   fills most of the screen, and a swipe that couldn't pass to the page at the list's
   end would leave the keyboard reachable only by its sliver on screen. */
html.phone #list-pane {
  height: 100%;
  overflow-y: auto;
  padding: 8px 16px;
}

/* The fill-in list (setupFillList): each clue's cell row on a line of its own below the
   clue. Cells are 36px squares, a long entry wrapping onto more lines; under
   html.list-nowrap (the options menu) they shrink instead, to keep it on one line. 36px,
   not MIN_TAP's 44: near a grid cell's feel, and a ten-cell entry still fits a small
   phone in two lines. A letter scales with its cell (cqw) and, in a rebus cell, with
   its length (--len). The clue text takes the rest of the first line, so a long clue
   wraps beside its number instead of dropping below it as an item of its own. */
html.phone .clue-item { flex-wrap: wrap; }
html.phone .clue-item > .clue-text { flex: 1 1 0; min-width: 0; }
html.phone .list-cells {
  flex: 0 0 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 3px;
  margin: 4px 0 2px;
}
html.phone .list-cell {
  flex: none;
  width: 36px;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  container-type: inline-size;
  cursor: pointer;
}
html.phone .list-letter {
  font-size: min(55cqw, calc(100cqw / (var(--len, 1) + 0.2)));
  font-weight: bold;
  line-height: 1;
  white-space: nowrap;
}
/* Crushword's caret, a bar between two letters of the cursor's cell as in the grid. Its
   margins give it a gap of its own, which the letter size reserves (the 0.2 above), so it
   shows even at the edge of a full cell. */
html.phone .list-caret {
  display: inline-block;
  width: 0.07em;
  height: 0.9em;
  margin: 0 0.05em;
  vertical-align: -0.1em;
  background: currentColor;
}
html.phone.list-nowrap .list-cells { flex-wrap: nowrap; }
html.phone.list-nowrap .list-cell { flex: 1 1 0; width: auto; min-width: 0; max-width: 36px; }

/* Bar row: one clue, at most two lines, between the ‹ › steps. Its height is fixed, so
   a clue of any length leaves the grid where it is. The desktop bar's gutter for
   #menu-btn goes, since the button is in the top bar now. */
html.phone #solve-bar { flex: none; height: 48px; display: flex; position: relative; }
html.phone .bar-step {
  flex: none;
  width: 44px;
  padding: 0;
  border: none;
  font-size: 1.5rem;
}
/* The desktop bar's position and z-index don't belong in the bar row. */
html.phone #active-clue-bar {
  position: static;
  z-index: auto;
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  padding: 0 4px;
  border-bottom: none;
}
/* Marching Bands' navigator takes the same bar row, so the same fixed height and
   two-line clamp. Its row or band and clue count stack in a column at the left. */
html.phone #clue-navigator {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 4px;
}
/* Clear of the clue, so the label reads as a label. */
html.phone .nav-meta + .nav-text { margin-left: 8px; }
html.phone .nav-meta {
  flex: none;
  align-self: center;
  display: flex;
  flex-direction: column;
  font-size: 0.7rem;
  line-height: 1.25;
  white-space: nowrap;
}
html.phone .nav-label { font-weight: bold; font-size: 0.8rem; }
html.phone .nav-text {
  flex: 1;
  align-self: center;
  min-width: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}
html.phone #active-clue-secondary { display: none; }
/* A cut-off clue in full (setupClueExpand): over the bar row, growing up over the foot
   of the grid as far as the clue needs, so nothing else moves. */
html.phone #clue-full {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  box-sizing: border-box;
  min-height: 100%;
  max-height: 50svh;
  overflow-y: auto;
  padding: 8px 12px;
}
html.phone #active-clue-primary .active-clue-text {
  white-space: normal;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
}

/* Drawn keyboard. Every row has a fixed height, an empty one too, so both layers are
   the same height. Keys shrink to fit the row (min-width: 0, no padding): only their
   height has to meet the 44px tap minimum. */
html.phone #drawn-kb {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px 3px calc(6px + env(safe-area-inset-bottom));
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
html.phone .kb-layer { display: flex; flex-direction: column; gap: 6px; }
html.phone .kb-row { display: flex; gap: 4px; height: 44px; }
html.phone .kb-layer > .kb-row:nth-child(2) { padding: 0 5%; }
html.phone #drawn-kb button {
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  padding: 0;
  border-radius: 5px;
  font-size: 1.1rem;
  /* No double-tap zoom when typing fast. #rebus-btn needs it here too, having left
     #controls and its own rule. */
  touch-action: manipulation;
}
html.phone #drawn-kb .kb-mod { flex-grow: 1.5; font-size: 0.85rem; }
/* pre-line: a label may break itself over two lines (Crushword's Prev/Next cell). */
html.phone #drawn-kb .kb-bottom button { font-size: 0.8rem; line-height: 1.15; white-space: pre-line; }
html.phone #drawn-kb .kb-wide { flex-grow: 2; font-weight: bold; }
html.phone #drawn-kb .kb-bottom .kb-glyph { font-size: 1.6rem; line-height: 1; }
/* Holds ABC and ⌫ at the digit layer's edges, where the letter layer has them. */
html.phone .kb-spacer { flex: 7 1 0; }

.puzzle-main {
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 16px 20px;
}


#grid-wrap {
  display: flex;
  justify-content: center;
  width: 100%;
}

#spiral-svg {
  max-width: min(100%, 500px);
  height: auto;
  display: block;
}

.puzzle-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) min(500px, 100%) minmax(0, 1fr);
  grid-template-areas: "left center right";
  gap: 0 32px;
  align-items: start;
}

.puzzle-center        { grid-area: center; }
.clue-section-inward  { grid-area: left; }
.clue-section-outward { grid-area: right; }

.puzzle-center {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

@media (max-width: 880px) {
  .puzzle-body {
    display: block;
  }
  .clue-section-inward,
  .clue-section-outward {
    margin-top: 24px;
  }
}

.clue-section h2 {
  font-size: 1rem;
  font-weight: bold;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.clue-item {
  display: flex;
  gap: 8px;
  cursor: pointer;
  list-style: none;
  padding: 2px 6px 2px 2px;
}

.clue-range {
  min-width: 5em;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

#direction-chevron { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

/* theme-base: neutral defaults — every --theme-* var a theme can override.
   A theme's <name>-tokens.css need only override what differs from these. */
:root {
  /* Fonts */
  --theme-font-body:    system-ui, -apple-system, sans-serif;
  --theme-font-display: var(--theme-font-body);
  --theme-font-button:  var(--theme-font-body);
  --theme-font-cell:    var(--theme-font-body);

  /* Masthead / title / byline */
  --theme-color-header-rule: #cccccc;
  --theme-title-tracking:    normal;
  --theme-title-transform:   none;
  --theme-color-title:       var(--theme-color-text);
  --theme-byline-style:      normal;
  --theme-byline-size:       0.875rem;

  /* Page */
  --theme-color-bg:    #ffffff;
  --theme-color-text:  #111111;
  --theme-color-muted: #555555;

  /* Bars / borders */
  --theme-color-bar-border:  #cccccc;
  --theme-color-soft-border: #cccccc;

  /* Primary button */
  --theme-color-btn-bg:       #333333;
  --theme-color-btn-text:     #ffffff;
  --theme-color-btn-hover:    #555555;
  --theme-color-btn-disabled: #999999;
  --theme-button-tracking:    0.05em;

  /* Secondary / toggle button colors */
  --theme-color-btn2-bg:     #eeeeee;
  --theme-color-btn2-border: #aaaaaa;
  --theme-color-btn2-hover:  #e0e0e0;

  /* Clear button */
  --theme-color-clear-fg:       #999999;
  --theme-color-clear-hover-fg: #333333;

  /* Grid cells */
  --theme-color-cell-bg:     #ffffff;
  --theme-color-cell-stroke: #999999;
  --theme-color-cell-text:   #111111;

  /* Cell / clue states */
  --theme-color-highlight:            #deeeff;
  --theme-color-band-even:            var(--theme-color-cell-bg);
  --theme-color-highlight-band-even:  var(--theme-color-highlight);
  --theme-color-active:               #b8d4f5;
  --theme-color-active-stroke:        #1e5799;
  --theme-color-clue-hover:           #eeeeee;
  --theme-color-secondary-entry:      #f0f0f0;
  --theme-clue-radius:                2px;

  /* Snake-charmer-specific secondary-active cell */
  --theme-color-secondary-active:        #7aaed8;
  --theme-color-secondary-active-stroke: #3a72a8;

  /* Correct */
  --theme-color-correct-bg:     #c8e6c9;
  --theme-color-correct-stroke: #4caf50;
  --theme-color-correct-text:   #1a6e22;

  /* Filled clue: every cell the clue owns has content, right or wrong — like crossing it
     off by hand. Distinct from Correct above (whole board verified). Defaults are no-ops;
     a theme opts in. Contract: docs/CROSS_TOOL_SPEC.md → "Filled clues". */
  --theme-clue-filled-decoration: none;
  --theme-clue-filled-opacity:    1;

  /* Decorations */
  --theme-color-circle:      #cccccc;
  --theme-color-curl:        #aaaaaa;
  --theme-color-cell-center: #222222;

  /* Instructions */
  --theme-color-instructions: var(--theme-color-muted);
  --theme-instructions-size:  0.85rem;

  /* Congrats / overlay */
  --theme-color-overlay:         rgba(0, 0, 0, 0.45);
  --theme-color-congrats-bg:     #2e7d32;
  --theme-color-congrats-border: #1b5e20;
  --theme-color-congrats-text:   #ffffff;
  --theme-card-radius:           10px;

  /* Done-wrong */
  --theme-color-wrong-bg:     #fff3e0;
  --theme-color-wrong-border: #e65100;
  --theme-color-wrong-text:   var(--theme-color-text);

  /* Danger */
  --theme-color-danger: #b91c1c;
}

/* Broadsheet theme — newspaper palette. Overrides theme-base defaults. */
:root {
  --theme-font-body:    Georgia, 'Times New Roman', serif;
  --theme-font-display: Georgia, 'Times New Roman', serif;
  --theme-font-button:  Georgia, 'Times New Roman', serif;
  --theme-font-cell:    Georgia, 'Times New Roman', serif;

  --theme-color-header-rule: #222222;
  --theme-title-tracking:    0.08em;
  --theme-title-transform:   uppercase;
  --theme-byline-style:      italic;

  --theme-color-bg:    #f9f7f1;

  --theme-color-bar-border:  #bbbbbb;
  --theme-color-soft-border: #bbbbbb;

  --theme-color-btn-bg:    #222222;
  --theme-color-btn-hover: #444444;

  --theme-color-btn2-bg:    #f0ece0;
  --theme-color-btn2-hover: #e4e0d4;

  --theme-color-band-even:           #e8e8e8;
  --theme-color-highlight-band-even: #cee2f8;
  --theme-color-clue-hover:          #ede8d2;
  --theme-color-secondary-entry:     #f5f0e0;

  --theme-color-circle: #bbbbbb;

  /* Filled clue: dim only */
  --theme-clue-filled-opacity: 0.5;
}

/* theme-components: every tool-agnostic selector, driven entirely by --theme-*.
   Per-tool namespaced sections live at the bottom (body class hook: .tool-<name>).

   SVG cell states (.cell.active-entry / .cell.active-cell) live here safely:
   marching-bands' band rules use :where() (specificity 0,1,0) so these 0,2,0
   rules always win regardless of source order. */

body {
  background:   var(--theme-color-bg);
  color:        var(--theme-color-text);
  font-family:  var(--theme-font-body);
}

/* Masthead */
.puzzle-header {
  text-align:     center;
  border-bottom:  2px solid var(--theme-color-header-rule);
  padding-bottom: 12px;
  margin-bottom:  24px;
}
h1.title {
  font-family:     var(--theme-font-display);
  font-size:       2rem;
  line-height:     1;
  letter-spacing:  var(--theme-title-tracking);
  text-transform:  var(--theme-title-transform);
  color:           var(--theme-color-title);
}
.byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
  font-size:  var(--theme-byline-size);
  margin-top: 6px;
}

#active-clue-bar {
  background:    var(--theme-color-bg);
  border-bottom: 1px solid var(--theme-color-bar-border);
}
html.phone #clue-full {
  background: var(--theme-color-bg);
  color:      var(--theme-color-text);
  border-top: 1px solid var(--theme-color-bar-border);
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.15);
}

/* #menu-btn sits *within* #active-clue-bar's own band instead of floating below it
   as a separate row — no extra vertical space. Pure CSS calc() against the bar's
   min-height (base.css), not JS-measured: nothing has to re-measure it when the bar or
   the viewport resizes. 32px is the button's own height (base.css); Marching Bands, with
   no bar, keeps the plain `top: 20px` default. The phone layout moves the button into
   its top bar instead (base.css, html.phone). */
.has-clue-bar #menu-btn { top: calc((var(--active-clue-bar-space) - 32px) / 2); }

/* #menu-panel opens directly below the bar's bottom edge (8px gap, matching
   Marching Bands' static button-to-panel gap from base.css) — same
   CSS-not-JS reasoning as #menu-btn above. */
.has-clue-bar #menu-panel { top: calc(var(--active-clue-bar-space) + 8px); }

/* Right gutter for the bar's own text now that #menu-btn shares its row.
   Lives here rather than in base.css's shared #active-clue-bar rule since
   only these three tools ever place the button there. */
.has-clue-bar #active-clue-bar { padding-right: 60px; }

/* Direction label ("Across"/"Down", "In"/"Out") before the bar's clue number. */
.active-clue-dir {
  font-size:      0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color:          var(--theme-color-muted);
  opacity:        0.6;
  flex-shrink:    0;
}

#instructions {
  color:         var(--theme-color-instructions);
  font-size:     var(--theme-instructions-size);
  line-height:   1.5;
  margin-bottom: 20px;
}
#instructions p + p { margin-top: 0.6em; }

.clue-item { border-radius: var(--theme-clue-radius); }
/* Clue-row highlights for the tools whose rows are <li class="clue-item"> (Marching
   Bands highlights its .clue-group instead, below). :where() keeps :hover at the same
   specificity as the state rules, so the state rules that follow win by source order. */
:where(.tool-snake-charmer, .tool-spiral, .tool-crushword) .clue-item:hover { background: var(--theme-color-clue-hover); }
.clue-item.active-clue     { background: var(--theme-color-active); }
.clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.clue-item.filled .clue-text { text-decoration: var(--theme-clue-filled-decoration); opacity: var(--theme-clue-filled-opacity); }

.clue-section h2 {
  color:          var(--theme-color-text);
  border-bottom:  1px solid var(--theme-color-soft-border);
  padding-bottom: 4px;
}

/* Primary button: Check on desktop, and the phone's first-visit Start */
#check-btn,
html.phone .intro-card > button {
  font-family:    var(--theme-font-button);
  font-size:      0.95rem;
  padding:        8px 22px;
  background:     var(--theme-color-btn-bg);
  color:          var(--theme-color-btn-text);
  border:         none;
  letter-spacing: var(--theme-button-tracking);
}
#check-btn:hover:not(:disabled) { background: var(--theme-color-btn-hover); }
#check-btn:disabled { background: var(--theme-color-btn-disabled); cursor: default; }

/* Clear button — flat, borderless, left-aligned, matching .menu-toggle
   (base.css): all are plain menu-panel rows now, not a bordered pill next to a
   bare checkbox. Color cues (armed, hover) carry entirely through text color
   and the shared row-hover background instead of a border. */
#clear-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.8rem;
  padding:        6px 8px;
  background:     transparent;
  border:         none;
  text-align:     left;
  color:          var(--theme-color-clear-fg);
  letter-spacing: var(--theme-button-tracking);
}
#clear-btn:hover              { color: var(--theme-color-clear-hover-fg); }
#clear-btn.armed              { color: var(--theme-color-danger); }
/* With no hover on a phone, the pale resting color reads as disabled next to the menu's
   other rows, so it takes the text color there; the armed state stays danger. */
html.phone #clear-btn         { color: var(--theme-color-text); }
html.phone #clear-btn.armed   { color: var(--theme-color-danger); }
#clear-btn:hover,
.menu-toggle:hover { background: var(--theme-color-clue-hover); }

/* Rebus button — the pointer route into multi-letter entry, mirroring the Enter key.
   Deliberately has no disabled or per-cell state: it looks identical on every square,
   in every build, which is what keeps it from signalling which cells are rebus.
   Composition-in-progress is shown on the cell itself (.cell.active-cell.composing
   below), so the button carries only its label — whose width is reserved in
   shared/base.css so the Rebus→Done swap does not reflow #controls. */
#rebus-btn {
  font-family:    var(--theme-font-button);
  font-size:      0.8rem;
  padding:        5px 12px;
  background:     transparent;
  color:          var(--theme-color-muted);
  border-color:   var(--theme-color-btn2-border);
  letter-spacing: var(--theme-button-tracking);
}
#rebus-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Puzzle toggle (direction / mode / loop) */
.puzzle-toggle { border: 1px solid var(--theme-color-btn2-border); }
.toggle-opt {
  font-family:    var(--theme-font-button);
  font-size:      0.9rem;
  font-weight:    bold;
  padding:        6px 16px;
  background:     var(--theme-color-btn2-bg);
  color:          var(--theme-color-muted);
  letter-spacing: 0.04em;
}
.toggle-opt:not(:last-child)   { border-right: 1px solid var(--theme-color-btn2-border); }
.toggle-opt.active             { background: var(--theme-color-btn-bg); color: var(--theme-color-btn-text); cursor: default; }
.toggle-opt:not(.active):hover { background: var(--theme-color-btn2-hover); }

/* SVG cell states */
.cell              { fill: var(--theme-color-cell-bg); stroke: var(--theme-color-cell-stroke); stroke-width: 0.5; }
.cell.active-entry { fill: var(--theme-color-highlight); }
.cell.active-cell  { fill: var(--theme-color-active); stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }
.cell.correct      { fill: var(--theme-color-correct-bg); stroke: var(--theme-color-correct-stroke); stroke-width: 0.5; }
.cell.correct.active-cell { stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }

.style-circle { fill: none; stroke: var(--theme-color-circle); stroke-width: 1; }

/* No font-size on .cell-letter or .cell-num: Spiral sizes these dynamically as SVG
   presentation attributes; a CSS font-size overrides them silently. The other tools
   size them in their own template base.css. */
.cell-letter         { font-family: var(--theme-font-cell); fill: var(--theme-color-cell-text); }
.cell-letter.correct { fill: var(--theme-color-correct-text); }
.cell-num            { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }

/* Multi-letter (rebus) cell content. Sized with transform, not font-size: Spiral writes
   its per-puzzle letter size as an SVG presentation attribute, which any CSS font-size
   rule would outrank (e2e/spiral.spec.js asserts exactly that). transform composes with
   whatever base size each tool established, so one shared block covers all three tools
   with no per-tool font math. The scale pivots on the letter's own x,y, which every
   tool centers its text on (text-anchor middle): setLetterText sets transform-origin
   from those attributes, in the view-box coordinates that transform-box: view-box
   resolves them in. fill-box (the origin as "center") would be simpler, but WebKit
   mis-resolves it for SVG <text>, so the letter slid toward the drawing's top-left. */
.cell-letter          { transform-box: view-box; }
.cell-letter.len-2    { transform: scale(0.62); }
.cell-letter.len-3    { transform: scale(0.45); }
.cell-letter.len-long { transform: scale(0.34); }

/* Rebus entry in progress. Specificity 0,3,0 beats .cell.active-cell (0,2,0) without
   depending on source order; the composing cell is always the active cell, so the
   selector states that invariant rather than working around it. Fill and stroke color
   are inherited from .cell.active-cell — only the dash pattern distinguishes the state,
   so no theme needs a new token. */
.cell.active-cell.composing { stroke-width: 2.5; stroke-dasharray: 4 2; }

/* Congrats modal — backdrop handles the overlay dim; #congrats is the visible card */
#congrats-dialog::backdrop { background: var(--theme-color-overlay); }

/* Keys button (fixed bottom-right corner, created by setupKeysOverlay) */
#keys-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#keys-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Menu button (fixed top-right corner, created by setupOptionsMenu) — same
   var usage as #keys-btn. */
#menu-btn,
html.phone #help-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#menu-btn:hover,
html.phone #help-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Menu dropdown card — same var usage as #keys-modal. */
#menu-panel,
html.phone #help-panel {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border:        2px solid var(--theme-color-soft-border);
  border-radius: var(--theme-card-radius);
}
/* #clear-btn is full width inside the dropdown. */
#menu-panel #clear-btn { width: 100%; }
/* On a phone #check-btn is a plain row of the help panel, as #clear-btn is of ☰'s. */
html.phone #help-panel #check-btn {
  width:          100%;
  font-size:      0.8rem;
  padding:        6px 8px;
  background:     transparent;
  color:          var(--theme-color-text);
  text-align:     left;
}
html.phone #help-panel #check-btn:hover:not(:disabled) { background: var(--theme-color-clue-hover); }

/* Keys modal — the <dialog> dim is its ::backdrop (skeleton sets this transparent) */
#keys-overlay::backdrop { background: var(--theme-color-overlay); }
#keys-modal {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border:        2px solid var(--theme-color-soft-border);
  border-radius: var(--theme-card-radius);
  padding:       20px 24px;
  min-width:     220px;
}
#keys-modal-header {
  display:         flex;
  justify-content: space-between;
  align-items:     center;
  margin-bottom:   12px;
  font-weight:     bold;
  font-size:       1rem;
  letter-spacing:  0.03em;
}
#keys-close {
  background: transparent;
  border:     none;
  cursor:     pointer;
  font-size:  1.1rem;
  line-height: 1;
  padding:    0 0 0 12px;
  color:      var(--theme-color-text);
}
/* Suppress the ring for mouse/programmatic focus, but keep it for keyboard
   users — the close button is auto-focused when the modal opens. */
#keys-close:focus:not(:focus-visible) { outline: none; }
#keys-close:hover { opacity: 0.65; }
#keys-modal table { border-collapse: collapse; width: 100%; }
#keys-modal td    { padding: 3px 0; vertical-align: middle; }
#keys-modal td:first-child { padding-right: 14px; white-space: nowrap; }
kbd {
  display:       inline-block;
  background:    var(--theme-color-btn2-bg);
  border:        1px solid var(--theme-color-btn2-border);
  border-radius: 3px;
  padding:       1px 5px;
  font-family:   var(--theme-font-ui, monospace);
  font-size:     0.78rem;
  color:         var(--theme-color-text);
}

@keyframes congrats-pop {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}
#congrats {
  background:     var(--theme-color-congrats-bg);
  color:          var(--theme-color-congrats-text);
  border:         2px solid var(--theme-color-congrats-border);
  border-radius:  var(--theme-card-radius);
  padding:        28px 36px;
  text-align:     center;
  animation:      congrats-pop 200ms ease-out;
}
#congrats-msg {
  font-size:      1.2rem;
  font-weight:    bold;
  letter-spacing: 0.04em;
}
#congrats-time {
  font-size:      1rem;
  font-weight:    normal;
  margin-top:     8px;
  letter-spacing: 0;
  opacity:        0.85;
}
#congrats-actions {
  display:         flex;
  flex-wrap:       wrap;
  gap:             12px;
  justify-content: center;
  margin-top:      20px;
}
#congrats-copy-btn,
#congrats-view-btn,
#congrats-play-btn {
  background:   var(--theme-color-btn2-bg);
  border-color: var(--theme-color-btn2-border);
  color:        var(--theme-color-text);
}
#congrats-play-btn { font-weight: bold; }

#done-wrong {
  margin-top:     20px;
  padding:        16px 24px;
  border-radius:  var(--theme-card-radius);
  background:     var(--theme-color-wrong-bg);
  border:         2px solid var(--theme-color-wrong-border);
  color:          var(--theme-color-wrong-text);
  font-size:      1.05rem;
  font-weight:    bold;
  text-align:     center;
  letter-spacing: 0.04em;
}

/* Phone solving view (shared/engine-phone.mjs; structure in base.css). The keys take
   the secondary-button tokens and sit in a tray of the hover shade. */
html.phone #solve-view { background: var(--theme-color-bg); }
html.phone .solve-top  { border-bottom: 2px solid var(--theme-color-header-rule); }
html.phone .solve-title {
  font-family: var(--theme-font-display);
  color:       var(--theme-color-title);
}
html.phone .solve-byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
}
html.phone #intro { background: var(--theme-color-overlay); }
html.phone .intro-card {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border-radius: var(--theme-card-radius);
}
html.phone #clues-btn {
  font-family:    var(--theme-font-button);
  background:     var(--theme-color-btn2-bg);
  border-color:   var(--theme-color-btn2-border);
  color:          var(--theme-color-text);
  letter-spacing: var(--theme-button-tracking);
}
html.phone #solve-bar  { border-top: 1px solid var(--theme-color-bar-border); }
html.phone .bar-step   { background: transparent; color: var(--theme-color-muted); }
html.phone .nav-label  { color: var(--theme-color-title); }
html.phone .nav-count  { color: var(--theme-color-muted); }
html.phone #drawn-kb {
  background: var(--theme-color-btn2-hover);
  border-top: 1px solid var(--theme-color-bar-border);
}
html.phone #drawn-kb button {
  font-family:  var(--theme-font-button);
  background:   var(--theme-color-btn2-bg);
  border:       1px solid var(--theme-color-btn2-border);
  color:        var(--theme-color-text);
}
html.phone #drawn-kb button:active { background: var(--theme-color-clue-hover); }
/* The fill-in list's cells, as the grid colors its own: the active clue's row as its
   active entry, the cursor as its active cell. */
html.phone .list-cell {
  font-family: var(--theme-font-cell);
  background:  var(--theme-color-cell-bg);
  border:      1px solid var(--theme-color-cell-stroke);
  color:       var(--theme-color-cell-text);
}
html.phone .clue-item.active-clue .list-cell { background: var(--theme-color-highlight); }
html.phone .clue-item .list-cell.list-cursor {
  background:   var(--theme-color-active);
  border-color: var(--theme-color-active-stroke);
  box-shadow:   inset 0 0 0 1px var(--theme-color-active-stroke);
}
/* A checked cell keeps its correct fill under the active clue's row, as in the grid; the
   cursor changes only its outline. This follows the cursor rule above, which it ties
   with on specificity. */
html.phone .clue-item .list-cell.correct {
  background:   var(--theme-color-correct-bg);
  border-color: var(--theme-color-correct-stroke);
  color:        var(--theme-color-correct-text);
}
html.phone .clue-item .list-cell.correct.list-cursor { border-color: var(--theme-color-active-stroke); }
/* A cell composing a rebus dashes its outline, as in the grid (the inset shadow would
   fill the dashes in, so it goes). */
html.phone .clue-item .list-cell.list-cursor.composing {
  border-width: 2px;
  border-style: dashed;
  box-shadow:   none;
}

/* ── Per-tool selectors (body class hook: .tool-<name>) ─────────────────────
   Each tool's <body> carries a class like .tool-snake-charmer so these rules
   scope to the right tool without a separate per-tool CSS file. Plain sizing and
   spacing that reads no --theme-* token belongs in the tool's template base.css
   instead: the .tool- prefix outranks the tool's print.css, whose @media print
   rules would then silently never apply. */

/* Snake Charmer */
.tool-snake-charmer .cell.secondary-entry { fill: var(--theme-color-secondary-entry); }
.tool-snake-charmer .cell.active-cell.secondary-entry {
  fill:         var(--theme-color-secondary-active);
  stroke:       var(--theme-color-secondary-active-stroke);
  stroke-width: 1.5;
}
/* A checked cell stays green under the secondary highlight. The two rules above beat the
   unnamespaced .cell.correct on specificity; these tie with them and follow. */
.tool-snake-charmer .cell.correct.secondary-entry {
  fill:   var(--theme-color-correct-bg);
  stroke: var(--theme-color-correct-stroke);
}
.tool-snake-charmer .cell.correct.active-cell.secondary-entry { stroke: var(--theme-color-active-stroke); }

/* Marching Bands — band fills are unnamespaced to keep :where() specificity
   below .cell.active-entry (0,2,0); .band-even/.band-odd are MB-exclusive.
   Prefixing with .tool-marching-bands would raise these to 0,2,0 too, tying
   with active-entry and leaving the winner to source order (wrong) — dead
   CSS in other tools, but harmless since the classes are MB-exclusive. */
.cell:where(.band-even) { fill: var(--theme-color-band-even); }
.cell:where(.band-odd)  { fill: var(--theme-color-cell-bg); }
.cell.band-even.active-entry { fill: var(--theme-color-highlight-band-even); }
.tool-marching-bands .band-label  { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }
.tool-marching-bands .row-label   { font-family: var(--theme-font-cell); fill: var(--theme-color-text); }
.tool-marching-bands .cell-center { fill: var(--theme-color-cell-center); }
.tool-marching-bands .clue-group:hover          { background: var(--theme-color-clue-hover); }
.tool-marching-bands .clue-group.active-clue    { background: var(--theme-color-active); }
.tool-marching-bands .clue-group.secondary-entry { background: var(--theme-color-secondary-entry); }

/* Spiral */
.tool-spiral #center-curl       { fill: none; stroke: var(--theme-color-curl); stroke-width: 1.4; stroke-linecap: round; }
.tool-spiral #direction-chevron { stroke: var(--theme-color-active-stroke); stroke-width: 0.9; opacity: 0.5; }
/* Crushword, and Marching Bands when stacked */
/* Opaque background is load-bearing, not cosmetic: .puzzle-center is
   position:sticky over the clues (each tool's base.css), which scroll directly
   underneath it in the same horizontal space — without this, clue text
   would show through the sticky grid as it scrolls. */
.tool-crushword .puzzle-center,
.tool-marching-bands .puzzle-center { background: var(--theme-color-bg); }

/* Crushword */
.tool-crushword .cell-block  { fill: var(--theme-color-cell-center); }
/* Every Crushword cell composes from its first keystroke, so the shared
   dashed outline would flag nothing; reset to plain .active-cell. */
.tool-crushword .cell.active-cell.composing { stroke-width: 1.5; stroke-dasharray: none; }
/* Deliberately static: a blink competes for attention in a dense grid. */
.tool-crushword .cell-caret { fill: var(--theme-color-cell-text); pointer-events: none; }

/* Shared print resets — the final override layer for printing, applied to
   every tool and theme. Prints the blank, unsolved puzzle regardless of solve state
   or theme. Declarations are !important by design so this layer wins over any
   theme rule regardless of its selector specificity or source order — a tool
   theme that later adds a higher-specificity highlight rule can't silently
   defeat the print reset. A tool's print.css that needs to override a reset
   here must also use !important. */
@media print {
  /* Hide interaction chrome */
  #active-clue-bar,
  #controls,
  #congrats-dialog,
  #keys-overlay,
  #keys-btn,
  #menu-btn,
  #menu-panel,
  #done-wrong,
  .solve-top,
  #solve-bar,
  #drawn-kb { display: none !important; }

  body { padding-top: 0 !important; }

        focusCell(entryFirstCell(direction, target));
        return;
      }
      if (e.key === "ArrowRight") {
        e.preventDefault();
        focusCell(nextInDir(activeCell, direction));
        return;
      }
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        focusCell(prevInDir(activeCell, direction));
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        toggleRebus();
        return;
      }
      if (e.key === "Backspace") {
        e.preventDefault();
        if (composer.backspace(activeCell)) {
          syncUI();
          saveState();
          return;
        }
        if (getCellLetter(activeCell)) {
          setCellLetter(activeCell, "");
          syncUI();
        } else {
          const prev = prevInDir(activeCell, direction);
          setCellLetter(prev, "");
          focusCell(prev);
        }
        saveState();
        return;
      }
      if (e.key === " ") {
        e.preventDefault();
        setCellLetter(activeCell, "");
        saveState();
        focusCell(nextInDir(activeCell, direction));
        return;
      }
      if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "PageUp" || e.key === "PageDown") {
        e.preventDefault();
        scrollByKey(e.key);
      }
    }, { keysOverlay, refocus });
    hiddenInput.addEventListener("input", () => {
      const typed = normalize(hiddenInput.value);
      hiddenInput.value = "";
      if (latch.solved || !typed) return;
      timer.onFirstInput();
      if (composer.typeLetter(activeCell, typed)) focusCell(nextInDir(activeCell, direction));
      else syncUI();
      checker.checkIfFilled();
      saveState();
    });
    setupCellClicks(svg, (n) => {
      if (n === activeCell) direction = DIRS[direction].opposite;
      focusCell(n);
    });
    svg.addEventListener("click", (e) => {
      if (e.target === svg) refocus();
    });
    function resetBoard() {
      resetAndRefocus({
        composer,
        clearState,
        timer,
        latch,
        clearBoard() {
          cells.clearCells();
          clueItems.forEach((li) => li.classList.remove("correct"));
          flashLayer.replaceChildren();
          direction = "inward";
        },
        focusInitial: () => focusCell(FIRST_CELL)
      });
    }
    const controls = setupControls({
      checkBtn,
      checker,
      hashed: data.hashed,
      onCheck: checkCell,
      onClear: resetBoard,
      refocus,
      key: saveKey
    });
    const phone = setupPhoneLayout({
      hiddenInput,
      checkBtn,
      refocus,
      firstVisit: !hasSave(),
      grid: document.getElementById("grid-wrap"),
      lists: [document.querySelector(".clue-section-inward"), document.querySelector(".clue-section-outward")],
      clueBar,
      fillList: {
        items: fillItems,
        getLetter: getCellLetter,
        isCorrect,
        isComposing: composer.isComposing,
        onCellTap: (i, j) => {
          direction = fillItems[i].dir;
          focusCell(fillItems[i].cells[j]);
        }
      },
      bottomRow: [
        { label: "\u25C2", key: "ArrowLeft", glyph: true },
        { el: document.getElementById("rebus-btn") },
        { label: "In \u21C4 Out", key: ".", wide: true },
        { label: "\u25B8", key: "ArrowRight", glyph: true }
      ]
    });
    const resumeCell = restoreAndSeal({ restoreState, checker, latch, composer });
    focusCell(resumeCell === null ? FIRST_CELL : resumeCell);
  }
  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
