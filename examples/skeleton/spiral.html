@layer base, tool, theme, phone, print;
@layer base {
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* An ID or class rule that sets `display` on a [hidden] element (e.g. #menu-panel's
   `display: flex` below) otherwise outranks the UA [hidden] default by specificity,
   leaving the element stuck visible. */
[hidden] { display: none !important; }

/* iOS Safari enlarges text when a phone turns to landscape unless told not to, and the
   landscape phone layout (phone.css) counts on its line heights. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body { line-height: 1.4; }

/* Measurements other rules are computed from, here and in theme-components.css. Change
   one here and every position derived from it follows.
   --corner-*: the round buttons fixed in the page's corners (#keys-btn, #menu-btn,
   #help-btn): their size, their inset from the edges, and the gap between two of them
   and between a button and the panel it opens.
   --tap-min: the smallest side of anything tapped in the phone layout. */
:root {
  --corner-btn: 32px;
  --corner-inset: 20px;
  --corner-gap: 8px;
  --corner-btn-2: calc(var(--corner-inset) + var(--corner-btn) + var(--corner-gap));
  --tap-min: 44px;
}

/* Tools with a fixed active-clue bar reserve its height as body padding, and expose it
   as --active-clue-bar-space for anything positioned against the bar (#menu-btn and
   #menu-panel in theme-components.css). The bar's min-height fills that space, and its
   clue text can never wrap (nowrap + ellipsis), so this is an exact height, not a
   floor — which is what makes calc()-only positioning against it exact. */
body.has-clue-bar {
  --active-clue-bar-space: 56px;
  padding-top: var(--active-clue-bar-space);
}

#active-clue-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  min-height: var(--active-clue-bar-space);
  padding: 5px 16px 4px;
}

.active-clue-row {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-size: 0.875rem;
  line-height: 1.4;
}

#active-clue-secondary {
  font-size: 0.8rem;
  opacity: 0.6;
}

.active-clue-num {
  font-weight: bold;
  flex-shrink: 0;
}

.active-clue-text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* By class, not id: the phone layout shows copies of #instructions (setupPhoneLayout),
   which carry the class but can't carry the id. */
.instructions {
  max-width: 600px;
  margin: 0 auto;
}

/* The page column and the clue lists look the same in every tool, so their sizes live
   here and not in a tool's base.css (docs/ARCHITECTURE.md → "Tool stylesheets"). */
.puzzle-main { max-width: 1300px; margin: 0 auto; padding: 20px 16px; }

.clue-section h2 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

/* Crushword's crossings panel heading, a small label like the list headings above. */
#crossings h3 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.clue-section :is(ul, ol) { list-style: none; }

.clue-item {
  display: flex;
  align-items: baseline;
  cursor: pointer;
  margin-bottom: 4px;
  padding: 2px 6px 2px 2px;
  font-size: 0.875rem;
  line-height: 1.4;
}

/* The number, label or cell range ahead of a clue's text. */
.clue-num {
  flex-shrink: 0;
  min-width: 1.6em;
  margin-right: 4px;
  font-size: 0.7rem;
  font-weight: bold;
  text-align: right;
}

.cell        { cursor: pointer; }
.cell-letter { pointer-events: none; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
.cell-num    { pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
.style-circle { pointer-events: none; }
/* The active cell's direction chevron (Spiral, Marching Bands). */
#direction-chevron { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

#controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

/* font-family is theme-components.css's: a button inherits no font from the page. */
button {
  cursor: pointer;
  border: 1px solid;
  padding: 6px 14px;
  font-size: 0.875rem;
}

/* Suppress double-tap-to-zoom and its tap delay on the in-solve controls, which are
   tapped repeatedly (#rebus-btn especially) so the delay is felt. Scoped to #controls
   rather than every button: the modal and dialog buttons are tapped once and have no
   reason to change hit-testing behavior. */
#controls button { touch-action: manipulation; }

button:disabled { opacity: 0.4; cursor: default; }
/* A browser sends no mouse events to a disabled button, so a press on a disabled help row
   would take focus from the puzzle before setupPopupMenu's panel mousedown handler could
   stop it. With pointer events off, the press lands on the panel itself, where it can. */
#help-panel button:disabled { pointer-events: none; }

/* Reserve the width of the widest label each button can show, so swapping the label
   never reflows its container — #menu-panel for #clear-btn (shrink-to-fit width,
   sized off this reservation, not the panel's own min-width), #controls for
   #rebus-btn. #clear-btn swaps Clear puzzle→Are you sure?, #rebus-btn Rebus→Done.
   The two armed buttons reserve both strings, one per line, so the width is the wider of
   the two whichever font renders them: 'Are you sure?' is wider than 'Clear puzzle' in
   some fonts and narrower in others (likewise 'Reveal puzzle'). #rebus-btn reserves
   its longer string, 'Rebus'. */
#clear-btn::after,
#reveal-puzzle-btn::after,
#rebus-btn::after {
  display: block;
  height: 0;
  overflow: hidden;
  visibility: hidden;
}
#clear-btn::after { content: 'Clear puzzle\A Are you sure?'; white-space: pre; }
#reveal-puzzle-btn::after { content: 'Reveal puzzle\A Are you sure?'; white-space: pre; }
#rebus-btn::after { content: 'Rebus'; }

/* Fixed, not absolute: a fixed element is always inside the viewport, so focusing it
   never scrolls the page. */
#hidden-input {
  position: fixed;
  left: -9999px;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.puzzle-toggle { display: flex; overflow: hidden; }
.puzzle-toggle .toggle-opt { border: none; flex: 1; white-space: nowrap; }
.toggle-opt { user-select: none; }

/* The switch tip (setupSwitchTip, shared/engine-chrome.mjs), placed by script. Its arrow
   sits --arrow-x from its left edge, on the side facing what it points at: the top, or
   the bottom when .above. Below the fixed corner buttons. */
.switch-tip {
  position: absolute;
  z-index: 40;
  white-space: nowrap;
  padding: 6px 12px;
  font-size: 0.85rem;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;   /* SWITCH_TIP_FADE_MS */
}
.switch-tip.shown { opacity: 1; }
.switch-tip::before {
  content: '';
  position: absolute;
  left: var(--arrow-x);
  bottom: 100%;
  margin-left: -6px;
  border: 6px solid transparent;
}
.switch-tip.above::before { bottom: auto; top: 100%; }
@media (prefers-reduced-motion: reduce) {
  .switch-tip { transition: none; }
}

#keys-btn,
#menu-btn {
  position: fixed;
  right: var(--corner-inset);
  width: var(--corner-btn);
  height: var(--corner-btn);
  font-size: 1rem;
  font-weight: bold;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

#keys-btn {
  bottom: var(--corner-inset);
  z-index: 50;
}

/* The help menu's life-ring button, immediately left of #menu-btn (--corner-btn-2: the
   inset, a button and a gap). Same `top` as #menu-btn, so the two share the
   .has-clue-bar override (theme-components.css). The phone puts it in the top bar
   instead (phone.css). */
#help-btn {
  position: fixed;
  top: var(--corner-inset);
  right: var(--corner-btn-2);
  z-index: 110;
  width: var(--corner-btn);
  height: var(--corner-btn);
  padding: 0;
  display: grid;
  place-items: center;
}

/* Fixed top-right corner, mirroring #keys-btn's bottom-right circle. The
   clue-bar tools override `top` (theme-components.css) to sit the button inside
   #active-clue-bar's band instead of at this default offset — see that override for
   why. */
#menu-btn {
  top: var(--corner-inset);
  z-index: 110;
  /* The ☰ glyph's ink sits ~1px below its line box's center; asymmetric padding nudges
     it up to compensate (pinned by an e2e pixel measurement). */
  padding-bottom: 8px;
}

/* Non-modal dropdown — plain div, not <dialog>, so the page behind it stays
   interactive. The [hidden] reset above (!important) wins over this display:flex
   while the panel is closed. */
#menu-panel,
#help-panel {
  position: fixed;
  top: var(--corner-btn-2);
  right: var(--corner-inset);
  z-index: 110;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  min-width: 120px;
}
/* Opens under #help-btn, aligned to its right edge rather than ☰'s. */
#help-panel { right: var(--corner-btn-2); }

/* Matches #clear-btn's padding and font-size (theme-components.css)
   so the menu-panel rows all read as plain, equally-weighted menu items — a flat
   hoverable strip, not a bordered "submit button" next to a bare checkbox. */
.menu-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
  padding: 6px 8px;
}
.menu-toggle input { cursor: pointer; }

/* Native <dialog>: raised to the top layer by showModal() and dimmed via
   ::backdrop — no positioning or z-index needed. The dialog is a transparent
   frame; #keys-modal / the congrats card (inside it) is the visible card.
   `margin: auto` restores the UA modal centering that the global
   `* { margin: 0 }` reset above would otherwise defeat (the UA
   `dialog:modal { inset: 0 }` is still in effect). */
#keys-overlay,
#congrats-dialog {
  margin: auto;
  padding: 0;
  border: none;
  background: transparent;
  max-width: 100vw;
  max-height: 100vh;
}

/* A wrong check's flash, on a grid cell and on a Clues-screen cell. FLASH_WRONG_MS in
   engine-chrome.mjs must match the duration. */
:root {
  --flash-wrong-color: #ef9a9a;
  --flash-wrong-duration: 600ms;
}
@keyframes flash-wrong {
  0%   { opacity: 1; }
  20%  { opacity: 1; }
  100% { opacity: 0; }
}
.flash-wrong-overlay {
  fill: var(--flash-wrong-color);
  pointer-events: none;
  animation: flash-wrong var(--flash-wrong-duration) ease-out forwards;
}
/* No end keyframe: it fades to the cell's own background. */
@keyframes flash-wrong-cell {
  0%, 20% { background: var(--flash-wrong-color); }
}
html.phone .list-cell.flash-wrong { animation: flash-wrong-cell var(--flash-wrong-duration) ease-out; }

}
@layer tool {
#grid-wrap {
  display: flex;
  justify-content: center;
  width: 100%;
}

#spiral-svg {
  max-width: min(100%, 500px);
  height: auto;
  display: block;
}

.puzzle-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) min(500px, 100%) minmax(0, 1fr);
  grid-template-areas: "left center right";
  gap: 0 32px;
  align-items: start;
}

.puzzle-center        { grid-area: center; }
.clue-section-inward  { grid-area: left; }
.clue-section-outward { grid-area: right; }

.puzzle-center {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

@media (max-width: 880px) {
  .puzzle-body {
    display: block;
  }
  .clue-section-inward,
  .clue-section-outward {
    margin-top: 24px;
  }
}

/* A cell range ("12–18.") is wider than a clue number. */
.clue-range {
  min-width: 5em;
  font-variant-numeric: tabular-nums;
}

}
@layer theme {
/* theme-base: neutral defaults — every --theme-* var a theme can override.
   A theme's <name>-tokens.css need only override what differs from these. */
:root {
  /* Fonts */
  --theme-font-body:    system-ui, -apple-system, sans-serif;
  --theme-font-display: var(--theme-font-body);
  --theme-font-button:  var(--theme-font-body);
  --theme-font-cell:    var(--theme-font-body);

  /* Masthead / title / byline */
  --theme-color-header-rule: #cccccc;
  --theme-header-align:      center;
  --theme-title-size:        2rem;
  --theme-title-tracking:    normal;
  --theme-title-transform:   none;
  --theme-color-title:       var(--theme-color-text);
  --theme-byline-style:      normal;
  --theme-byline-size:       0.875rem;

  /* Page */
  --theme-color-bg:    #ffffff;
  --theme-color-text:  #111111;
  --theme-color-muted: #555555;
  --theme-color-link:  #0000ee;

  /* Bars / borders */
  --theme-color-bar-border:  #cccccc;
  --theme-color-soft-border: #cccccc;

  /* Corner radii: text buttons, toggles and keys; and the round menu, help and keys
     buttons. */
  --theme-control-radius:     4px;
  --theme-icon-button-radius: 50%;

  /* Primary button */
  --theme-color-btn-bg:       #333333;
  --theme-color-btn-text:     #ffffff;
  --theme-button-tracking:    0.05em;

  /* Secondary / toggle button colors */
  --theme-color-btn2-bg:     #eeeeee;
  --theme-color-btn2-border: #aaaaaa;
  --theme-color-btn2-hover:  #e0e0e0;

  /* Clear button */
  --theme-color-clear-fg:       #999999;
  --theme-color-clear-hover-fg: #333333;

  /* Grid cells */
  --theme-color-cell-bg:     #ffffff;
  --theme-color-cell-stroke: #999999;
  --theme-color-cell-text:   #111111;

  /* Cell / clue states */
  --theme-color-highlight:            #deeeff;
  --theme-color-band-even:            var(--theme-color-cell-bg);
  --theme-color-highlight-band-even:  var(--theme-color-highlight);
  --theme-color-active:               #b8d4f5;
  --theme-color-active-stroke:        #1e5799;
  /* The active clue row or block (Marching Bands' clue groups):
     a theme whose active shade is too strong over that much area softens it here. */
  --theme-color-active-clue:          var(--theme-color-active);
  --theme-color-clue-hover:           #eeeeee;
  --theme-color-secondary-entry:      #f0f0f0;
  --theme-clue-radius:                2px;

  /* Snake-charmer-specific secondary-active cell */
  --theme-color-secondary-active:        #7aaed8;
  --theme-color-secondary-active-stroke: #3a72a8;

  /* Cell marks: a checked letter's color, the revealed flag and the wrong slash. A mark
     never touches the cell's fill (theme-components.css → .mark-flag). */
  --theme-color-checked-text:  #166534;
  --theme-color-revealed-flag: #166534;
  --theme-color-wrong-slash:   #991b1b;

  /* Filled clue: every cell the clue owns has content, right or wrong — like crossing it
     off by hand. Distinct from Correct above (whole board verified). Defaults are no-ops;
     a theme opts in. Contract: docs/CROSS_TOOL_SPEC.md → "Filled clues". */
  --theme-clue-filled-decoration: none;
  --theme-clue-filled-opacity:    1;

  /* Decorations */
  --theme-color-circle:      #cccccc;
  --theme-color-curl:        #aaaaaa;
  --theme-color-cell-center: #222222;

  /* Instructions */
  --theme-color-instructions: var(--theme-color-muted);
  --theme-instructions-size:  0.85rem;

  /* Congrats / overlay */
  --theme-color-overlay:         rgba(0, 0, 0, 0.45);
  --theme-color-congrats-bg:     #2e7d32;
  --theme-color-congrats-border: #1b5e20;
  --theme-color-congrats-text:   #ffffff;
  --theme-card-radius:           10px;

  /* Phone: the zoomed grid's edge shadow, where more grid lies past the view */
  --theme-color-edge-shadow: rgba(0, 0, 0, 0.28);

  /* Done-wrong */
  --theme-color-wrong-bg:     #fff3e0;
  --theme-color-wrong-border: #e65100;
  --theme-color-wrong-text:   var(--theme-color-text);

  /* Danger */
  --theme-color-danger: #b91c1c;
}

/* Skeleton theme — dark purple, strong personality. Overrides theme-base. */
:root {
  --theme-font-body:    'Outfit', system-ui, sans-serif;
  --theme-font-display: 'Outfit', system-ui, sans-serif;
  --theme-font-button:  'Outfit', system-ui, sans-serif;
  --theme-font-cell:    'Outfit', system-ui, sans-serif;

  --theme-color-header-rule: #7c3aed;
  --theme-title-tracking:    0.06em;
  --theme-title-transform:   uppercase;
  --theme-color-title:       #f0e6ff;
  --theme-byline-style:      normal;
  --theme-byline-size:       0.9rem;

  --theme-color-bg:    #1a1520;
  --theme-color-text:  #ede9fe;
  --theme-color-muted: #a78bfa;
  --theme-color-link:  #c4b5fd;

  --theme-color-bar-border:  #7c3aed;
  --theme-color-soft-border: #4c3a6e;

  --theme-color-btn-bg:       #7c3aed;
  --theme-button-tracking:    0.08em;

  --theme-color-btn2-bg:     #1e1728;
  --theme-color-btn2-border: #7c3aed;
  --theme-color-btn2-hover:  #2d1f5e;

  --theme-color-clear-fg:       #7c5aad;
  --theme-color-clear-hover-fg: #a78bfa;

  --theme-color-cell-bg:     #1e1728;
  --theme-color-cell-stroke: #4c3a6e;
  --theme-color-cell-text:   #ffffff;

  --theme-color-highlight:       #2d1f5e;
  --theme-color-band-even:       #221b2e;
  /* skeleton keeps no distinct even-band active shade: leave
     --theme-color-highlight-band-even at its default (= --theme-color-highlight). */
  --theme-color-active:          #3b1f6e;
  --theme-color-active-stroke:   #9333ea;
  --theme-color-clue-hover:      #2d1f5e;
  --theme-color-secondary-entry: #261840;

  --theme-color-secondary-active:        #2a1060;
  --theme-color-secondary-active-stroke: #7c3aed;

  --theme-color-checked-text:  #4ade80;
  --theme-color-revealed-flag: #4ade80;
  --theme-color-wrong-slash:   var(--theme-color-danger);

  --theme-color-circle:      #6d28d9;
  --theme-color-curl:        #6d28d9;
  --theme-color-cell-center: #0d0b12;

  --theme-color-instructions: var(--theme-color-text);

  --theme-color-overlay:         transparent;
  --theme-color-congrats-bg:     #14532d;
  --theme-color-congrats-border: #16a34a;
  --theme-color-congrats-text:   #4ade80;

  /* A dark shadow vanishes on this dark ground: the edge glows in the accent instead. */
  --theme-color-edge-shadow: rgba(139, 92, 246, 0.45);

  --theme-color-wrong-bg:     #3d1515;
  --theme-color-wrong-border: #dc2626;
  --theme-color-wrong-text:   #fca5a5;

  --theme-color-danger: #ef4444;
}

/* theme-components: every tool-agnostic selector, driven entirely by --theme-*.
   Per-tool namespaced sections live at the bottom (body class hook: .tool-<name>).

   SVG cell states (.cell.active-entry / .cell.active-cell) live here safely:
   marching-bands' band rules use :where() (specificity 0,1,0) so these 0,2,0
   rules always win regardless of source order. */

body {
  background:   var(--theme-color-bg);
  color:        var(--theme-color-text);
  font-family:  var(--theme-font-body);
}

/* Masthead */
.puzzle-header {
  text-align:     var(--theme-header-align);
  border-bottom:  2px solid var(--theme-color-header-rule);
  padding-bottom: 12px;
  margin-bottom:  24px;
}
h1.title {
  font-family:     var(--theme-font-display);
  font-size:       var(--theme-title-size);
  line-height:     1;
  letter-spacing:  var(--theme-title-tracking);
  text-transform:  var(--theme-title-transform);
  color:           var(--theme-color-title);
}
.byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
  font-size:  var(--theme-byline-size);
  margin-top: 6px;
}

#active-clue-bar {
  background:    var(--theme-color-bg);
  border-bottom: 1px solid var(--theme-color-bar-border);
}
html.phone #clue-full {
  background: var(--theme-color-bg);
  color:      var(--theme-color-text);
  border-top: 1px solid var(--theme-color-bar-border);
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.15);
}

/* #menu-btn and #help-btn sit *within* #active-clue-bar's own band instead of floating
   below it as a separate row — no extra vertical space. Pure CSS calc() against the
   bar's min-height (base.css), not JS-measured: nothing has to re-measure it when the
   bar or the viewport resizes. --corner-* are the buttons' measurements (base.css). A
   tool with no bar (Marching Bands, and Crushword outside the phone layout) keeps the
   plain default `top`. The phone layout moves the buttons into its top bar instead
   (phone.css). */
.has-clue-bar #menu-btn,
.has-clue-bar #help-btn { top: calc((var(--active-clue-bar-space) - var(--corner-btn)) / 2); }

/* #menu-panel and #help-panel open directly below the bar's bottom edge (8px gap,
   matching Marching Bands' static button-to-panel gap from base.css) — same
   CSS-not-JS reasoning as the buttons above. */
.has-clue-bar #menu-panel,
.has-clue-bar #help-panel { top: calc(var(--active-clue-bar-space) + var(--corner-gap)); }

/* Right gutter for the bar's own text now that #menu-btn shares its row: its width and
   inset, plus a gap to the text. Lives here rather than in base.css's shared
   #active-clue-bar rule since only Snake Charmer and Spiral place the button there.
   A page with a help button (setupHelpMenu puts `has-help-btn` on <body>; a hashed
   build has none) also reserves its width and the gap between them. Same specificity as
   the rule above, so it follows it; the phone layer overrides both. */
.has-clue-bar #active-clue-bar { padding-right: var(--corner-btn-2); }
.has-help-btn #active-clue-bar { padding-right: calc(var(--corner-btn-2) + var(--corner-btn) + var(--corner-gap)); }

/* Direction label ("Across"/"Down", "In"/"Out") before the bar's clue number. */
.active-clue-dir {
  font-size:      0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color:          var(--theme-color-muted);
  opacity:        0.6;
  flex-shrink:    0;
}

.instructions {
  color:         var(--theme-color-instructions);
  font-size:     var(--theme-instructions-size);
  line-height:   1.5;
  margin-bottom: 20px;
}
.instructions p + p { margin-top: 0.6em; }

/* Links in a clue or the instructions (markdown). Visited ones keep the color: the
   browser's own visited purple is unreadable on a dark theme. */
a { color: var(--theme-color-link); }

.clue-item { border-radius: var(--theme-clue-radius); }
/* Clue-row highlights for the tools whose rows are <li class="clue-item"> (Marching
   Bands highlights its .clue-group instead, below). :where() keeps :hover at the same
   specificity as the state rules, so the state rules that follow win by source order. */
:where(.tool-snake-charmer, .tool-spiral, .tool-crushword) .clue-item:hover { background: var(--theme-color-clue-hover); }
.clue-item.active-clue     { background: var(--theme-color-active-clue); }
.clue-item.secondary-entry { background: var(--theme-color-secondary-entry); }
.clue-item.filled .clue-text { text-decoration: var(--theme-clue-filled-decoration); opacity: var(--theme-clue-filled-opacity); }

#crossings h3 { color: var(--theme-color-muted); }

.clue-section h2 {
  color:          var(--theme-color-text);
  border-bottom:  1px solid var(--theme-color-soft-border);
  padding-bottom: 4px;
}

/* Every button: a button takes the browser's own font unless told otherwise. */
button { font-family: var(--theme-font-button); }

/* Corner radii: one for every text button, toggle and key (the phone keyboard's too),
   another for the three icon buttons. No other layer sets a radius on these.
   .puzzle-toggle's options, buttons themselves, stay square inside its frame. */
button,
.puzzle-toggle,
.menu-toggle,
kbd { border-radius: var(--theme-control-radius); }
.puzzle-toggle .toggle-opt { border-radius: 0; }
#menu-btn,
#help-btn,
#keys-btn { border-radius: var(--theme-icon-button-radius); }

/* Primary button: the phone's first-visit Start */
html.phone .intro-card > button {
  font-size:      0.95rem;
  padding:        8px 22px;
  background:     var(--theme-color-btn-bg);
  color:          var(--theme-color-btn-text);
  border:         none;
  letter-spacing: var(--theme-button-tracking);
}
/* Clear button — flat, borderless, left-aligned, matching .menu-toggle
   (base.css): all are plain menu-panel rows now, not a bordered pill next to a
   bare checkbox. Color cues (armed, hover) carry entirely through text color
   and the shared row-hover background instead of a border. */
#clear-btn {
  font-size:      0.8rem;
  padding:        6px 8px;
  background:     transparent;
  border:         none;
  text-align:     left;
  color:          var(--theme-color-clear-fg);
  letter-spacing: var(--theme-button-tracking);
}
#clear-btn:hover              { color: var(--theme-color-clear-hover-fg); }
#clear-btn.armed              { color: var(--theme-color-danger); }
/* With no hover on a phone, the pale resting color reads as disabled next to the menu's
   other rows, so it takes the text color there; the armed state stays danger. */
html.phone #clear-btn         { color: var(--theme-color-text); }
html.phone #clear-btn.armed   { color: var(--theme-color-danger); }
#clear-btn:hover,
.menu-toggle:hover { background: var(--theme-color-clue-hover); }

/* Rebus button — the pointer route into multi-letter entry, mirroring the Enter key.
   It is disabled only where composition is refused whatever the cell's capacity (see
   setupRebusButton in shared/engine-chrome.mjs); otherwise it looks identical on every
   square, in every build, which keeps it from signalling which cells are rebus.
   Composition-in-progress is shown on the cell itself (.cell.active-cell.composing
   below), so the button carries only its label — whose width is reserved in
   shared/base.css so the Rebus→Done swap does not reflow #controls. */
#rebus-btn {
  font-size:      0.8rem;
  padding:        5px 12px;
  background:     transparent;
  color:          var(--theme-color-muted);
  border-color:   var(--theme-color-btn2-border);
  letter-spacing: var(--theme-button-tracking);
}
#rebus-btn:hover:not(:disabled) { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Puzzle toggle (direction / mode / loop) */
.puzzle-toggle { border: 1px solid var(--theme-color-btn2-border); }
.toggle-opt {
  font-size:      0.9rem;
  font-weight:    bold;
  padding:        6px 16px;
  background:     var(--theme-color-btn2-bg);
  color:          var(--theme-color-muted);
  letter-spacing: 0.04em;
}
.toggle-opt:not(:last-child)   { border-right: 1px solid var(--theme-color-btn2-border); }
.toggle-opt.active             { background: var(--theme-color-btn-bg); color: var(--theme-color-btn-text); cursor: default; }
.toggle-opt:not(.active):hover { background: var(--theme-color-btn2-hover); }

/* Switch tip: the button colors, ringed (arrow included) in the page's color, so a tip
   that crosses a block of the same dark color still stands apart from it. */
.switch-tip {
  --ring: var(--theme-color-bg);
  background:    var(--theme-color-btn-bg);
  color:         var(--theme-color-btn-text);
  border-radius: var(--theme-control-radius);
  filter: drop-shadow(2px 0 0 var(--ring)) drop-shadow(-2px 0 0 var(--ring))
          drop-shadow(0 2px 0 var(--ring)) drop-shadow(0 -2px 0 var(--ring))
          drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
}
.switch-tip::before       { border-bottom-color: var(--theme-color-btn-bg); }
.switch-tip.above::before { border-bottom-color: transparent; border-top-color: var(--theme-color-btn-bg); }
.switch-tip b             { font-size: 1.15em; }

/* SVG cell states */
.cell              { fill: var(--theme-color-cell-bg); stroke: var(--theme-color-cell-stroke); stroke-width: 0.5; }
.cell.active-entry { fill: var(--theme-color-highlight); }
.cell.active-cell  { fill: var(--theme-color-active); stroke: var(--theme-color-active-stroke); stroke-width: 1.5; }

.style-circle { fill: none; stroke: var(--theme-color-circle); stroke-width: 1; }

/* No font-size on .cell-letter or .cell-num: Spiral sizes these dynamically as SVG
   presentation attributes; a CSS font-size overrides them silently. The other tools
   size them in their own template base.css. */
.cell-letter         { font-family: var(--theme-font-cell); fill: var(--theme-color-cell-text); }
/* A mark never changes the cell's fill, which belongs to the cursor and the highlights:
   a checked cell colors its letter, and the flag and slash are shapes in .mark-layer
   (setupMarkLayer, shared/engine-chrome.mjs). */
.cell-letter[data-mark="checked"] { fill: var(--theme-color-checked-text); }
.mark-shape { pointer-events: none; }
.mark-flag  { fill: var(--theme-color-revealed-flag); }
/* Screen pixels, not user units: each tool's viewBox scales its cells differently. */
.mark-slash { stroke: var(--theme-color-wrong-slash); stroke-width: 2; vector-effect: non-scaling-stroke; }
.cell-num            { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }

/* The direction chevron (Spiral, Marching Bands); each tool sets its stroke width, which
   scales with its own viewBox. */
#direction-chevron { stroke: var(--theme-color-active-stroke); opacity: 0.5; }

/* Multi-letter (rebus) cell content. Sized with transform, not font-size: Spiral writes
   its per-puzzle letter size as an SVG presentation attribute, which any CSS font-size
   rule would outrank (e2e/spiral.spec.js asserts exactly that). transform composes with
   whatever base size each tool established, so one shared block covers all three tools
   with no per-tool font math. The scale pivots on the letter's own x,y, which every
   tool centers its text on (text-anchor middle): setLetterText sets transform-origin
   from those attributes, in the view-box coordinates that transform-box: view-box
   resolves them in. fill-box (the origin as "center") would be simpler, but WebKit
   mis-resolves it for SVG <text>, so the letter slid toward the drawing's top-left. */
.cell-letter          { transform-box: view-box; }
.cell-letter.len-2    { transform: scale(0.62); }
.cell-letter.len-3    { transform: scale(0.45); }
.cell-letter.len-long { transform: scale(0.34); }

/* Rebus entry in progress. Specificity 0,3,0 beats .cell.active-cell (0,2,0) without
   depending on source order; the composing cell is always the active cell, so the
   selector states that invariant rather than working around it. Fill and stroke color
   are inherited from .cell.active-cell — only the dash pattern distinguishes the state,
   so no theme needs a new token. */
.cell.active-cell.composing { stroke-width: 2.5; stroke-dasharray: 4 2; }

/* Congrats modal — backdrop handles the overlay dim; #congrats is the visible card */
#congrats-dialog::backdrop { background: var(--theme-color-overlay); }

/* Keys button (fixed bottom-right corner, created by setupKeysOverlay) */
#keys-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#keys-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Menu and help buttons (fixed top-right corner, created by setupOptionsMenu and
   setupHelpMenu) — same var usage as #keys-btn. */
#menu-btn,
#help-btn {
  background: var(--theme-color-btn2-bg);
  border:     1px solid var(--theme-color-btn2-border);
  color:      var(--theme-color-muted);
}
#menu-btn:hover,
#help-btn:hover { background: var(--theme-color-btn2-hover); color: var(--theme-color-text); }

/* Menu dropdown card — same var usage as #keys-modal. */
#menu-panel,
#help-panel {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border:        2px solid var(--theme-color-soft-border);
  border-radius: var(--theme-card-radius);
}
/* #clear-btn is full width inside the dropdown. */
#menu-panel #clear-btn { width: 100%; }
/* Each button of the help panel is a plain row, as #clear-btn is of ☰'s. */
#help-panel button {
  width:          100%;
  font-size:      0.8rem;
  padding:        6px 8px;
  background:     transparent;
  border:         none;
  color:          var(--theme-color-text);
  text-align:     left;
  letter-spacing: var(--theme-button-tracking);
}
#help-panel button:hover:not(:disabled) { background: var(--theme-color-clue-hover); }
#reveal-puzzle-btn.armed { color: var(--theme-color-danger); }

/* Keys modal — the <dialog> dim is its ::backdrop (skeleton sets this transparent) */
#keys-overlay::backdrop { background: var(--theme-color-overlay); }
#keys-modal {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border:        2px solid var(--theme-color-soft-border);
  border-radius: var(--theme-card-radius);
  padding:       20px 24px;
  min-width:     220px;
}
#keys-modal-header {
  display:         flex;
  justify-content: space-between;
  align-items:     center;
  margin-bottom:   12px;
  font-weight:     bold;
  font-size:       1rem;
  letter-spacing:  0.03em;
}
#keys-close {
  background: transparent;
  border:     none;
  font-size:  1.1rem;
  line-height: 1;
  padding:    0 0 0 12px;
  color:      var(--theme-color-text);
}
#keys-close:hover { opacity: 0.65; }
#keys-modal table { border-collapse: collapse; width: 100%; }
#keys-modal td    { padding: 3px 0; vertical-align: middle; }
#keys-modal td:first-child { padding-right: 14px; white-space: nowrap; }
kbd {
  display:       inline-block;
  background:    var(--theme-color-btn2-bg);
  border:        1px solid var(--theme-color-btn2-border);
  padding:       1px 5px;
  font-family:   monospace;
  font-size:     0.78rem;
  color:         var(--theme-color-text);
}

@keyframes congrats-pop {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}
#congrats {
  background:     var(--theme-color-congrats-bg);
  color:          var(--theme-color-congrats-text);
  border:         2px solid var(--theme-color-congrats-border);
  border-radius:  var(--theme-card-radius);
  padding:        28px 36px;
  text-align:     center;
  animation:      congrats-pop 200ms ease-out;
}
#congrats-msg {
  font-size:      1.2rem;
  font-weight:    bold;
  letter-spacing: 0.04em;
}
#congrats-time {
  font-size:      1rem;
  font-weight:    normal;
  margin-top:     8px;
  letter-spacing: 0;
  opacity:        0.85;
}
#congrats-actions {
  display:         flex;
  flex-wrap:       wrap;
  gap:             12px;
  justify-content: center;
  margin-top:      20px;
}
#congrats-copy-btn,
#congrats-view-btn,
#congrats-play-btn {
  background:   var(--theme-color-btn2-bg);
  border-color: var(--theme-color-btn2-border);
  color:        var(--theme-color-text);
}
#congrats-play-btn { font-weight: bold; }

#done-wrong {
  margin-top:     20px;
  padding:        16px 24px;
  border-radius:  var(--theme-card-radius);
  background:     var(--theme-color-wrong-bg);
  border:         2px solid var(--theme-color-wrong-border);
  color:          var(--theme-color-wrong-text);
  font-size:      1.05rem;
  font-weight:    bold;
  text-align:     center;
  letter-spacing: 0.04em;
}

/* Phone solving view (shared/engine-phone.mjs; structure in phone.css). The keys take
   the secondary-button tokens and sit in a tray of the hover shade. */
html.phone #solve-view { background: var(--theme-color-bg); }
html.phone .solve-top  { border-bottom: 2px solid var(--theme-color-header-rule); }
html.phone .solve-title {
  font-family: var(--theme-font-display);
  color:       var(--theme-color-title);
}
html.phone .solve-byline {
  font-style: var(--theme-byline-style);
  color:      var(--theme-color-muted);
}
html.phone #intro { background: var(--theme-color-overlay); }
html.phone .intro-card {
  background:    var(--theme-color-bg);
  color:         var(--theme-color-text);
  border-radius: var(--theme-card-radius);
}
html.phone #clues-btn {
  background:     var(--theme-color-btn2-bg);
  border-color:   var(--theme-color-btn2-border);
  color:          var(--theme-color-text);
  letter-spacing: var(--theme-button-tracking);
}
html.phone #solve-bar  { border-top: 1px solid var(--theme-color-bar-border); }
/* The zoomed grid's edge shadows: darkest at the side, fading inward. */
html.phone .edge-shadow-stop { stop-color: var(--theme-color-edge-shadow); }
html.phone .bar-step   { background: transparent; color: var(--theme-color-muted); }
html.phone .nav-label  { color: var(--theme-color-title); }
html.phone .nav-count  { color: var(--theme-color-muted); }
html.phone #drawn-kb {
  background: var(--theme-color-btn2-hover);
  border-top: 1px solid var(--theme-color-bar-border);
}
html.phone #drawn-kb button {
  background:   var(--theme-color-btn2-bg);
  border:       1px solid var(--theme-color-btn2-border);
  color:        var(--theme-color-text);
}
html.phone #drawn-kb button:active { background: var(--theme-color-clue-hover); }
/* The fill-in list's cells, as the grid colors its own: the active clue's row as its
   active entry, the cursor as its active cell. */
html.phone .list-cell {
  font-family: var(--theme-font-cell);
  background:  var(--theme-color-cell-bg);
  border:      1px solid var(--theme-color-cell-stroke);
  color:       var(--theme-color-cell-text);
}
html.phone .clue-item.active-clue .list-cell { background: var(--theme-color-highlight); }
html.phone .clue-item .list-cell.list-cursor {
  background:   var(--theme-color-active);
  border-color: var(--theme-color-active-stroke);
  box-shadow:   inset 0 0 0 1px var(--theme-color-active-stroke);
}
/* A list cell shows its grid cell's mark the same way: a checked letter's color, the
   revealed flag as a corner triangle and the wrong slash (an HTML box, so CSS draws
   them). */
html.phone .clue-item .list-cell[data-mark="checked"] { color: var(--theme-color-checked-text); }
html.phone .clue-item .list-cell[data-mark="revealed"]::after {
  content:        '';
  position:       absolute;
  inset:          0;
  background:     var(--theme-color-revealed-flag);
  clip-path:      polygon(70% 0, 100% 0, 100% 30%);
  pointer-events: none;
}
html.phone .clue-item .list-cell[data-mark="wrong"]::after {
  content:        '';
  position:       absolute;
  inset:          0;
  /* Toward the bottom-right, so the midline runs bottom-left to top-right, as on
     the grid. */
  background:     linear-gradient(to bottom right, transparent calc(50% - 1px),
                    var(--theme-color-wrong-slash) calc(50% - 1px),
                    var(--theme-color-wrong-slash) calc(50% + 1px), transparent calc(50% + 1px));
  pointer-events: none;
}
/* A cell composing a rebus dashes its outline, as in the grid (the inset shadow would
   fill the dashes in, so it goes). */
html.phone .clue-item .list-cell.list-cursor.composing {
  border-width: 2px;
  border-style: dashed;
  box-shadow:   none;
}

/* Landscape phones (the query and its reason are defined in phone.css). .solve-top has no
   box there, so the strip's rule is drawn by the view's ::before, which spans it; the
   bar loses its own top rule, and the stage's right edge, the stage/keyboard divide,
   stands in for the keyboard's (a plain list takes the whole width, so has none). */
@media screen and (orientation: landscape) and (max-height: 500px) {
  html.phone #solve-view::before { border-bottom: 2px solid var(--theme-color-header-rule); }
  html.phone #solve-bar { border-top: none; }
  html.phone #solve-stage { border-right: 1px solid var(--theme-color-bar-border); }
  html.phone.kb-left #solve-stage { border-right: none; border-left: 1px solid var(--theme-color-bar-border); }
  html.phone #solve-view:has(> #drawn-kb[hidden]) #solve-stage { border: none; }
  /* The full clue hangs below the strip, so its edge and shadow face down. */
  html.phone #clue-full {
    border-top: none;
    border-bottom: 1px solid var(--theme-color-bar-border);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
}

/* ── Per-tool selectors (body class hook: .tool-<name>) ─────────────────────
   Each tool's <body> carries a class like .tool-snake-charmer so these rules
   scope to the right tool without a separate per-tool CSS file. Plain sizing and
   spacing that reads no --theme-* token belongs in the tool's template base.css
   instead. */

/* Snake Charmer */
.tool-snake-charmer .cell.secondary-entry { fill: var(--theme-color-secondary-entry); }
.tool-snake-charmer .cell.active-cell.secondary-entry {
  fill:         var(--theme-color-secondary-active);
  stroke:       var(--theme-color-secondary-active-stroke);
  stroke-width: 1.5;
}

/* Marching Bands — band fills are unnamespaced to keep :where() specificity
   below .cell.active-entry (0,2,0); .band-even/.band-odd are MB-exclusive.
   Prefixing with .tool-marching-bands would raise these to 0,2,0 too, tying
   with active-entry and leaving the winner to source order (wrong) — dead
   CSS in other tools, but harmless since the classes are MB-exclusive. */
.cell:where(.band-even) { fill: var(--theme-color-band-even); }
.cell:where(.band-odd)  { fill: var(--theme-color-cell-bg); }
.cell.band-even.active-entry { fill: var(--theme-color-highlight-band-even); }
.tool-marching-bands .band-label  { font-family: var(--theme-font-cell); fill: var(--theme-color-muted); }
.tool-marching-bands .row-label   { font-family: var(--theme-font-cell); fill: var(--theme-color-text); }
.tool-marching-bands .cell-center { fill: var(--theme-color-cell-center); }
.tool-marching-bands .clue-group:hover          { background: var(--theme-color-clue-hover); }
.tool-marching-bands .clue-group.active-clue    { background: var(--theme-color-active-clue); }
.tool-marching-bands .clue-group.secondary-entry { background: var(--theme-color-secondary-entry); }
.tool-marching-bands #direction-chevron { stroke-width: 1.6; }

/* Spiral */
.tool-spiral #center-curl       { fill: none; stroke: var(--theme-color-curl); stroke-width: 1.4; stroke-linecap: round; }
.tool-spiral #direction-chevron { stroke-width: 0.9; }
/* Marching Bands when stacked */
/* Opaque background is load-bearing, not cosmetic: .puzzle-center is
   position:sticky over the clues (its base.css), which scroll directly
   underneath it in the same horizontal space — without this, clue text
   would show through the sticky grid as it scrolls. */
.tool-marching-bands .puzzle-center { background: var(--theme-color-bg); }

/* Crushword */
.tool-crushword .cell-block  { fill: var(--theme-color-cell-center); }
/* Every Crushword cell composes from its first keystroke, so the shared
   dashed outline would flag nothing; reset to plain .active-cell. */
.tool-crushword .cell.active-cell.composing { stroke-width: 1.5; stroke-dasharray: none; }
/* Deliberately static: a blink competes for attention in a dense grid. */
.tool-crushword .cell-caret { fill: var(--theme-color-cell-text); pointer-events: none; }

}
@layer phone {
/* Phone solving view (html.phone; shared/engine-phone.mjs): structure. Its colors are in
   theme-components.css. This file is the `phone` cascade layer (composeThemeCss), above
   the shared, tool and theme layers, so a rule here overrides any desktop rule without
   having to out-specify it. The html.phone prefix on every rule only scopes it to the
   phone layout. */

/* Everything the phone layout shows has moved out of .puzzle-body. What's left includes
   the grid's box (Marching Bands' sticky, opaque .puzzle-center), which would otherwise
   float empty over the page. #controls goes with it, holding only the desktop toggle by
   now. */
html.phone .puzzle-body,
html.phone #keys-btn { display: none; }

html.phone body.has-clue-bar { padding-top: 0; }

/* The phone view is one screen high however tall its frame is. setupEmbedResize reads
   this marker (fillsView) to ask an embedding host for a screen-high frame
   (docs/CROSS_TOOL_SPEC.md → "Embedding — auto-sizing"). */
html.phone { --fills-view: 1; }

/* The view and its keyboard run edge to edge, with nothing above them on screen: the
   top bar and the Clues screen show the header and instructions (setupPhoneLayout).
   They still print, with a gutter. */
html.phone .puzzle-main { max-width: none; padding: 0; }
html.phone .puzzle-header,
html.phone #instructions { padding-left: 16px; padding-right: 16px; }
@media screen {
  html.phone .puzzle-header,
  html.phone #instructions { display: none; }
}
/* The copies fill their container, a pane or a card, rather than keep the page's
   centered reading column. */
html.phone .list-instructions,
html.phone .intro-text { max-width: none; }
html.phone .list-instructions { margin: 0 0 16px; }
/* The card's own gap spaces it from Start. */
html.phone .intro-text { margin: 0; }

/* One screen high, in normal page flow (below the header, which only prints), and
   nothing in it is sticky or fixed. In a frame, 100svh is the frame's height, which the
   host makes one screen high (setupEmbedResize's `fill`). */
html.phone #solve-view {
  height: 100svh;
  display: flex;
  flex-direction: column;
  position: relative;
  /* No double-tap zoom on anything in the view: keys, the bar's steps and the list's
     cells are all tapped fast. It limits every descendant, so none repeats it. */
  touch-action: manipulation;
}
/* The congrats card's buttons, at the tap minimum. */
html.phone #congrats-actions button { min-height: var(--tap-min); padding: 0 16px; }
/* First-visit instructions (setupPhoneLayout): a card over the whole view. */
html.phone #intro {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
html.phone .intro-card {
  max-height: 100%;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
html.phone .intro-card > button { align-self: center; min-width: 120px; min-height: var(--tap-min); }

/* Top bar: title, Clues/Grid, menu, 52px high to leave the buttons clear of the
   divider below. The menu panel opens below it, absolutely, since a fixed panel would
   stay put while the bar scrolls with the page. */
html.phone .solve-top {
  flex: none;
  min-height: 52px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px 0 12px;
}
/* The title's slot, which the done-wrong banner covers while it shows (setupPhoneLayout).
   Its text is clipped to the slot, so the bar keeps its height. */
html.phone .solve-head-slot {
  flex: 1;
  min-width: 0;
  align-self: stretch;
  display: flex;
  position: relative;
}
html.phone .solve-head-slot #done-wrong {
  position: absolute;
  inset: 4px 0;
  display: flex;
  align-items: center;
  margin: 0;
  padding: 0 10px;
  overflow: hidden;
  font-size: 0.85rem;
  line-height: 1.2;
}
/* The title, up to two lines, over the byline: the bar takes its height from them once,
   at load, so a long title costs the grid a line instead of being cut off. */
html.phone .solve-head {
  flex: 1;
  align-self: center;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 4px 0;
}
html.phone .solve-title {
  font-weight: bold;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}
html.phone .solve-byline {
  font-size: 0.8rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
html.phone #clues-btn { flex: none; height: var(--tap-min); min-width: 64px; }
html.phone #menu-btn { position: static; flex: none; width: var(--tap-min); height: var(--tap-min); }
html.phone #help-btn {
  position: static;
  flex: none;
  width: var(--tap-min);
  height: var(--tap-min);
}
html.phone #menu-panel { position: absolute; top: 100%; right: 8px; z-index: 10; }
/* The help panel opens under its own button, right of ☰'s: the bar's 4px padding, ☰'s
   width and a gap. */
html.phone #help-panel {
  position: absolute;
  top: 100%;
  right: calc(4px + var(--tap-min) + 8px);
  z-index: 10;
}
/* The menus' rows at the tap minimum. */
html.phone #menu-panel .menu-toggle,
html.phone #menu-panel #clear-btn,
html.phone #help-panel button { min-height: var(--tap-min); }

/* The stage takes what the bars leave. The grid fills it, and the SVG's viewBox scales
   it to fit; the ID rules below undo each tool's desktop sizing. */
html.phone #solve-stage { flex: 1; min-height: 0; }
html.phone #grid-pane { height: 100%; padding: 6px 8px; }
html.phone #grid-pane > *,
html.phone #ring-svg,
html.phone #spiral-svg,
html.phone #puzzle-svg { width: 100%; height: 100%; max-width: none; }
html.phone #ring-container { margin-top: 0; min-width: 0; }

/* The zoomed grid's edge shadows (addEdgeShadows in engine-phone.mjs): a strip inside
   the grid's SVG along each side beyond which more grid lies (#grid-pane[data-more],
   from attachSvgZoom's onEdges). They fade rather than hide, since they change as the
   view moves. Colors in theme-components.css. */
.edge-shadows { pointer-events: none; }
.edge-shadow {
  opacity: 0;
  transition: opacity 0.15s;
}
html.phone #grid-pane[data-more~="top"]    .edge-shadow[data-side="top"],
html.phone #grid-pane[data-more~="bottom"] .edge-shadow[data-side="bottom"],
html.phone #grid-pane[data-more~="left"]   .edge-shadow[data-side="left"],
html.phone #grid-pane[data-more~="right"]  .edge-shadow[data-side="right"] { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .edge-shadow { transition: none; }
}
html.phone #grid-wrap { display: block; }

/* Not overscroll-behavior: contain. Until the solver scrolls the view flush, the pane
   fills most of the screen, and a swipe that couldn't pass to the page at the list's
   end would leave the keyboard reachable only by its sliver on screen. */
html.phone #list-pane {
  height: 100%;
  overflow-y: auto;
  padding: 8px 16px;
}

/* The fill-in list (setupFillList): each clue's cell row on a line of its own below the
   clue. Cells are 36px squares, a long entry wrapping onto more lines; under
   html.list-nowrap (the options menu) they shrink instead, to keep it on one line. 36px,
   not MIN_TAP's 44: near a grid cell's feel, and a ten-cell entry still fits a small
   phone in two lines. A letter scales with its cell (cqw) and, in a rebus cell, with
   its length (--len). The clue text takes the rest of the first line, so a long clue
   wraps beside its number instead of dropping below it as an item of its own. */
html.phone .clue-item { flex-wrap: wrap; }
html.phone .clue-item > .clue-text { flex: 1 1 0; min-width: 0; }
html.phone .list-cells {
  flex: 0 0 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 3px;
  margin: 4px 0 2px;
}
html.phone .list-cell {
  flex: none;
  width: 36px;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  container-type: inline-size;
  cursor: pointer;
  position: relative; /* anchors a mark's ::after (theme-components.css) */
}
html.phone .list-letter {
  font-size: min(55cqw, calc(100cqw / (var(--len, 1) + 0.2)));
  font-weight: bold;
  line-height: 1;
  white-space: nowrap;
}
/* Crushword's caret, a bar between two letters of the cursor's cell as in the grid. Its
   margins give it a gap of its own, which the letter size reserves (the 0.2 above), so it
   shows even at the edge of a full cell. */
html.phone .list-caret {
  display: inline-block;
  width: 0.07em;
  height: 0.9em;
  margin: 0 0.05em;
  vertical-align: -0.1em;
  background: currentColor;
}
html.phone.list-nowrap .list-cells { flex-wrap: nowrap; }
html.phone.list-nowrap .list-cell { flex: 1 1 0; width: auto; min-width: 0; max-width: 36px; }

/* Bar row: one clue, at most two lines, between the ‹ › steps. Its height is fixed, so
   a clue of any length leaves the grid where it is. The desktop bar's gutter for
   #menu-btn goes, since the button is in the top bar now. */
html.phone #solve-bar { flex: none; height: 48px; display: flex; position: relative; }
html.phone .bar-step {
  flex: none;
  width: var(--tap-min);
  padding: 0;
  border: none;
  font-size: 1.5rem;
}
/* The desktop bar's position and z-index don't belong in the bar row. */
html.phone #active-clue-bar {
  position: static;
  z-index: auto;
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  padding: 0 4px;
  border-bottom: none;
}
/* Marching Bands' navigator takes the same bar row, so the same fixed height and
   two-line clamp. Its row or band and clue count stack in a column at the left. */
html.phone #clue-navigator {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 4px;
}
/* Clear of the clue, so the label reads as a label. */
html.phone .nav-meta + .nav-text { margin-left: 8px; }
html.phone .nav-meta {
  flex: none;
  align-self: center;
  display: flex;
  flex-direction: column;
  font-size: 0.7rem;
  line-height: 1.25;
  white-space: nowrap;
}
html.phone .nav-label { font-weight: bold; font-size: 0.8rem; }
html.phone .nav-text {
  flex: 1;
  align-self: center;
  min-width: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}
html.phone #active-clue-secondary { display: none; }
/* A cut-off clue in full (setupClueExpand): over the bar row, growing up over the foot
   of the grid as far as the clue needs, so nothing else moves. */
html.phone #clue-full {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  min-height: 100%;
  max-height: 50svh;
  overflow-y: auto;
  padding: 8px 12px;
}
html.phone #active-clue-primary .active-clue-text {
  white-space: normal;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
}

/* Drawn keyboard. Every row has a fixed height, an empty one too, so both layers are
   the same height. Keys shrink to fit the row (min-width: 0, no padding): only their
   height has to meet the tap minimum. */
html.phone #drawn-kb {
  flex: none;
  display: flex;

html.phone .kb-layer > .kb-row:nth-child(2) { padding: 0 5%; }

  height: 100%;

html.phone #drawn-kb .kb-bottom button { font-size: 0.8rem; line-height: 1.15; white-space: pre-line; }
html.phone #drawn-kb .kb-wide { flex-grow: 2; font-weight: bold; }
html.phone #drawn-kb .kb-arrow { width: 1.1rem; height: 1.1rem; fill: currentColor; }

html.phone .kb-spacer { flex: 7 1 0; }

/* Landscape phones: a strip across the top (title, buttons) over the stage at the left
   and, at the right, the drawn keyboard with the clue bar above it. CSS alone:
   setupPhoneLayout builds the same DOM in both orientations, so rotating switches live.

   max-height: phones in landscape are shorter than 500px; taller touch screens keep the
   stacked layout, which has room for it (and which nobody has been able to test side by
   side). Keep shared/engine-phone.mjs's LANDSCAPE_PHONE in step.

   .solve-top is display: contents because the title and the buttons, its children, must
   be items of the one grid that also holds the stage, the clue bar and the keyboard.

   Columns: the first is the stage; the rest add up to --kb-w, the right column, and end
   in the three button columns (auto, so a hashed page's missing help button leaves no
   hole). The title spans the strip up to the buttons. Rows: the strip, the clue bar
   (whatever the keyboard leaves of the column), the keyboard.

   --kb-w: 55% keeps the keys as wide as portrait's on the narrowest phone; past 400px
   wider keys gain nothing, and the grid (a wide Crushword grid above all) can use the
   width. */
@media screen and (orientation: landscape) and (max-height: 500px) {
  html.phone #solve-view {
    --strip-h: 54px;
    --kb-w: min(55%, 400px);
    display: grid;
    grid-template-columns: calc(100% - var(--kb-w)) minmax(0, 1fr) auto auto auto;
    grid-template-rows: var(--strip-h) minmax(0, 1fr) auto;
  }
  /* Key height: the tap minimum, unless the screen is too short to leave the clue bar
     its own tap minimum above four rows of keys; then the rows shrink, to 32px at the
     least. What is taken off the height: the keyboard's padding and gaps (6 + 10 + 3 * 6)
     and its safe area. */
  html.phone #solve-view {
    --key-h: clamp(32px, calc((100svh - var(--strip-h) - var(--tap-min) - 34px - env(safe-area-inset-bottom)) / 4), var(--tap-min));
  }
  /* The strip's rule (theme-components.css), spanning the buttons too. */
  html.phone #solve-view::before { content: ''; grid-area: 1 / 1 / 2 / -1; }
  html.phone .solve-top { display: contents; }
  html.phone .solve-head-slot { grid-area: 1 / 1 / 2 / 3; margin-left: 12px; }
  /* The bottom margin, the rule's width, centers the buttons above the strip's rule. */
  html.phone #clues-btn { grid-area: 1 / 3; align-self: center; margin: 0 4px 2px; }
  html.phone #help-btn { grid-area: 1 / 4; align-self: center; margin-bottom: 2px; }
  html.phone #menu-btn { grid-area: 1 / 5; align-self: center; margin: 0 4px 2px 0; }
  html.phone #solve-stage { grid-area: 2 / 1 / 4 / 2; min-width: 0; }
  /* Static, so #clue-full is placed against the view, not the bar. The bar takes the
     column's height the keyboard leaves, so a long clue gets room. */
  html.phone #solve-bar { grid-area: 2 / 2 / 3 / -1; height: auto; min-width: 0; position: static; }
  /* The clue shows as many lines as the bar has height for. line-clamp takes only a
     whole number, so the height is queried in steps, one line (about 20px) apiece, from
     the two lines portrait has. The container is the bar's child, not the bar:
     containment would make the bar the containing block of #clue-full. */
  html.phone #active-clue-bar,
  html.phone #clue-navigator { container-type: size; }
  @container (min-height: 60px) {
    html.phone .nav-text,
    html.phone #active-clue-primary .active-clue-text { -webkit-line-clamp: 3; line-clamp: 3; }
  }
  @container (min-height: 80px) {
    html.phone .nav-text,
    html.phone #active-clue-primary .active-clue-text { -webkit-line-clamp: 4; line-clamp: 4; }
  }
  @container (min-height: 100px) {
    html.phone .nav-text,
    html.phone #active-clue-primary .active-clue-text { -webkit-line-clamp: 5; line-clamp: 5; }
  }
  /* A little more under the keys than portrait has, as the keyboard sits at the screen's
     foot here. */
  html.phone #drawn-kb {
    grid-area: 3 / 2 / 4 / -1;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  /* One line: the byline doesn't fit the strip with it. */
  html.phone .solve-title { -webkit-line-clamp: 1; line-clamp: 1; }
  /* With .solve-top boxless the panels' containing block is the view, hence the
     explicit top. The help panel is taller than the shortest phones, so it scrolls
     inside itself. */
  html.phone #menu-panel,
  html.phone #help-panel {
    top: var(--strip-h);
    max-height: calc(100svh - var(--strip-h));
    overflow-y: auto;
  }
  /* A clue still cut off in the bar opens in full from the strip down, at the
     keyboard's width, over the bar and the top of the keys. */
  html.phone #clue-full {
    top: var(--strip-h);
    bottom: auto;
    left: auto;
    right: 0;
    width: var(--kb-w);
    min-height: 0;
    max-height: calc(100svh - var(--strip-h));
  }
  /* Keyboard on the left (the options menu's row, shared/engine-phone.mjs): the right
     column swaps with the stage, under the same strip. */
  html.phone.kb-left #solve-view {
    grid-template-columns: var(--kb-w) minmax(0, 1fr) auto auto auto;
  }
  html.phone.kb-left #solve-stage { grid-area: 2 / 2 / 4 / -1; }
  html.phone.kb-left #solve-bar { grid-area: 2 / 1 / 3 / 2; }
  html.phone.kb-left #drawn-kb { grid-area: 3 / 1 / 4 / 2; }
  html.phone.kb-left #clue-full { left: 0; right: auto; }
  /* A plain list (Marching Bands) hides the keyboard on the Clues screen, so the list
     takes the whole width. */
  html.phone #solve-view:has(> #drawn-kb[hidden]) #solve-stage { grid-column: 1 / -1; }
}

@layer print {
/* Shared print resets, applied to every tool and theme: prints the blank, unsolved
   puzzle regardless of solve state or theme. This file and the tool's print.css after
   it are the `print` cascade layer, the last one (composeThemeCss), so every rule here
   wins over any screen rule whatever its selector, with no !important: a theme that
   adds a more specific highlight rule can't defeat the print reset. Between this file
   and a tool's print.css the usual rules hold (specificity, then order).

   A screen rule still applies in print unless a print rule overrides it, so a print
   rule that relies on a container being flex or grid must declare that display itself:
   a narrow-screen breakpoint may have set display: block on it. */
@media print {
  /* Hide interaction chrome */
  #active-clue-bar,
  #controls,
  #congrats-dialog,
  #keys-overlay,
  #keys-btn,
  #menu-btn,
  #menu-panel,
  #help-btn,
  #help-panel,
  #done-wrong,
  .switch-tip,
  #direction-chevron,
  .solve-top,
  #solve-bar,
  .edge-shadows,
  #drawn-kb { display: none; }

  body { padding-top: 0; }
  h1.title { font-size: 1.4rem; }

  /* A tighter page than on screen, the same in every tool */
  .puzzle-main     { padding: 8px 16px; }
  .puzzle-header   { margin-bottom: 8px; }
  .byline          { font-size: 0.8rem; }
  #instructions    { font-size: 0.8rem; margin-bottom: 8px; }
  .clue-section h2 { margin-bottom: 4px; }
  .clue-item       { margin-bottom: 0; padding: 1px 4px; break-inside: avoid; }
  .cell-num        { fill: #555; }

  /* Cell state → plain ink on white */
  .cell,
  .cell.active-entry,
  .cell.active-cell,
  .cell.secondary-entry { fill: #fff; stroke: #999; stroke-width: 1; stroke-dasharray: none; }

  /* Entered letters and their marks → blank: a printout is always the unsolved puzzle */
  .cell-letter,
  .mark-layer { display: none; }
  /* ...and the phone list view's cell rows (setupFillList), which repeat them */
  .list-cells { display: none; }

  /* Clue highlight / filled-dimming reset */
  .clue-item.active-clue,
  .clue-item.secondary-entry { background: transparent; }
  .clue-item.filled .clue-text { opacity: 1; text-decoration: none; }

  /* Ink on paper: a dark theme's light text and dark page would otherwise print as
     near-white on white (backgrounds don't print by default) or, with them on, as a
     dark page. The text elements a theme colors individually inherit the body's. */
  body { background: #fff; color: #000; }
  h1.title,
  .byline,
  .instructions,
  .clue-section h2 { color: inherit; }

  /* A link prints in the color of the text around it: a theme's link color is chosen
     against its screen background, which paper doesn't have. */
  a { color: inherit; }

  /* The phone layout prints its own arrangement: the page's gutter is on the header and
     instructions (phone.css), and .puzzle-body is empty there. The html.phone prefix is
     what outranks the .puzzle-main rule above and each tool's print.css, which shares
     this layer and sets .puzzle-body. */
  html.phone .puzzle-main { padding: 0; }
  html.phone .puzzle-body { display: none; }
}

/* Shared print resets live in shared/themes/print-base.css (just before this file,
   in the same cascade layer). Only spiral-specific print rules belong here. */
@media print {
  .puzzle-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "center center"
      "left   right";
  }

}

@media print and (orientation: landscape) {
  .puzzle-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) min(40%, 500px) minmax(0, 1fr);
    grid-template-areas: "left center right";
    gap: 0 16px;

}
